<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SquareDoom Map Editor</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAgY0hSTQAAeiYAAICEAAD6AAAAgOgAAHUwAADqYAAAOpgAABdwnLpRPAAAABl0RVh0U29mdHdhcmUAUGFpbnQuTkVUIHYzLjUuNUmK/OAAAABJSURBVChTY2RgYPgPxAz7zxWBKDhwNOqDs/8DJeEYpAHGh2kGC0A5GIpBRoMlkXUhi4EVoJuApgGhG9ktSJowHIXpSGQj0a0EACQ+faihsYgcAAAAAElFTkSuQmCC" />
  <style>
:root {
  --bg: #12141a;
  --panel: #1c1f28;
  --border: #2e3340;
  --text: #e4e6eb;
  --muted: #8b91a0;
  --accent: #d4a017;
  --danger: #c44;
  --btn: #2a3040;
  --btn-hover: #3a4258;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

h1 {
  margin: 0;
  font-size: 1.15rem;
  letter-spacing: 0.04em;
  color: var(--accent);
}

h2 {
  margin: 0 0 0.5rem;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 600;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-wrap: wrap;
  flex: 0 0 auto;
}

.toolbar-actions {
  display: flex;
  gap: 0.4rem;
}

.status {
  margin: 0;
  font-size: 0.8rem;
  color: var(--muted);
  flex: 1;
  text-align: right;
}

.status.error {
  color: #f88;
}

.file-gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.55);
  padding: 1rem;
}

.file-gate-card {
  width: min(22rem, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 1.1rem 1.2rem 1.2rem;
}

.file-gate-card h2 {
  margin-bottom: 0.65rem;
  text-transform: none;
  letter-spacing: 0.02em;
  color: var(--text);
  font-size: 1rem;
}

.file-gate-card .muted {
  margin: 0 0 1rem;
  font-size: 0.85rem;
  line-height: 1.35;
}

.file-gate-card .btn-row {
  margin-top: 0;
}

.file-gate-primary {
  border-color: var(--accent);
  color: var(--accent);
}

.layout {
  display: grid;
  grid-template-columns: 200px 1fr 240px;
  gap: 0;
  flex: 1;
  min-height: 0;
}

.left,
.right {
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 0.75rem;
  overflow-y: auto;
  min-height: 0;
}

.right {
  border-right: none;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0;
  padding-bottom: 0.75rem;
}

.right-editors {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-bottom: 0.75rem;
}

.shift-controls {
  flex: 0 0 auto;
  margin-top: auto;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
}

.shift-row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0.5rem;
  margin: 0 auto 0.5rem;
}

.shift-pad {
  display: grid;
  grid-template-columns: repeat(3, 2rem);
  grid-template-rows: repeat(2, 2rem);
  gap: 4px;
}

.shift-height {
  display: grid;
  grid-template-rows: repeat(2, 2rem);
  gap: 4px;
}

.shift-btn.shift-up {
  grid-column: 2;
  grid-row: 1;
}

.shift-btn.shift-left {
  grid-column: 1;
  grid-row: 2;
}

.shift-btn.shift-down {
  grid-column: 2;
  grid-row: 2;
}

.shift-btn.shift-right {
  grid-column: 3;
  grid-row: 2;
}

.shift-btn {
  width: 2rem;
  height: 2rem;
  min-height: 0;
  padding: 0;
  font-size: 1rem;
  line-height: 1;
  display: grid;
  place-items: center;
}

.shift-btn.height {
  width: 2rem;
  height: 2rem;
}

.shift-controls .muted {
  margin: 0;
  font-size: 0.7rem;
  text-align: center;
}

.preview-panel {
  flex: 0 0 auto;
  padding: 0.75rem 0 0;
  border-top: 1px solid var(--border);
}

.preview-panel h2 {
  text-align: center;
}

.preview-frame {
  width: 100%;
  aspect-ratio: 4 / 3;
  border: 1px solid var(--border);
  background: #0a0a0c;
  overflow: hidden;
}

#preview-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  -ms-interpolation-mode: nearest-neighbor;
  background: #0a0a0c;
  cursor: grab;
  touch-action: none;
}

#preview-canvas:active {
  cursor: grabbing;
}

.preview-res {
  display: flex;
  gap: 0.75rem;
  margin: 0.45rem 0 0;
  font-size: 0.72rem;
  color: var(--muted);
}

.preview-res label {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  flex: 1;
}

.preview-res input[type="number"] {
  width: 3.5rem;
  min-width: 0;
  padding: 0.2rem 0.3rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
}

.preview-panel .muted {
  margin: 0.35rem 0 0;
  font-size: 0.7rem;
  text-align: center;
}

.center {
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-height: 0;
  overflow: hidden;
}

.center > h2 {
  flex: 0 0 auto;
}

.map-stage {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#map-canvas {
  image-rendering: pixelated;
  cursor: crosshair;
  border: 1px solid var(--border);
  background: #0a0a0c;
  outline: none;
  display: block;
  max-width: 100%;
  max-height: 100%;
}

.hint {
  flex: 0 0 auto;
  font-size: 0.75rem;
  color: var(--muted);
  margin: 0.5rem 0 0;
  text-align: center;
}

button {
  background: var(--btn);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 0.35rem 0.65rem;
  font-size: 0.8rem;
  cursor: pointer;
  border-radius: 2px;
}

button:hover {
  background: var(--btn-hover);
}

button.active,
button.armed {
  border-color: var(--accent);
  color: var(--accent);
}

button.danger {
  border-color: var(--danger);
  color: #f99;
}

.level-list ul {
  list-style: none;
  margin: 0 0 1rem;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.level-list button {
  width: 100%;
  text-align: left;
}

.item-palette {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.palette-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  cursor: grab;
  font-size: 0.65rem;
  color: var(--muted);
  user-select: none;
}

.palette-item:active {
  cursor: grabbing;
}

.palette-item img {
  width: 24px;
  height: 24px;
  image-rendering: pixelated;
}

.panel .muted {
  color: var(--muted);
  font-size: 0.8rem;
}

.field {
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  margin-bottom: 0.55rem;
  font-size: 0.8rem;
}

.field > span {
  color: var(--muted);
}

.field input[type="number"],
.field input[type="text"],
.field select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.4rem;
  font-size: 0.85rem;
  width: 100%;
}

.color-swatches {
  display: flex;
  flex-wrap: nowrap;
  gap: 2px;
  width: 100%;
}

.swatch {
  flex: 1 1 0;
  width: auto;
  min-width: 0;
  height: 14px;
  aspect-ratio: auto;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 1px;
}

.swatch.selected {
  border-color: #fff;
  outline: 1px solid var(--accent);
  outline-offset: 0;
  z-index: 1;
}

.check-field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.45rem;
}

.check-field input {
  width: auto;
  margin: 0;
  accent-color: var(--accent);
}

.field select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.4rem;
  font-size: 0.85rem;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.75rem;
}

.skill-row {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.skill-row label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  text-transform: capitalize;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .left,
  .right {
    max-height: none;
    border: none;
    border-bottom: 1px solid var(--border);
  }
}

  </style>
</head>
<body>
  <header class="toolbar">
    <h1>SquareDoom</h1>
    <div class="toolbar-actions">
      <button type="button" id="btn-save">Save</button>
      <button type="button" id="btn-load">Load</button>
      <button type="button" id="btn-cook">Cook</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </header>

  <main class="layout">
    <aside class="left">
      <section id="level-list"></section>
      <section>
        <h2>Items</h2>
        <div id="item-palette"></div>
      </section>
    </aside>

    <section class="center">
      <h2>Map <span id="map-level-label"></span></h2>
      <div class="map-stage" id="map-stage">
        <canvas id="map-canvas" tabindex="0"></canvas>
      </div>
      <p class="hint">
        Drag box select · Ctrl+drag add · Click select · Shift+click paint · Del clears
      </p>
    </section>

    <aside class="right">
      <div class="right-editors">
        <div id="tile-editor"></div>
        <div id="item-editor"></div>
      </div>
      <div id="preview-panel" class="preview-panel panel">
        <h2>Camera preview</h2>
        <div class="preview-frame">
          <canvas id="preview-canvas" tabindex="0"></canvas>
        </div>
        <div class="preview-res">
          <label>
            Rays
            <input type="number" id="preview-rays" min="8" max="320" value="40" />
          </label>
          <label>
            Col H
            <input type="number" id="preview-col-h" min="8" max="240" value="25" />
          </label>
        </div>
        <p class="muted" id="preview-hint">Place or select a camera</p>
      </div>
      <div id="shift-controls"></div>
    </aside>
  </main>

/** Blocks player/enemy walk; shots and hitscan pass. */

function isDoorSector(sector) {
  return (sector?.sectorType ?? 0) === DOOR_SECTOR_TYPE;
}

function isWindowSector(sector) {
  return (sector?.sectorType ?? 0) === WINDOW_SECTOR_TYPE;
}

/** Types that resolve a targetTag when cooking (Window does not). */
function sectorTypeNeedsTarget(type) {
  const t = (type ?? 0) & 0xff;
  return t !== 0 && t !== WINDOW_SECTOR_TYPE;
}

const ITEM_TYPES = [
  'spawn', 'soldier', 'imp', 'pinky', 'caco', 'baron', 'barrel',
  'health', 'shells', 'shotgun', 'chaingun', 'chainsaw',
  'greenarmor', 'bluearmor', 'backpack',
  'redcard', 'bluecard', 'yellowcard',
  'skullpile', 'techcolumn',
  'switch_opendoor', 'switch_endlevel', 'switch_lowerlift',
  'fireball',
];

/** Spawn stays in ITEM_TYPES for typeId/gfx index 0; not placed in the item table. */
const SPAWN_TYPE = 'spawn';
const CAMERA_TYPE = 'camera';
/** Palette placeable; fans out to switch_* cook types. */
const SWITCH_TYPE = 'switch';
/** Runtime-only (missile); not placeable in the editor. */
const FIREBALL_TYPE = 'fireball';

/** Switch actions → cooked ITEM_TYPES entries (share switch.png). */
const SWITCH_ACTIONS = [
  { id: 'open_door', name: 'Open door', cookType: 'switch_opendoor' },
  { id: 'end_level', name: 'End level', cookType: 'switch_endlevel' },
  { id: 'lower_lift', name: 'Lower lift', cookType: 'switch_lowerlift' },
];

const SWITCH_COOK_TYPES = new Set(SWITCH_ACTIONS.map((a) => a.cookType));

/** Palette + map placement (spawn is level.spawn; camera is editor-only). */
const EDITOR_ITEM_TYPES = [
  ...ITEM_TYPES.filter((t) => !SWITCH_COOK_TYPES.has(t) && t !== FIREBALL_TYPE),
  SWITCH_TYPE,
  CAMERA_TYPE,
];

function isGameItem(type) {
  return type !== CAMERA_TYPE && type !== SPAWN_TYPE;
}

function isCamera(item) {
  return item?.type === CAMERA_TYPE;
}

function isSpawn(item) {
  return item?.type === SPAWN_TYPE;
}

function isSwitchCookType(type) {
  return SWITCH_COOK_TYPES.has(type);
}

function isSwitch(item) {
  return item?.type === SWITCH_TYPE || isSwitchCookType(item?.type);
}

function defaultSwitchAction() {
  return SWITCH_ACTIONS[0].id;
}

function normalizeSwitchAction(action) {
  if (SWITCH_ACTIONS.some((a) => a.id === action)) return action;
  const byCook = SWITCH_ACTIONS.find((a) => a.cookType === action);
  return byCook?.id ?? defaultSwitchAction();
}

function switchCookType(action) {
  const a = SWITCH_ACTIONS.find((x) => x.id === normalizeSwitchAction(action));
  return a.cookType;
}

/** Map legacy/cook type ids to editor switch fields. */
function coerceSwitchItem(it) {
  if (it.type === SWITCH_TYPE) {
    return {
      type: SWITCH_TYPE,
      x: it.x,
      y: it.y,
      switchAction: normalizeSwitchAction(it.switchAction),
      targetTag: String(it.targetTag ?? '').trim(),
    };
  }
  if (isSwitchCookType(it.type)) {
    return {
      type: SWITCH_TYPE,
      x: it.x,
      y: it.y,
      switchAction: normalizeSwitchAction(it.type),
      targetTag: String(it.targetTag ?? '').trim(),
    };
  }
  return null;
}

/** Radians ↔ cooked playera byte (0..255 full circle). */
function angleToByte(rad) {
  const t = Number(rad) || 0;
  return ((Math.round((t / (Math.PI * 2)) * 256) % 256) + 256) % 256;
}

function byteToAngle(b) {
  return ((b & 0xff) / 256) * Math.PI * 2;
}

function defaultSpawn() {
  return { type: SPAWN_TYPE, x: 128, y: 128, angle: 0 };
}

function gameItemCount(level) {
  return level.items.filter((it) => isGameItem(it.type)).length;
}

function getSectorAtWorld(level, wx, wy) {
  const { tx, ty } = worldToTile(wx, wy);
  const id = getCell(level, tx, ty);
  if (!id || !level.sectors.has(id)) return null;
  return level.sectors.get(id);
}

/** Eye height for a camera at world coords: sector floor + 3. */
function getCameraEyeHeight(level, wx, wy) {
  const sector = getSectorAtWorld(level, wx, wy);
  return (sector?.floorHeight ?? 0) + 3;
}

/**
 * Preview viewpoint: selected spawn/camera, else first camera, else spawn.
 * @returns {{x:number,y:number,angle:number}|null}
 */
function findPreviewCamera(level, selectedItem) {
  if (isSpawn(selectedItem) || isCamera(selectedItem)) return selectedItem;
  return level.items.find((it) => isCamera(it)) ?? level.spawn ?? null;
}

/** Map markers: spawn first, then items (for hit-test topmost). */
function mapMarkers(level) {
  return level.spawn ? [level.spawn, ...level.items] : [...level.items];
}

function colorHex(index) {
  return C64_HEX[index & 15] || C64_HEX[0];
}

/** Normalize JSON colour (legacy name or 0–15) to a C64 index. */
function normalizeColor(value, fallback = 0) {
  if (typeof value === 'number' && Number.isFinite(value)) {
    return Math.max(0, Math.min(15, value | 0));
  }
  if (typeof value === 'string' && value in LEGACY_COLOR_TO_C64) {
    return LEGACY_COLOR_TO_C64[value];
  }
  const asNum = Number(value);
  if (Number.isFinite(asNum)) return Math.max(0, Math.min(15, asNum | 0));
  return fallback;
}

/** @deprecated use colorHex / normalizeColor */
const COLORS = C64_NAMES;
/** @deprecated use C64_HEX / colorHex */
const COLOR_HEX = Object.fromEntries(C64_NAMES.map((n, i) => [n, C64_HEX[i]]));

function colorIndex(value) {
  return normalizeColor(value, 0);
}

function defaultSector() {
  return {
    floorHeight: 8,
    ceilingHeight: 13,
    sectorType: 0,
    /** Editor-only name; baked away — used to resolve targetTag → sector id. */
    tag: '',
    /** Editor-only; when sectorType ≠ 0, names the target sector's tag. */
    targetTag: '',
    floorColor: 0,
    ceilingColor: 0,
    brightness: 7,
  };
}

function cloneSector(s) {
  return { ...s };
}

function sectorsEqual(a, b) {
  return (
    a.floorHeight === b.floorHeight &&
    a.ceilingHeight === b.ceilingHeight &&
    a.sectorType === b.sectorType &&
    (a.tag || '') === (b.tag || '') &&
    (a.targetTag || '') === (b.targetTag || '') &&
    a.floorColor === b.floorColor &&
    a.ceilingColor === b.ceilingColor &&
    a.brightness === b.brightness
  );
}

/** Find sector id whose tag matches (first / lowest id). 0 if none. */
function findSectorIdByTag(level, tag) {
  const t = String(tag || '').trim();
  if (!t) return 0;
  const ids = [...level.sectors.keys()].sort((a, b) => a - b);
  for (const id of ids) {
    if ((level.sectors.get(id).tag || '').trim() === t) return id;
  }
  return 0;
}

function defaultSkills() {
  return { easy: true, normal: true, hard: true };
}

function clampLevelName(name) {
  return String(name ?? '').trim().slice(0, LEVEL_NAME_LEN);
}

function createEmptyLevel() {
  return {
    /** Display name (max LEVEL_NAME_LEN); cooked into binary. */
    name: '',
    /** @type {Map<number, ReturnType<typeof defaultSector>>} sectorId -> data (1..255) */
    sectors: new Map(),
    /** @type {Uint8Array} */
    map: new Uint8Array(MAP_CELLS),
    /** Player start — always present; cooked separately from items. */
    spawn: defaultSpawn(),
    /** @type {Array<{type:string,x:number,y:number,skills?:object,angle?:number}>} */
    items: [],
  };
}

function createEpisode() {
  /** @type {Record<string, ReturnType<typeof createEmptyLevel>>} */
  const levels = {};
  for (const name of LEVEL_NAMES) {
    levels[name] = createEmptyLevel();
  }
  return {
    levels,
    activeLevel: 'E1M1',
  };
}

function cellIndex(tx, ty) {
  return ty * MAP_SIZE + tx;
}

function getCell(level, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_SIZE || ty >= MAP_SIZE) return 0;
  return level.map[cellIndex(tx, ty)];
}

function setCell(level, tx, ty, sectorId) {
  level.map[cellIndex(tx, ty)] = sectorId;
}

function worldToTile(wx, wy) {
  return {
    tx: Math.max(0, Math.min(MAP_SIZE - 1, wx >> 3)),
    ty: Math.max(0, Math.min(MAP_SIZE - 1, wy >> 3)),
  };
}

function clampWorld(v) {
  return Math.max(0, Math.min(WORLD_MAX, v | 0));
}

/** Allocate next free sector id 1..255, or 0 if full. */
function allocSectorId(level) {
  for (let id = 1; id <= MAX_SECTORS; id++) {
    if (!level.sectors.has(id)) return id;
  }
  return 0;
}

function sectorCellCount(level, sectorId) {
  let n = 0;
  for (let i = 0; i < MAP_CELLS; i++) {
    if (level.map[i] === sectorId) n++;
  }
  return n;
}

function dropSectorIfEmpty(level, sectorId) {
  if (sectorId === 0) return;
  if (sectorCellCount(level, sectorId) === 0) {
    level.sectors.delete(sectorId);
  }
}

/** Create default sector on empty cell; returns new id or 0. */
function paintDefaultSector(level, tx, ty) {
  const id = allocSectorId(level);
  if (!id) return 0;
  level.sectors.set(id, defaultSector());
  setCell(level, tx, ty, id);
  return id;
}

/**
 * Paint existing sector onto a cell if result stays a filled ≤15×15 rectangle.
 * Returns true on success.
 */
function paintSector(level, tx, ty, sectorId) {
  if (!level.sectors.has(sectorId)) return false;
  if (!canAddTileToSector(level, sectorId, tx, ty)) return false;
  const old = getCell(level, tx, ty);
  setCell(level, tx, ty, sectorId);
  dropSectorIfEmpty(level, old);
  return true;
}

/**
 * Split: copy sector data into a new id for this cell only.
 * Returns new id or 0.
 */
function splitSectorAt(level, tx, ty) {
  const old = getCell(level, tx, ty);
  if (old === 0 || !level.sectors.has(old)) return 0;
  const id = allocSectorId(level);
  if (!id) return 0;
  level.sectors.set(id, cloneSector(level.sectors.get(old)));
  setCell(level, tx, ty, id);
  dropSectorIfEmpty(level, old);
  return id;
}

/** Clear a single tile. */
function clearTile(level, tx, ty) {
  const old = getCell(level, tx, ty);
  setCell(level, tx, ty, 0);
  dropSectorIfEmpty(level, old);
  return old;
}

/** Delete all tiles of a sector. */
function deleteSector(level, sectorId) {
  if (sectorId === 0) return;
  for (let i = 0; i < MAP_CELLS; i++) {
    if (level.map[i] === sectorId) level.map[i] = 0;
  }
  level.sectors.delete(sectorId);
}

/**
 * Shift all map tiles and items by dx/dy tile steps.
 * Content that moves off the map is discarded.
 */
function shiftLevel(level, dx, dy) {
  const old = level.map;
  const next = new Uint8Array(MAP_CELLS);
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      const id = old[cellIndex(tx, ty)];
      if (!id) continue;
      const ntx = tx + dx;
      const nty = ty + dy;
      if (ntx >= 0 && ntx < MAP_SIZE && nty >= 0 && nty < MAP_SIZE) {
        next[cellIndex(ntx, nty)] = id;
      }
    }
  }
  level.map = next;

  for (const id of [...level.sectors.keys()]) {
    if (sectorCellCount(level, id) === 0) level.sectors.delete(id);
  }

  const kept = [];
  for (const it of level.items) {
    const nx = it.x + dx * WORLD_PER_TILE;
    const ny = it.y + dy * WORLD_PER_TILE;
    if (nx >= 0 && nx <= WORLD_MAX && ny >= 0 && ny <= WORLD_MAX) {
      it.x = nx;
      it.y = ny;
      kept.push(it);
    }
  }
  level.items.length = 0;
  level.items.push(...kept);

  if (level.spawn) {
    const sx = level.spawn.x + dx * WORLD_PER_TILE;
    const sy = level.spawn.y + dy * WORLD_PER_TILE;
    if (sx >= 0 && sx <= WORLD_MAX && sy >= 0 && sy <= WORLD_MAX) {
      level.spawn.x = sx;
      level.spawn.y = sy;
    }
  }
}

/** All occupied map cells. */
function occupiedTiles(level) {
  const out = [];
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      if (getCell(level, tx, ty)) out.push({ tx, ty });
    }
  }
  return out;
}

/** Items whose containing tile is in the given tile list. */
function itemsInTiles(level, tiles) {
  const keys = new Set(tiles.map(({ tx, ty }) => tileKey(tx, ty)));
  return level.items.filter((it) => {
    const tx = Math.floor(it.x / WORLD_PER_TILE);
    const ty = Math.floor(it.y / WORLD_PER_TILE);
    return keys.has(tileKey(tx, ty));
  });
}

/**
 * Raise/lower floor and ceiling together by delta on listed tiles.
 * Each height is clamped independently to 0–31.
 */
function nudgeTileHeights(level, tiles, delta) {
  if (!delta) return;
  for (const { tx, ty } of tiles) {
    const cur = getTileProps(level, tx, ty);
    if (!cur) continue;
    const next = cloneSector(cur);
    next.floorHeight = clampNum(cur.floorHeight + delta, 0, 31);
    next.ceilingHeight = clampNum(cur.ceilingHeight + delta, 0, 31);
    setTileProps(level, tx, ty, next);
  }
  rebuildSectors(level);
}

/**
 * Merge identical sectors only when the unified tile set is a filled ≤15×15 rectangle.
 * Invalid / non-mergeable groups keep separate ids (lowest id kept as rep).
 */
function mergeIdenticalSectors(level) {
  // First split any already-invalid ids into shape-legal pieces
  enforceSectorShapes(level);

  const ids = [...level.sectors.keys()].sort((a, b) => a - b);
  /** @type {Map<number, number>} */
  const remap = new Map();
  /** @type {{ sector: object, id: number, tiles: {tx:number,ty:number}[] }[]} */
  const reps = [];

  for (const id of ids) {
    const s = level.sectors.get(id);
    if (!s) continue;
    const tiles = tilesInSector(level, id);
    if (!tiles.length) continue;
    let found = null;
    for (const r of reps) {
      if (!sectorsEqual(r.sector, s)) continue;
      const union = r.tiles.concat(tiles);
      if (!tilesAreValidSectorShape(union)) continue;
      found = r;
      break;
    }
    if (found) {
      remap.set(id, found.id);
      found.tiles = found.tiles.concat(tiles);
    } else {
      reps.push({ sector: s, id, tiles: tiles.slice() });
      remap.set(id, id);
    }
  }

  for (let i = 0; i < MAP_CELLS; i++) {
    const id = level.map[i];
    if (id && remap.has(id)) level.map[i] = remap.get(id);
  }

  for (const id of ids) {
    if (remap.get(id) !== id) level.sectors.delete(id);
  }
}

/**
 * Merge identical sectors and drop unused records.
 * Call after any tile property edit.
 */
function rebuildSectors(level) {
  mergeIdenticalSectors(level);
  for (const id of [...level.sectors.keys()]) {
    if (sectorCellCount(level, id) === 0) level.sectors.delete(id);
  }
}

function sectorCount(level) {
  return level.sectors.size;
}

/** All map cells that use the given sector id. */
function tilesInSector(level, sectorId) {
  const out = [];
  if (!sectorId) return out;
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      if (getCell(level, tx, ty) === sectorId) out.push({ tx, ty });
    }
  }
  return out;
}

/** @param {{tx:number,ty:number}[]} tiles */
function sectorBounds(tiles) {
  if (!tiles.length) return null;
  let minX = tiles[0].tx;
  let maxX = tiles[0].tx;
  let minY = tiles[0].ty;
  let maxY = tiles[0].ty;
  for (let i = 1; i < tiles.length; i++) {
    const t = tiles[i];
    if (t.tx < minX) minX = t.tx;
    if (t.tx > maxX) maxX = t.tx;
    if (t.ty < minY) minY = t.ty;
    if (t.ty > maxY) maxY = t.ty;
  }
  return { minX, maxX, minY, maxY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

/** @param {{tx:number,ty:number}[]} tiles */
function tilesFitSpan(tiles) {
  const b = sectorBounds(tiles);
  if (!b) return true;
  return b.w <= MAX_SECTOR_SPAN && b.h <= MAX_SECTOR_SPAN;
}

/**
 * Grid-convex: filled axis-aligned rectangle (no dents/L/C shapes).
 * Needed so SEC_SEEN cannot reveal items around a corner within one id.
 */
function tilesAreConvex(tiles) {
  if (tiles.length <= 1) return true;
  const b = sectorBounds(tiles);
  if (!b || tiles.length !== b.w * b.h) return false;
  const keys = new Set(tiles.map((t) => tileKey(t.tx, t.ty)));
  for (let ty = b.minY; ty <= b.maxY; ty++) {
    for (let tx = b.minX; tx <= b.maxX; tx++) {
      if (!keys.has(tileKey(tx, ty))) return false;
    }
  }
  return true;
}

/** Contiguous filled rectangle within MAX_SECTOR_SPAN. */
function tilesAreValidSectorShape(tiles) {
  return tilesAreConvex(tiles) && tilesFitSpan(tiles);
}

/** 4-connected contiguity. Empty set is contiguous. */
function tilesAreContiguous(tiles) {
  if (tiles.length <= 1) return true;
  const keys = new Set(tiles.map((t) => tileKey(t.tx, t.ty)));
  const start = tileKey(tiles[0].tx, tiles[0].ty);
  const seen = new Set([start]);
  const q = [start];
  const dirs = [
    [1, 0],
    [-1, 0],
    [0, 1],
    [0, -1],
  ];
  while (q.length) {
    const { tx, ty } = parseTileKey(q.shift());
    for (const [dx, dy] of dirs) {
      const nk = tileKey(tx + dx, ty + dy);
      if (!keys.has(nk) || seen.has(nk)) continue;
      seen.add(nk);
      q.push(nk);
    }
  }
  return seen.size === keys.size;
}

function sectorIsContiguous(level, sectorId) {
  return tilesAreContiguous(tilesInSector(level, sectorId));
}

function sectorIsConvex(level, sectorId) {
  return tilesAreConvex(tilesInSector(level, sectorId));
}

/**
 * True if painting sectorId onto (tx,ty) keeps a filled ≤15×15 rectangle.
 * Already owning the cell is always ok.
 */
function canAddTileToSector(level, sectorId, tx, ty) {
  if (!sectorId || !level.sectors.has(sectorId)) return false;
  if (getCell(level, tx, ty) === sectorId) return true;
  const tiles = tilesInSector(level, sectorId);
  if (!tiles.length) return true;
  return tilesAreValidSectorShape(tiles.concat([{ tx, ty }]));
}

/**
 * Partition tiles into filled rectangles each ≤ MAX_SECTOR_SPAN on either axis.
 * @param {{tx:number,ty:number}[]} tiles
 * @returns {{tx:number,ty:number}[][]}
 */
function splitTilesIntoValidChunks(tiles) {
  if (!tiles.length) return [];
  const remaining = new Set(tiles.map((t) => tileKey(t.tx, t.ty)));
  /** @type {{tx:number,ty:number}[][]} */
  const chunks = [];

  while (remaining.size) {
    let x0 = MAP_SIZE;
    let y0 = MAP_SIZE;
    for (const k of remaining) {
      const { tx, ty } = parseTileKey(k);
      if (ty < y0 || (ty === y0 && tx < x0)) {
        x0 = tx;
        y0 = ty;
      }
    }
    let maxW = 0;
    while (
      maxW < MAX_SECTOR_SPAN &&
      remaining.has(tileKey(x0 + maxW, y0))
    ) {
      maxW++;
    }
    let bestW = 1;
    let bestH = 1;
    for (let w = maxW; w >= 1; w--) {
      let h = 0;
      growH: while (h < MAX_SECTOR_SPAN) {
        for (let x = x0; x < x0 + w; x++) {
          if (!remaining.has(tileKey(x, y0 + h))) break growH;
        }
        h++;
      }
      if (h > 0 && w * h >= bestW * bestH) {
        bestW = w;
        bestH = h;
      }
    }
    /** @type {{tx:number,ty:number}[]} */
    const chunk = [];
    for (let ty = y0; ty < y0 + bestH; ty++) {
      for (let tx = x0; tx < x0 + bestW; tx++) {
        remaining.delete(tileKey(tx, ty));
        chunk.push({ tx, ty });
      }
    }
    chunks.push(chunk);
  }
  return chunks;
}

/**
 * Remap tiles of sectorId onto filled ≤15×15 rectangles (first keeps id).
 * @returns {string[]} warning messages
 */
function splitSectorIntoContiguousComponents(level, sectorId) {
  /** @type {string[]} */
  const warnings = [];
  const tiles = tilesInSector(level, sectorId);
  if (!tiles.length) return warnings;
  if (tilesAreValidSectorShape(tiles)) return warnings;

  const chunks = splitTilesIntoValidChunks(tiles);
  if (chunks.length <= 1) return warnings;

  const src = level.sectors.get(sectorId);
  if (!src) return warnings;

  for (let i = 1; i < chunks.length; i++) {
    const nid = allocSectorId(level);
    if (!nid) {
      warnings.push(`Sector ${sectorId}: no free ids to split remaining tiles`);
      break;
    }
    level.sectors.set(nid, cloneSector(src));
    for (const { tx, ty } of chunks[i]) {
      setCell(level, tx, ty, nid);
    }
    warnings.push(
      `Sector ${sectorId}: split rect onto id ${nid} (${chunks[i].length} tiles)`,
    );
  }
  return warnings;
}

/**
 * Fix every sector that is non-rectangular or larger than MAX_SECTOR_SPAN.
 * @returns {string[]}
 */
function enforceSectorShapes(level) {
  /** @type {string[]} */
  const warnings = [];
  const ids = [...level.sectors.keys()].sort((a, b) => a - b);
  for (const id of ids) {
    warnings.push(...splitSectorIntoContiguousComponents(level, id));
  }
  return warnings;
}

/**
 * @returns {{ ok: boolean, issues: string[] }}
 */
function validateAllSectors(level) {
  /** @type {string[]} */
  const issues = [];
  for (const id of [...level.sectors.keys()].sort((a, b) => a - b)) {
    const tiles = tilesInSector(level, id);
    if (!tiles.length) continue;
    if (!tilesAreConvex(tiles)) {
      issues.push(`Sector ${id}: not a filled rectangle (convex)`);
    }
    const b = sectorBounds(tiles);
    if (b && (b.w > MAX_SECTOR_SPAN || b.h > MAX_SECTOR_SPAN)) {
      issues.push(`Sector ${id}: bbox ${b.w}×${b.h} exceeds ${MAX_SECTOR_SPAN}`);
    }
  }
  return { ok: issues.length === 0, issues };
}

function getTileProps(level, tx, ty) {
  const id = getCell(level, tx, ty);
  if (!id || !level.sectors.has(id)) return null;
  return cloneSector(level.sectors.get(id));
}

/** Place props on a tile (allocates a fresh sector id). Returns id or 0. */
function setTileProps(level, tx, ty, props) {
  const old = getCell(level, tx, ty);
  const id = allocSectorId(level);
  if (!id) return 0;
  level.sectors.set(id, cloneSector(props));
  setCell(level, tx, ty, id);
  dropSectorIfEmpty(level, old);
  return id;
}

/**
 * Add a tile at (tx,ty). Uses brush props if provided, else default.
 * Prefers extending an adjacent matching sector when legal; otherwise new id.
 * Returns true on success, false if no free id.
 * Sets level._lastPaintNote when extend was skipped due to span/convexity.
 */
function addTile(level, tx, ty, brush = null) {
  level._lastPaintNote = null;
  const props = brush ? cloneSector(brush) : defaultSector();

  if (brush) {
    const dirs = [
      [1, 0],
      [-1, 0],
      [0, 1],
      [0, -1],
    ];
    /** @type {number[]} */
    const matching = [];
    for (const [dx, dy] of dirs) {
      const nx = tx + dx;
      const ny = ty + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_SIZE || ny >= MAP_SIZE) continue;
      const nid = getCell(level, nx, ny);
      if (!nid) continue;
      const s = level.sectors.get(nid);
      if (s && sectorsEqual(s, props)) matching.push(nid);
    }
    for (const nid of matching) {
      if (canAddTileToSector(level, nid, tx, ty)) {
        paintSector(level, tx, ty, nid);
        rebuildSectors(level);
        return true;
      }
    }
    if (matching.length) {
      level._lastPaintNote =
        'New sector id: adjacent match cannot grow (must stay a ≤15×15 rectangle)';
    }
  }

  if (!setTileProps(level, tx, ty, props)) return false;
  rebuildSectors(level);
  return true;
}

/**
 * Apply a property patch to all listed tiles. Empty tiles are skipped.
 * Rebuilds sectors afterward.
 */
function applyTilePatch(level, tiles, patch) {
  for (const { tx, ty } of tiles) {
    const cur = getTileProps(level, tx, ty);
    if (!cur) continue;
    const next = cloneSector(cur);
    if ('floorHeight' in patch) next.floorHeight = clampNum(patch.floorHeight, 0, 31);
    if ('ceilingHeight' in patch) next.ceilingHeight = clampNum(patch.ceilingHeight, 0, 31);
    if ('sectorType' in patch) next.sectorType = clampNum(patch.sectorType, 0, 255);
    if ('tag' in patch) next.tag = String(patch.tag ?? '').trim();
    if ('targetTag' in patch) next.targetTag = String(patch.targetTag ?? '').trim();
    if ('brightness' in patch) next.brightness = clampNum(patch.brightness, 0, 7);
    if ('floorColor' in patch) next.floorColor = normalizeColor(patch.floorColor);
    if ('ceilingColor' in patch) next.ceilingColor = normalizeColor(patch.ceilingColor);
    setTileProps(level, tx, ty, next);
  }
  rebuildSectors(level);
}

/** Clear multiple tiles, then rebuild. */
function clearTiles(level, tiles) {
  for (const { tx, ty } of tiles) clearTile(level, tx, ty);
  rebuildSectors(level);
}

/**
 * Move tiles by (dtx, dty). Off-map tiles are deleted.
 * Returns the new tile positions that remain on the map.
 */
function moveTiles(level, tiles, dtx, dty) {
  if (!dtx && !dty) return tiles.map((t) => ({ ...t }));

  const entries = [];
  for (const { tx, ty } of tiles) {
    const props = getTileProps(level, tx, ty);
    if (!props) continue;
    entries.push({ tx, ty, props });
  }

  for (const e of entries) clearTile(level, e.tx, e.ty);

  const placed = [];
  for (const e of entries) {
    const ntx = e.tx + dtx;
    const nty = e.ty + dty;
    if (ntx < 0 || ntx >= MAP_SIZE || nty < 0 || nty >= MAP_SIZE) continue;
    setTileProps(level, ntx, nty, e.props);
    placed.push({ tx: ntx, ty: nty });
  }
  rebuildSectors(level);
  return placed;
}

/**
 * Move items by world delta. Removes items that leave the map.
 * Returns the items that remain.
 */
function moveItemsBy(level, items, dx, dy) {
  const kept = [];
  for (const it of items) {
    const nx = it.x + dx;
    const ny = it.y + dy;
    if (nx < 0 || nx > WORLD_MAX || ny < 0 || ny > WORLD_MAX) {
      if (isSpawn(it)) {
        it.x = clampWorld(nx);
        it.y = clampWorld(ny);
        kept.push(it);
      } else {
        removeItem(level, it);
      }
      continue;
    }
    it.x = nx;
    it.y = ny;
    kept.push(it);
  }
  return kept;
}

function clampNum(v, lo, hi) {
  return Math.max(lo, Math.min(hi, Number(v) || 0));
}

function tileKey(tx, ty) {
  return `${tx},${ty}`;
}

function parseTileKey(key) {
  const [tx, ty] = key.split(',').map(Number);
  return { tx, ty };
}

/**
 * Merge source sector into target if union is a filled ≤15×15 rectangle.
 * Returns true on success.
 */
function mergeSectors(level, targetId, sourceId) {
  if (targetId === sourceId || !targetId || !sourceId) return false;
  if (!level.sectors.has(targetId) || !level.sectors.has(sourceId)) return false;
  const union = tilesInSector(level, targetId).concat(tilesInSector(level, sourceId));
  if (!tilesAreValidSectorShape(union)) return false;
  for (let i = 0; i < MAP_CELLS; i++) {
    if (level.map[i] === sourceId) level.map[i] = targetId;
  }
  level.sectors.delete(sourceId);
  return true;
}

function hasSpawn(level) {
  return !!level.spawn;
}

/** Place or move the level spawn (always exactly one). */
function setSpawn(level, x, y, angle) {
  if (!level.spawn) level.spawn = defaultSpawn();
  level.spawn.type = SPAWN_TYPE;
  level.spawn.x = clampWorld(x);
  level.spawn.y = clampWorld(y);
  if (angle !== undefined) level.spawn.angle = Number(angle) || 0;
  return level.spawn;
}

function addItem(level, type, x, y, skills = defaultSkills()) {
  if (type === SPAWN_TYPE) {
    return setSpawn(level, x, y);
  }
  if (type === CAMERA_TYPE) {
    const item = {
      type: CAMERA_TYPE,
      x: clampWorld(x),
      y: clampWorld(y),
      angle: 0,
    };
    level.items.push(item);
    return item;
  }
  if (type === SWITCH_TYPE || isSwitchCookType(type)) {
    if (gameItemCount(level) >= MAX_ITEMS) return null;
    const item = {
      type: SWITCH_TYPE,
      x: clampWorld(x),
      y: clampWorld(y),
      switchAction: isSwitchCookType(type)
        ? normalizeSwitchAction(type)
        : defaultSwitchAction(),
      targetTag: '',
    };
    level.items.push(item);
    return item;
  }
  if (gameItemCount(level) >= MAX_ITEMS) return null;
  const item = {
    type,
    x: clampWorld(x),
    y: clampWorld(y),
    skills: { ...skills },
  };
  level.items.push(item);
  return item;
}

function removeItem(level, item) {
  if (isSpawn(item)) return; // spawn is required
  const i = level.items.indexOf(item);
  if (i >= 0) level.items.splice(i, 1);
}

function moveItem(level, item, x, y) {
  item.x = clampWorld(x);
  item.y = clampWorld(y);
}

/** True if selection ref is still on the level (spawn or items). */
function itemStillOnLevel(level, item) {
  if (isSpawn(item)) return level.spawn === item;
  return level.items.includes(item);
}

function activeLevel(episode) {
  return episode.levels[episode.activeLevel];
}

// ---- js/io.js ----
/**
 * Cooked binary layout (no header), per level — structure-of-arrays:
 *   1. Sector attribute tables: 7 × 256 bytes (index = sector id; byte 0 unused)
 *      order: floor, ceil, sectorType, targetSector, floorColor, ceilingColor, brightness
 *      targetSector is the resolved sector id (from editor targetTag); 0 if type is 0 / unresolved
 *      editor tag strings are not stored in the binary
 *   2. Map: 1024 bytes sector ids
 *   3. Spawn: 3 bytes — x, y, angleByte (playera 0..255)
 *   4. Items: 48 * 4 bytes: typeId, x, y, skillBits
 *      skillBits: bit0=easy, bit1=normal, bit2=hard (non-switch items)
 *      switches: typeId = switch_* action; byte3 = target sector id (from targetTag)
 *      unused item slots: typeId=0xFF
 *      spawn is not an item (typeId 0 unused in table)
 *   5. sector_max: 1 byte — max sector id used in map or sector table
 *   6. name: LEVEL_NAME_LEN (20) bytes — ASCII, null-padded
 * Colors: 0..15 = Commodore 64 palette
 * typeId: index into ITEM_TYPES (0-based); 0xFF = empty slot
 */

const SECTOR_TABLE_COUNT = 7;		 // floor, ceil, type, target, fcol, ccol, bright
const SECTOR_TABLE_SIZE = 256;		 // index = sector id; [0] unused
const ITEM_BYTES = 4;
const SPAWN_BYTES = 3;
const EMPTY_ITEM_TYPE = 0xff;

function levelToJSON(level) {
  const sectorObj = {};
  for (const [id, s] of level.sectors) {
    sectorObj[String(id)] = {
      floorHeight: s.floorHeight,
      ceilingHeight: s.ceilingHeight,
      sectorType: s.sectorType ?? 0,
      tag: s.tag || '',
      targetTag: s.targetTag || '',
      floorColor: s.floorColor,
      ceilingColor: s.ceilingColor,
      brightness: s.brightness,
    };
  }
  return {
    name: clampLevelName(level.name),
    sectors: sectorObj,
    map: Array.from(level.map),
    spawn: {
      x: level.spawn?.x ?? 0,
      y: level.spawn?.y ?? 0,
      angle: level.spawn?.angle ?? 0,
    },
    items: level.items.map((it) => {
      const base = {
        type: it.type,
        x: it.x,
        y: it.y,
      };
      if (it.type === CAMERA_TYPE) {
        return { ...base, angle: it.angle ?? 0 };
      }
      if (isSwitch(it)) {
        const sw = coerceSwitchItem(it);
        return {
          type: SWITCH_TYPE,
          x: sw.x,
          y: sw.y,
          switchAction: sw.switchAction,
          targetTag: sw.targetTag,
        };
      }
      return { ...base, skills: { ...it.skills } };
    }),
  };
}

function levelFromJSON(data) {
  const level = createEmptyLevel();
  level.name = clampLevelName(data.name);
  if (data.sectors) {
    for (const [key, s] of Object.entries(data.sectors)) {
      const id = Number(key);
      if (id < 1 || id > MAX_SECTORS) continue;
      const d = defaultSector();
      let sectorType = clamp(s.sectorType ?? d.sectorType, 0, 255);
      // Migrate legacy door checkbox → Door sector type
      if (s.door && sectorType === 0) sectorType = DOOR_SECTOR_TYPE;
      level.sectors.set(id, {
        floorHeight: clamp(s.floorHeight ?? d.floorHeight, 0, 31),
        ceilingHeight: clamp(s.ceilingHeight ?? d.ceilingHeight, 0, 31),
        sectorType,
        tag: String(s.tag ?? d.tag ?? '').trim(),
        targetTag: String(s.targetTag ?? d.targetTag ?? '').trim(),
        floorColor: normalizeColor(s.floorColor, d.floorColor),
        ceilingColor: normalizeColor(s.ceilingColor, d.ceilingColor),
        brightness: clamp(s.brightness ?? d.brightness, 0, 7),
      });
    }
  }
  if (Array.isArray(data.map) && data.map.length === MAP_CELLS) {
    for (let i = 0; i < MAP_CELLS; i++) {
      level.map[i] = data.map[i] & 0xff;
    }
  }

  // Spawn: dedicated field, or migrate legacy item type "spawn"
  let legacySpawn = null;
  if (Array.isArray(data.items)) {
    for (const it of data.items) {
      if (it.type === CAMERA_TYPE) {
        level.items.push({
          type: CAMERA_TYPE,
          x: clamp(it.x ?? 0, 0, 255),
          y: clamp(it.y ?? 0, 0, 255),
          angle: Number(it.angle) || 0,
        });
        continue;
      }
      if (it.type === SPAWN_TYPE) {
        legacySpawn = it;
        continue;
      }
      const asSwitch = coerceSwitchItem(it);
      if (asSwitch) {
        if (gameItemCount(level) >= MAX_ITEMS) break;
        level.items.push(asSwitch);
        continue;
      }
      if (!ITEM_TYPES.includes(it.type) || !isGameItem(it.type)) continue;
      if (gameItemCount(level) >= MAX_ITEMS) break;
      level.items.push({
        type: it.type,
        x: clamp(it.x ?? 0, 0, 255),
        y: clamp(it.y ?? 0, 0, 255),
        skills: {
          easy: it.skills?.easy !== false,
          normal: it.skills?.normal !== false,
          hard: it.skills?.hard !== false,
        },
      });
    }
  }

  if (data.spawn) {
    setSpawn(
      level,
      data.spawn.x ?? 0,
      data.spawn.y ?? 0,
      data.spawn.angle ?? 0,
    );
  } else if (legacySpawn) {
    // Legacy: use spawn item xy; angle from item if present, else old hardcoded playera=250
    const ang =
      legacySpawn.angle != null
        ? Number(legacySpawn.angle) || 0
        : byteToAngle(250);
    setSpawn(level, legacySpawn.x ?? 0, legacySpawn.y ?? 0, ang);
  } else {
    level.spawn = defaultSpawn();
  }

  const shapeWarnings = enforceSectorShapes(level);
  if (shapeWarnings.length) {
    level._loadWarnings = shapeWarnings;
  }
  return level;
}

function episodeToJSON(episode) {
  const levels = {};
  for (const name of LEVEL_NAMES) {
    levels[name] = levelToJSON(episode.levels[name]);
  }
  return {
    format: 'squaredoom-map',
    version: 1,
    activeLevel: episode.activeLevel,
    levels,
  };
}

function episodeFromJSON(data) {
  const episode = createEpisode();
  if (data?.format !== 'squaredoom-map') {
    throw new Error('Unrecognized map format');
  }
  if (data.levels) {
    for (const name of LEVEL_NAMES) {
      if (data.levels[name]) {
        episode.levels[name] = levelFromJSON(data.levels[name]);
      }
    }
  }
  if (data.activeLevel && episode.levels[data.activeLevel]) {
    episode.activeLevel = data.activeLevel;
  }
  return episode;
}

function cookLevel(level) {
  /** @type {string[]} */
  const warnings = [];
  warnings.push(...enforceSectorShapes(level));

  const floors = new Uint8Array(SECTOR_TABLE_SIZE);
  const ceils = new Uint8Array(SECTOR_TABLE_SIZE);
  const types = new Uint8Array(SECTOR_TABLE_SIZE);
  const targets = new Uint8Array(SECTOR_TABLE_SIZE);
  const fcols = new Uint8Array(SECTOR_TABLE_SIZE);
  const ccols = new Uint8Array(SECTOR_TABLE_SIZE);
  const brights = new Uint8Array(SECTOR_TABLE_SIZE);

  for (let id = 1; id <= MAX_SECTORS; id++) {
    const s = level.sectors.get(id);
    if (!s) continue;
    const type = (s.sectorType ?? 0) & 0xff;
    let targetId = 0;
    if (sectorTypeNeedsTarget(type)) {
      const tag = (s.targetTag || '').trim();
      if (!tag) {
        warnings.push(`Sector ${id}: type ${type} has empty target tag`);
      } else {
        targetId = findSectorIdByTag(level, tag);
        if (!targetId) {
          warnings.push(`Sector ${id}: target tag "${tag}" not found`);
        }
      }
    }
    floors[id] = s.floorHeight & 31;
    ceils[id] = s.ceilingHeight & 31;
    types[id] = type;
    targets[id] = targetId & 0xff;
    fcols[id] = colorIndex(s.floorColor) & 15;
    ccols[id] = colorIndex(s.ceilingColor) & 15;
    brights[id] = s.brightness & 7;
  }

  const mapBytes = new Uint8Array(level.map);

  const gameItems = level.items.filter((it) => isGameItem(it.type));
  const itemTable = new Uint8Array(MAX_ITEMS * ITEM_BYTES);
  for (let i = 0; i < MAX_ITEMS; i++) {
    const off = i * ITEM_BYTES;
    const it = gameItems[i];
    if (!it) {
      itemTable[off] = EMPTY_ITEM_TYPE;
      continue;
    }
    if (isSwitch(it)) {
      const sw = coerceSwitchItem(it);
      const cookType = switchCookType(sw.switchAction);
      const typeId = ITEM_TYPES.indexOf(cookType);
      itemTable[off] = typeId < 0 ? EMPTY_ITEM_TYPE : typeId;
      itemTable[off + 1] = sw.x & 0xff;
      itemTable[off + 2] = sw.y & 0xff;
      const tag = (sw.targetTag || '').trim();
      let targetId = 0;
      if (!tag) {
        warnings.push(`Switch at (${sw.x},${sw.y}): empty target tag`);
      } else {
        targetId = findSectorIdByTag(level, tag);
        if (!targetId) {
          warnings.push(`Switch at (${sw.x},${sw.y}): target tag "${tag}" not found`);
        }
      }
      itemTable[off + 3] = targetId & 0xff;
      continue;
    }
    const typeId = ITEM_TYPES.indexOf(it.type);
    itemTable[off] = typeId < 0 ? EMPTY_ITEM_TYPE : typeId;
    itemTable[off + 1] = it.x & 0xff;
    itemTable[off + 2] = it.y & 0xff;
    let bits = 0;
    if (it.skills.easy) bits |= 1;
    if (it.skills.normal) bits |= 2;
    if (it.skills.hard) bits |= 4;
    itemTable[off + 3] = bits;
  }

  const spawn = level.spawn ?? defaultSpawn();
  const spawnBytes = new Uint8Array([
    spawn.x & 0xff,
    spawn.y & 0xff,
    angleToByte(spawn.angle),
  ]);

  // Highest sector id referenced by the map or present in the sector table
  let sectorMax = 0;
  for (let i = 0; i < mapBytes.length; i++) {
    if (mapBytes[i] > sectorMax) sectorMax = mapBytes[i];
  }
  for (const id of level.sectors.keys()) {
    if (id > sectorMax) sectorMax = id;
  }
  if (sectorMax > MAX_SECTORS) sectorMax = MAX_SECTORS;

  const sectorBytes = SECTOR_TABLE_COUNT * SECTOR_TABLE_SIZE;
  const nameBytes = new Uint8Array(LEVEL_NAME_LEN);
  const nameStr = clampLevelName(level.name);
  for (let i = 0; i < nameStr.length; i++) {
    nameBytes[i] = nameStr.charCodeAt(i) & 0x7f;
  }
  const out = new Uint8Array(
    sectorBytes + mapBytes.length + SPAWN_BYTES + itemTable.length + 1 + LEVEL_NAME_LEN,
  );
  let o = 0;
  out.set(floors, o); o += SECTOR_TABLE_SIZE;
  out.set(ceils, o); o += SECTOR_TABLE_SIZE;
  out.set(types, o); o += SECTOR_TABLE_SIZE;
  out.set(targets, o); o += SECTOR_TABLE_SIZE;
  out.set(fcols, o); o += SECTOR_TABLE_SIZE;
  out.set(ccols, o); o += SECTOR_TABLE_SIZE;
  out.set(brights, o); o += SECTOR_TABLE_SIZE;
  out.set(mapBytes, o); o += mapBytes.length;
  out.set(spawnBytes, o); o += SPAWN_BYTES;
  out.set(itemTable, o); o += itemTable.length;
  out[o] = sectorMax & 0xff;
  o += 1;
  out.set(nameBytes, o);
  return { bytes: out, warnings };
}

function clamp(v, lo, hi) {
  v = Number(v) || 0;
  return Math.max(lo, Math.min(hi, v));
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function pickJsonFile() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async () => {
      const file = input.files?.[0];
      if (!file) {
        resolve(null);
        return;
      }
      try {
        const text = await file.text();
        resolve(episodeFromJSON(JSON.parse(text)));
      } catch (err) {
        reject(err);
      }
    };
    // Ignore cancel (no change event in most browsers)
    input.addEventListener('cancel', () => resolve(null));
    input.click();
  });
}

const DEFAULT_EPISODE_PATH = 'episode1.json';

const HANDLE_DB = 'squaredoom-editor';
const HANDLE_STORE = 'handles';
const HANDLE_KEY = 'episode';

/** @type {FileSystemFileHandle | null} */
let episodeFileHandle = null;

function episodeFileName() {
  return episodeFileHandle?.name || DEFAULT_EPISODE_PATH;
}

function hasEpisodeFileHandle() {
  return !!episodeFileHandle;
}

function openHandleDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(HANDLE_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(HANDLE_STORE)) {
        db.createObjectStore(HANDLE_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function storeEpisodeHandle(handle) {
  episodeFileHandle = handle;
  if (!window.indexedDB || !handle) return;
  const db = await openHandleDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(HANDLE_STORE, 'readwrite');
    tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

async function loadStoredEpisodeHandle() {
  if (!window.indexedDB) return null;
  try {
    const db = await openHandleDb();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLE_STORE, 'readonly');
      const req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return handle || null;
  } catch (_) {
    return null;
  }
}

async function queryPermission(handle, mode = 'readwrite') {
  if (!handle?.queryPermission) return 'granted';
  return handle.queryPermission({ mode });
}

async function ensurePermission(handle, mode = 'readwrite') {
  if (!handle?.queryPermission || !handle?.requestPermission) return true;
  const opts = { mode };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  // Shows the browser Allow/Deny prompt (must run from a user gesture).
  return (await handle.requestPermission(opts)) === 'granted';
}

async function writeEpisodeToHandle(handle, episode) {
  const text = JSON.stringify(episodeToJSON(episode), null, 2);
  const writable = await handle.createWritable();
  await writable.write(text);
  await writable.close();
}

async function readEpisodeFromHandle(handle) {
  const file = await handle.getFile();
  return episodeFromJSON(JSON.parse(await file.text()));
}

/** Previously chosen episode file, if any (may still need an Allow click). */
async function getStoredEpisodeHandle() {
  return loadStoredEpisodeHandle();
}

/** Load without prompting — only when permission is already granted. */
async function tryRestoreEpisodeFile() {
  const handle = await loadStoredEpisodeHandle();
  if (!handle) return null;
  const writeState = await queryPermission(handle, 'readwrite');
  const readState = writeState === 'granted' ? 'granted' : await queryPermission(handle, 'read');
  if (readState !== 'granted') return null;
  episodeFileHandle = handle;
  return readEpisodeFromHandle(handle);
}

/**
 * Request Allow for a stored handle (call from a click), then load it.
 * @returns {Promise<object|null>}
 */
async function allowStoredEpisodeFile(handle) {
  if (!handle) return null;
  if (!(await ensurePermission(handle, 'readwrite'))) {
    if (!(await ensurePermission(handle, 'read'))) return null;
  }
  await storeEpisodeHandle(handle);
  return readEpisodeFromHandle(handle);
}

async function autosaveEpisodeJSON(episode) {
  if (!episodeFileHandle) {
    throw new Error(`Load ${DEFAULT_EPISODE_PATH} once so autosave can write it`);
  }
  if (!(await ensurePermission(episodeFileHandle, 'readwrite'))) {
    throw new Error(`No write permission for ${episodeFileHandle.name}`);
  }
  await writeEpisodeToHandle(episodeFileHandle, episode);
  return 'file';
}

async function saveEpisodeJSON(episode, suggestedName = DEFAULT_EPISODE_PATH) {
  if (episodeFileHandle && (await ensurePermission(episodeFileHandle, 'readwrite'))) {
    await writeEpisodeToHandle(episodeFileHandle, episode);
    return 'file';
  }

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: 'SquareDoom Map', accept: { 'application/json': ['.json'] } }],
      });
      await storeEpisodeHandle(handle);
      await writeEpisodeToHandle(handle, episode);
      return 'file';
    } catch (e) {
      if (e.name === 'AbortError') return null;
    }
  }

  const text = JSON.stringify(episodeToJSON(episode), null, 2);
  downloadBlob(new Blob([text], { type: 'application/json' }), suggestedName);
  return 'download';
}

async function loadEpisodeJSON() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'SquareDoom Map', accept: { 'application/json': ['.json'] } }],
        multiple: false,
      });
      await storeEpisodeHandle(handle);
      return readEpisodeFromHandle(handle);
    } catch (e) {
      if (e.name === 'AbortError') return null;
      // Fall through to <input type="file"> on SecurityError etc.
    }
  }
  return pickJsonFile();
}

function cookAndDownload(episode, levelName) {
  const level = episode.levels[levelName];
  const { bytes, warnings } = cookLevel(level);
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  downloadBlob(blob, `${levelName.toLowerCase()}.bin`);
  return warnings;
}

// ---- js/mapView.js ----
class MapView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} opts
   * @param {() => any} opts.getLevel
   * @param {() => {
   *   tiles: Set<string>,
   *   items: Set<any>,
   *   hoverTile: {tx:number,ty:number}|null,
   *   box: {x0:number,y0:number,x1:number,y1:number}|null,
   * }} opts.getSelection
   * @param {(ev: PointerEvent, info: object) => void} opts.onPointer
   * @param {(type: string, wx: number, wy: number) => void} opts.onDropItem
   * @param {Record<string, HTMLImageElement>} opts.images
   * @param {HTMLElement} [opts.stage]
   */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.opts = opts;
    this.cell = 18;
    this.stage = opts.stage || canvas.parentElement;
    this._ro = null;
    this.dragGrab = null;

    this.resize();
    this._ro = new ResizeObserver(() => this.resize());
    if (this.stage) this._ro.observe(this.stage);

    canvas.addEventListener('pointerdown', (e) => this.#onPointer(e));
    canvas.addEventListener('pointermove', (e) => this.#onPointer(e));
    canvas.addEventListener('pointerup', (e) => this.#onPointer(e));
    canvas.addEventListener('pointerleave', (e) => this.#onPointer(e));
    canvas.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      const type = e.dataTransfer.getData('text/item-type') || e.dataTransfer.getData('text/plain');
      if (!type) return;
      const { wx, wy } = this.#eventWorld(e);
      this.opts.onDropItem(type, wx, wy);
    });
  }

  resize() {
    if (!this.stage) return;
    const rect = this.stage.getBoundingClientRect();
    const pad = 2;
    const side = Math.max(64, Math.floor(Math.min(rect.width, rect.height) - pad));
    const cell = Math.max(4, Math.floor(side / MAP_SIZE));
    const px = cell * MAP_SIZE;
    if (cell === this.cell && this.canvas.width === px) return;
    this.cell = cell;
    this.canvas.width = px;
    this.canvas.height = px;
    this.canvas.style.width = `${px}px`;
    this.canvas.style.height = `${px}px`;
    this.draw();
  }

  #eventCanvas(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * this.canvas.width;
    const y = ((e.clientY - rect.top) / rect.height) * this.canvas.height;
    return { x, y };
  }

  #canvasToWorld(x, y) {
    const c = this.cell;
    return {
      wx: Math.max(0, Math.min(255, Math.round((x / c) * WORLD_PER_TILE))),
      wy: Math.max(0, Math.min(255, Math.round((y / c) * WORLD_PER_TILE))),
    };
  }

  #eventCell(e) {
    const { x, y } = this.#eventCanvas(e);
    const tx = Math.max(0, Math.min(MAP_SIZE - 1, Math.floor(x / this.cell)));
    const ty = Math.max(0, Math.min(MAP_SIZE - 1, Math.floor(y / this.cell)));
    return { tx, ty, px: x, py: y };
  }

  #eventWorld(e) {
    const { x, y } = this.#eventCanvas(e);
    return this.#canvasToWorld(x, y);
  }

  #itemDrawPos(it, c) {
    const ix = (it.x / WORLD_PER_TILE) * c;
    const iy = (it.y / WORLD_PER_TILE) * c;
    const spriteSize = Math.max(6, Math.round(c * 0.45));
    return { ix, iy, spriteSize };
  }

  #spriteSize(it, baseSize) {
    const img = this.opts.images[it.type];
    let drawW = baseSize;
    const drawH = baseSize;
    if (img?.complete && img.naturalWidth > 0) {
      drawW = drawH * (img.naturalWidth / img.naturalHeight);
    }
    return { drawW, drawH };
  }

  #hitItem(level, px, py) {
    const markers = level.spawn ? [...level.items, level.spawn] : level.items;
    for (let i = markers.length - 1; i >= 0; i--) {
      const it = markers[i];
      const { ix, iy, spriteSize } = this.#itemDrawPos(it, this.cell);
      const { drawW, drawH } = this.#spriteSize(it, spriteSize);
      const left = ix - drawW / 2;
      const top = iy - drawH / 2;
      if (px >= left && px <= left + drawW && py >= top && py <= top + drawH) return it;
    }
    return null;
  }

  #onPointer(e) {
    const { tx, ty, px, py } = this.#eventCell(e);
    const level = this.opts.getLevel();
    const item = this.#hitItem(level, px, py);

    if (e.type === 'pointerdown' && item) {
      const pos = this.#itemDrawPos(item, this.cell);
      this.dragGrab = { x: px - pos.ix, y: py - pos.iy };
    }
    if (e.type === 'pointerup' || e.type === 'pointerleave') {
      this.dragGrab = null;
    }

    const grab = this.dragGrab ?? { x: 0, y: 0 };
    const { wx, wy } = this.#canvasToWorld(px - grab.x, py - grab.y);

    this.opts.onPointer(e, {
      tx,
      ty,
      wx,
      wy,
      px,
      py,
      item,
      sectorId: getCell(level, tx, ty),
      shift: e.shiftKey,
      ctrl: e.ctrlKey || e.metaKey,
    });
  }

  #sectorFill(level, id) {
    if (id === 0) return '#1a1a1e';
    const s = level.sectors.get(id);
    if (!s) return '#333';
    const base = colorHex(s.floorColor) || '#444';
    return mixHex(base, 0.35 + (s.floorHeight / 31) * 0.25 + ((id * 17) % 7) * 0.03);
  }

  draw() {
    const level = this.opts.getLevel();
    const sel = this.opts.getSelection();
    const ctx = this.ctx;
    const c = this.cell;
    if (!c) return;

    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    for (let ty = 0; ty < MAP_SIZE; ty++) {
      for (let tx = 0; tx < MAP_SIZE; tx++) {
        const id = getCell(level, tx, ty);
        ctx.fillStyle = this.#sectorFill(level, id);
        ctx.fillRect(tx * c, ty * c, c, c);
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= MAP_SIZE; i++) {
      ctx.moveTo(i * c + 0.5, 0);
      ctx.lineTo(i * c + 0.5, MAP_SIZE * c);
      ctx.moveTo(0, i * c + 0.5);
      ctx.lineTo(MAP_SIZE * c, i * c + 0.5);
    }
    ctx.stroke();

    // Lightly hatch all tiles in the selection's shared sector
    const sectorId = sharedSelectionSector(level, sel.tiles);
    if (sectorId) {
      ctx.fillStyle = whiteHatchPattern(ctx);
      for (const { tx, ty } of tilesInSector(level, sectorId)) {
        ctx.fillRect(tx * c, ty * c, c, c);
      }
    }

    // Selected tiles
    if (sel.tiles?.size) {
      ctx.fillStyle = 'rgba(255, 220, 80, 0.28)';
      ctx.strokeStyle = 'rgba(255, 220, 80, 0.95)';
      ctx.lineWidth = Math.max(1, Math.round(c / 9));
      for (const key of sel.tiles) {
        const [tx, ty] = key.split(',').map(Number);
        ctx.fillRect(tx * c, ty * c, c, c);
        ctx.strokeRect(tx * c + 1, ty * c + 1, c - 2, c - 2);
      }
    }

    // Marquee box
    if (sel.box) {
      const x0 = Math.min(sel.box.x0, sel.box.x1);
      const y0 = Math.min(sel.box.y0, sel.box.y1);
      const x1 = Math.max(sel.box.x0, sel.box.x1);
      const y1 = Math.max(sel.box.y0, sel.box.y1);
      const px = x0 * c;
      const py = y0 * c;
      const pw = (x1 - x0 + 1) * c;
      const ph = (y1 - y0 + 1) * c;
      ctx.fillStyle = 'rgba(120, 180, 255, 0.12)';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = 'rgba(120, 180, 255, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
      ctx.setLineDash([]);
    }

    // Hover tile
    if (sel.hoverTile) {
      const { tx, ty } = sel.hoverTile;
      if (!sel.tiles?.has(tileKey(tx, ty))) {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx * c + 0.5, ty * c + 0.5, c - 1, c - 1);
      }
    }

    const markers = level.spawn ? [level.spawn, ...level.items] : level.items;
    for (const it of markers) {
      const { ix, iy, spriteSize } = this.#itemDrawPos(it, c);
      const { drawW, drawH } = this.#spriteSize(it, spriteSize);
      const left = ix - drawW / 2;
      const top = iy - drawH / 2;
      const img = this.opts.images[it.type];
      if (img && img.complete) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, left, top, drawW, drawH);
      } else {
        ctx.fillStyle = '#fa0';
        ctx.fillRect(left, top, drawW, drawH);
      }
      // Facing tick for spawn / camera (matches preview: sin θ, −cos θ)
      if (it.type === 'spawn' || it.type === 'camera') {
        const ang = it.angle ?? 0;
        const len = Math.max(4, spriteSize * 0.55);
        ctx.strokeStyle = it.type === 'spawn' ? '#0f0' : '#4af';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ix, iy);
        ctx.lineTo(ix + Math.sin(ang) * len, iy - Math.cos(ang) * len);
        ctx.stroke();
      }
      if (sel.items?.has(it)) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(left - 1, top - 1, drawW + 2, drawH + 2);
      }
    }
  }
}

function mixHex(a, t) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(a);
  if (!m) return a;
  let r = parseInt(m[1], 16);
  let g = parseInt(m[2], 16);
  let b = parseInt(m[3], 16);
  const lift = Math.floor(40 * t);
  r = Math.min(255, r + lift);
  g = Math.min(255, g + lift);
  b = Math.min(255, b + lift);
  return `rgb(${r},${g},${b})`;
}

let _hatchPattern = null;

function whiteHatchPattern(ctx) {
  if (_hatchPattern) return _hatchPattern;
  const size = 6;
  const off = document.createElement('canvas');
  off.width = size;
  off.height = size;
  const o = off.getContext('2d');
  o.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  o.lineWidth = 1;
  o.beginPath();
  o.moveTo(-1, size - 1);
  o.lineTo(size - 1, -1);
  o.moveTo(0, size + 1);
  o.lineTo(size + 1, 0);
  o.stroke();
  _hatchPattern = ctx.createPattern(off, 'repeat');
  return _hatchPattern;
}

/** Sector id shared by every selected tile, or 0 if empty/mixed/void. */
function sharedSelectionSector(level, tiles) {
  if (!tiles?.size) return 0;
  let sectorId = 0;
  let first = true;
  for (const key of tiles) {
    const [tx, ty] = key.split(',').map(Number);
    const id = getCell(level, tx, ty);
    if (first) {
      sectorId = id;
      first = false;
    } else if (id !== sectorId) {
      return 0;
    }
  }
  return sectorId;
}

// ---- js/previewView.js ----
const DEFAULT_RAYS = 40;
const DEFAULT_COL_H = 25;
const FOV = Math.PI / 2.1;
const MAX_DEPTH = 128;
/** Projection scale so default height ≈ previous 70px feel. */
const PROJ_SCALE = 70 / 69;
const ITEM_WORLD_HEIGHT = 4;
const TAN_HALF_FOV = Math.tan(FOV / 2);

/** Enemies keep full preview height; everything else is half size. */
const ENEMY_TYPES = new Set(['soldier', 'imp', 'pinky', 'caco', 'baron']);

// side 0 = north/south wall (orange), side 1 = east/west wall (brown)
const WALL_NS = 8;
const WALL_EW = 9;

/** Cache of images with pure black (#000) keyed to transparent. */
const transparentCache = new Map();

function transparentSprite(img) {
  if (!img?.complete || !img.naturalWidth) return null;
  let cached = transparentCache.get(img);
  if (cached) return cached;

  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i] === 0 && px[i + 1] === 0 && px[i + 2] === 0) px[i + 3] = 0;
  }
  ctx.putImageData(data, 0, 0);
  transparentCache.set(img, c);
  return c;
}
class PreviewView {
  /**
   * @param {HTMLCanvasElement} canvas Display canvas (scaled up from the render buffer).
   * @param {{
   *   getLevel: () => any,
   *   getCamera: () => {x:number,y:number,angle:number}|null,
   *   onRotate: (angle: number) => void,
   *   onMove: (x: number, y: number) => void,
   *   images: Record<string, HTMLImageElement>,
   *   getRaycasts?: () => number,
   *   getColumnHeight?: () => number,
   * }} opts
   */
  constructor(canvas, opts) {
    this.display = canvas;
    this.frame = canvas.parentElement;
    this.dctx = canvas.getContext('2d', { alpha: false });
    this.buffer = document.createElement('canvas');
    this.ctx = this.buffer.getContext('2d', { alpha: false });
    this.opts = opts;
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.buffer.width = DEFAULT_RAYS;
    this.buffer.height = DEFAULT_COL_H;
    this.ctx.imageSmoothingEnabled = false;
    disableSmoothing(this.dctx);

    canvas.addEventListener('pointerdown', (e) => this.#onPointer(e));
    canvas.addEventListener('pointermove', (e) => this.#onPointer(e));
    canvas.addEventListener('pointerup', (e) => this.#onPointer(e));
    canvas.addEventListener('lostpointercapture', (e) => this.#onPointer(e));

    this._ro = new ResizeObserver(() => this.draw());
    if (this.frame) this._ro.observe(this.frame);
  }

  #onPointer(e) {
    const cam = this.opts.getCamera();
    if (!cam) return;

    if (e.type === 'pointerdown') {
      this.dragging = true;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      try {
        e.currentTarget.setPointerCapture(e.pointerId);
      } catch (_) { /* ignore */ }
      return;
    }

    if (e.type === 'pointerup' || e.type === 'lostpointercapture') {
      this.dragging = false;
      return;
    }

    if (e.type === 'pointermove' && this.dragging) {
      const dx = e.clientX - this.lastX;
      const dy = e.clientY - this.lastY;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      const rect = this.display.getBoundingClientRect();
      const w = rect.width || DEFAULT_RAYS;
      const h = rect.height || DEFAULT_COL_H;

      if (dx) {
        const turnSens = Math.PI / w;
        this.opts.onRotate(cam.angle + dx * turnSens);
      }
      if (dy) {
        // Drag up = forward. Facing matches ray dir: (sin θ, −cos θ).
        const walkSens = (WORLD_PER_TILE * 2) / h;
        const forward = -dy * walkSens;
        const nx = cam.x + Math.sin(cam.angle) * forward;
        const ny = cam.y - Math.cos(cam.angle) * forward;
        this.opts.onMove(nx, ny);
      }
      this.draw();
    }
  }

  draw() {
    const ctx = this.ctx;
    const level = this.opts.getLevel();
    const cam = this.opts.getCamera();
    const view = viewParams(
      this.opts.getRaycasts?.() ?? DEFAULT_RAYS,
      this.opts.getColumnHeight?.() ?? DEFAULT_COL_H,
    );

    if (this.buffer.width !== view.w || this.buffer.height !== view.h) {
      this.buffer.width = view.w;
      this.buffer.height = view.h;
    }
    disableSmoothing(ctx);

    ctx.fillStyle = '#0a0a0c';
    ctx.fillRect(0, 0, view.w, view.h);

    if (cam) {
      const ox = cam.x + 0.5;
      const oy = cam.y + 0.5;
      const eyeZ = getCameraEyeHeight(level, cam.x, cam.y);
      // Camera-plane rays (perspective): equal screen-X spacing, not equal angle.
      // dir = facing, plane = right * tan(FOV/2) — avoids fish-eye floor curves.
      const dirX = Math.sin(cam.angle);
      const dirY = -Math.cos(cam.angle);
      const planeX = Math.cos(cam.angle) * TAN_HALF_FOV;
      const planeY = Math.sin(cam.angle) * TAN_HALF_FOV;

      for (let col = 0; col < view.w; col++) {
        const cameraX = (2 * col + 1) / view.w - 1;
        const rayDirX = dirX + planeX * cameraX;
        const rayDirY = dirY + planeY * cameraX;
        castColumn(ctx, level, ox, oy, eyeZ, rayDirX, rayDirY, col, view);
      }

      this.#drawItems(ctx, level, cam, ox, oy, eyeZ, view);
    }

    this.#present(view);
  }

  /** Nearest-neighbor blit buffer → display at frame size (no CSS stretch filtering). */
  #present(view) {
    const frame = this.frame || this.display;
    const rect = frame.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const outW = Math.max(1, Math.round(rect.width * dpr));
    const outH = Math.max(1, Math.round(rect.height * dpr));
    if (this.display.width !== outW || this.display.height !== outH) {
      this.display.width = outW;
      this.display.height = outH;
    }
    const dctx = this.dctx;
    disableSmoothing(dctx);
    dctx.fillStyle = '#0a0a0c';
    dctx.fillRect(0, 0, outW, outH);
    dctx.drawImage(this.buffer, 0, 0, view.w, view.h, 0, 0, outW, outH);
  }

  #drawItems(ctx, level, cam, ox, oy, eyeZ, view) {
    const sin = Math.sin(cam.angle);
    const cos = Math.cos(cam.angle);
    const sprites = [];

    for (const it of level.items) {
      if (isCamera(it)) continue;
      const ix = it.x + 0.5;
      const iy = it.y + 0.5;
      const dx = ix - ox;
      const dy = iy - oy;
      const depth = dx * sin - dy * cos;
      if (depth < 0.8) continue;
      const lateral = dx * cos + dy * sin;
      sprites.push({ it, depth, lateral });
    }

    sprites.sort((a, b) => b.depth - a.depth);

    for (const { it, depth, lateral } of sprites) {
      const sector = getSectorAtWorld(level, it.x, it.y);
      const floorZ = sector?.floorHeight ?? 0;
      const screenX = view.w / 2 + (lateral / depth) * (view.w / 2) / TAN_HALF_FOV;
      const screenFloorY = view.horizon + ((eyeZ - floorZ) * view.proj) / depth;
      const sizeScale = ENEMY_TYPES.has(it.type) ? 1 : 0.5;
      const spriteH = Math.max(1, (ITEM_WORLD_HEIGHT * view.proj * sizeScale) / depth);
      const img = this.opts.images[it.type];
      const sprite = transparentSprite(img);
      let spriteW = spriteH * 0.75;
      if (sprite) {
        spriteW = spriteH * (sprite.width / sprite.height);
      }
      const left = Math.round(screenX - spriteW / 2);
      const top = Math.round(screenFloorY - spriteH);
      const w = Math.max(1, Math.round(spriteW));
      const h = Math.max(1, Math.round(spriteH));

      if (left + w < 0 || left > view.w || top + h < 0 || top > view.h) continue;

      if (sprite) {
        disableSmoothing(ctx);
        ctx.drawImage(sprite, left, top, w, h);
      } else {
        ctx.fillStyle = '#c84';
        ctx.fillRect(left, top, w, h);
      }
    }
  }
}

function viewParams(raycasts, columnHeight) {
  const w = Math.max(8, Math.min(320, Math.round(Number(raycasts) || DEFAULT_RAYS)));
  const h = Math.max(8, Math.min(240, Math.round(Number(columnHeight) || DEFAULT_COL_H)));
  return {
    w,
    h,
    horizon: h / 2,
    proj: h * PROJ_SCALE,
  };
}

function disableSmoothing(ctx) {
  ctx.imageSmoothingEnabled = false;
  ctx.mozImageSmoothingEnabled = false;
  ctx.webkitImageSmoothingEnabled = false;
  ctx.msImageSmoothingEnabled = false;
}

function sectorAtTile(level, tx, ty) {
  const id = getCell(level, tx, ty);
  if (!id || !level.sectors.has(id)) return null;
  return { id, sector: level.sectors.get(id) };
}

/**
 * Multi-sector column cast: at each portal, paint near-sector floor/ceiling
 * into the open clip, draw upper/lower walls if heights change, then narrow
 * the clip. Farther sectors only paint into what's still open.
 */
function castColumn(ctx, level, ox, oy, eyeZ, rayDirX, rayDirY, col, view) {
  const posX = ox / WORLD_PER_TILE;
  const posY = oy / WORLD_PER_TILE;

  let mapX = Math.floor(posX);
  let mapY = Math.floor(posY);

  const deltaDistX = Math.abs(rayDirX) < 1e-8 ? 1e30 : Math.abs(1 / rayDirX);
  const deltaDistY = Math.abs(rayDirY) < 1e-8 ? 1e30 : Math.abs(1 / rayDirY);

  let stepX;
  let stepY;
  let sideDistX;
  let sideDistY;

  if (rayDirX < 0) {
    stepX = -1;
    sideDistX = (posX - mapX) * deltaDistX;
  } else {
    stepX = 1;
    sideDistX = (mapX + 1 - posX) * deltaDistX;
  }
  if (rayDirY < 0) {
    stepY = -1;
    sideDistY = (posY - mapY) * deltaDistY;
  } else {
    stepY = 1;
    sideDistY = (mapY + 1 - posY) * deltaDistY;
  }

  let yTop = 0;
  let yBot = view.h;
  let cur = sectorAtTile(level, mapX, mapY);
  let side = 0;

  for (let step = 0; step < MAX_DEPTH && yTop < yBot; step++) {
    if (sideDistX < sideDistY) {
      sideDistX += deltaDistX;
      mapX += stepX;
      side = 0;
    } else {
      sideDistY += deltaDistY;
      mapY += stepY;
      side = 1;
    }

    // Perpendicular distance in tiles (Lodev) — already fish-eye free
    let perpTiles;
    if (side === 0) {
      perpTiles = (mapX - posX + (1 - stepX) / 2) / rayDirX;
    } else {
      perpTiles = (mapY - posY + (1 - stepY) / 2) / rayDirY;
    }
    const perpDist = Math.max(0.05, Math.abs(perpTiles)) * WORLD_PER_TILE;
    const outOfBounds = mapX < 0 || mapY < 0 || mapX >= MAP_SIZE || mapY >= MAP_SIZE;
    const next = outOfBounds ? null : sectorAtTile(level, mapX, mapY);

    // Same sector — keep walking
    if (cur && next && cur.id === next.id) continue;

    // Entering geometry from void
    if (!cur && next) {
      cur = next;
      continue;
    }

    const nearFloor = cur?.sector.floorHeight ?? 0;
    const nearCeil = cur?.sector.ceilingHeight ?? 31;
    const nearCeilY = projectY(nearCeil, eyeZ, perpDist, view);
    const nearFloorY = projectY(nearFloor, eyeZ, perpDist, view);

    // Near-sector ceiling strip above the portal (front-to-back; only open clip).
    // When nearCeilY clamps to yBot, still fill and close — leaves no false
    // opening for a solid wall (C64 paint_near must match).
    if (cur) {
      const ceilEnd = clampSpan(yTop, yBot, nearCeilY);
      if (ceilEnd > yTop) {
        ctx.fillStyle = colorHex(cur.sector.ceilingColor);
        ctx.fillRect(col, yTop, 1, ceilEnd - yTop);
        yTop = ceilEnd;
      }
    }

    // Near-sector floor strip below the portal (only when floor is at/below
    // the horizon — floors above the eye must not yank yBot into the sky).
    if (cur && nearFloorY >= view.horizon) {
      const floorStart = clampSpan(yTop, yBot, nearFloorY);
      if (floorStart < yBot) {
        ctx.fillStyle = colorHex(cur.sector.floorColor);
        ctx.fillRect(col, floorStart, 1, yBot - floorStart);
        yBot = floorStart;
      }
    }

    if (yTop >= yBot) break;

    // Solid wall — fill remaining portal and stop (nothing farther may draw)
    if (!next) {
      if (yBot > yTop) {
        ctx.fillStyle = wallColor(side);
        ctx.fillRect(col, yTop, 1, yBot - yTop);
      }
      break;
    }

    // Into a door: door ceiling colour. Out of a door / normal: N/S–E/W walls.
    const portalFill = isDoorSector(next.sector)
      ? colorHex(next.sector.ceilingColor)
      : wallColor(side);
    const farFloor = next.sector.floorHeight;
    const farCeil = next.sector.ceilingHeight;
    const farCeilY = projectY(farCeil, eyeZ, perpDist, view);
    const farFloorY = projectY(farFloor, eyeZ, perpDist, view);

    // Upper wall
    if (farCeil < nearCeil) {
      const wallTop = clampSpan(yTop, yBot, nearCeilY);
      const wallBot = clampSpan(yTop, yBot, farCeilY);
      if (wallBot > wallTop) {
        ctx.fillStyle = portalFill;
        ctx.fillRect(col, wallTop, 1, wallBot - wallTop);
      }
      yTop = Math.max(yTop, wallBot);
    }

    if (yTop >= yBot) break;

    // Lower wall
    if (farFloor > nearFloor) {
      const wallTop = clampSpan(yTop, yBot, farFloorY);
      const wallBot = clampSpan(yTop, yBot, nearFloorY);
      if (wallBot > wallTop) {
        ctx.fillStyle = portalFill;
        ctx.fillRect(col, wallTop, 1, wallBot - wallTop);
      }
      // Portal opening is [yTop, farFloorY) even when the raised floor
      // projects above the horizon (looking up stairs).
      yBot = Math.min(yBot, wallTop);
    }

    if (yTop >= yBot) break;

    cur = next;
  }
}

function clampSpan(yTop, yBot, y) {
  return Math.max(yTop, Math.min(yBot, Math.round(y)));
}

function projectY(height, eyeZ, perpDist, view) {
  return Math.round(view.horizon - ((height - eyeZ) * view.proj) / Math.max(0.5, perpDist));
}

function wallColor(side) {
  return C64_HEX[side === 0 ? WALL_NS : WALL_EW];
}

// ---- js/tileEditor.js ----
function numInput(id, label, min, max, value, mixed) {
  const wrap = document.createElement('label');
  wrap.className = 'field';
  wrap.htmlFor = id;
  const span = document.createElement('span');
  span.textContent = label;
  const input = document.createElement('input');
  input.type = 'number';
  input.id = id;
  input.min = String(min);
  input.max = String(max);
  if (mixed) {
    input.placeholder = 'mixed';
    input.value = '';
  } else {
    input.value = String(value);
  }
  wrap.append(span, input);
  return { wrap, input };
}

function textInput(id, label, value, mixed) {
  const wrap = document.createElement('label');
  wrap.className = 'field';
  wrap.htmlFor = id;
  const span = document.createElement('span');
  span.textContent = label;
  const input = document.createElement('input');
  input.type = 'text';
  input.id = id;
  input.autocomplete = 'off';
  input.spellcheck = false;
  if (mixed) {
    input.placeholder = 'mixed';
    input.value = '';
  } else {
    input.value = value ?? '';
  }
  wrap.append(span, input);
  return { wrap, input };
}

function colorPicker(id, label, value, mixed) {
  const wrap = document.createElement('div');
  wrap.className = 'field color-field';
  const span = document.createElement('span');
  span.textContent = label + (mixed ? ' (mixed)' : '');
  const row = document.createElement('div');
  row.className = 'color-swatches';
  /** @type {HTMLButtonElement[]} */
  const buttons = [];
  for (let i = 0; i < 16; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch' + (!mixed && i === value ? ' selected' : '');
    btn.title = `${i}: ${C64_NAMES[i]}`;
    btn.dataset.color = String(i);
    btn.style.background = C64_HEX[i];
    buttons.push(btn);
    row.appendChild(btn);
  }
  wrap.append(span, row);
  return { wrap, buttons };
}
