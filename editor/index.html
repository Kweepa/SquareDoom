    singleShot: false,
    action: 'none',
    /** Editor-only name; baked away — used to resolve targetTag → sector id. */
    tag: '',
    /** Editor-only; names the target sector's tag (→ SEC_TARGET). */
    targetTag: '',
    floorColor: 11,
    ceilingColor: 11,
    brightness: 15,
  };
}

function cloneSector(s) {
  return { ...s };
}

function sectorsEqual(a, b) {
  return (
    a.floorHeight === b.floorHeight &&
    a.ceilingHeight === b.ceilingHeight &&
    normalizeTrigger(a.trigger) === normalizeTrigger(b.trigger) &&
    !!a.singleShot === !!b.singleShot &&
    normalizeAction(a.action) === normalizeAction(b.action) &&
    (a.tag || '') === (b.tag || '') &&
    (a.targetTag || '') === (b.targetTag || '') &&
    a.floorColor === b.floorColor &&
    a.ceilingColor === b.ceilingColor &&
    a.brightness === b.brightness
  );
}

/** Find sector id whose tag matches (first / lowest id). 0 if none. */
function findSectorIdByTag(level, tag) {
  const ids = findAllSectorIdsByTag(level, tag);
  return ids.length ? ids[0] : 0;
}

/** All sector ids whose tag matches, ascending. Empty if none / blank tag. */
function findAllSectorIdsByTag(level, tag) {
  const t = String(tag || '').trim();
  if (!t) return [];
  const ids = [...level.sectors.keys()].sort((a, b) => a - b);
  const out = [];
  for (const id of ids) {
    if ((level.sectors.get(id).tag || '').trim() === t) out.push(id);
  }
  return out;
}

function defaultSkills() {
  return { easy: true, normal: true, hard: true };
}

function clampLevelName(name) {
  return String(name ?? '').trim().slice(0, LEVEL_NAME_LEN);
}

/** Par time in seconds (cooked as one byte). */
const DEFAULT_PAR_TIME = 30;
const DEFAULT_PAR_BY_LEVEL = {
  E1M1: 30,
  E1M2: 45,
  E1M3: 60,
  E1M4: 105,
  E1M5: 165,
  E1M6: 180,
  E1M7: 150,
  E1M8: 90,
  E1M9: 30,
};

function clampParTime(v) {
  const n = Number(v);
  if (!Number.isFinite(n)) return DEFAULT_PAR_TIME;
  return Math.max(0, Math.min(255, n | 0));
}

function createEmptyLevel() {
  return {
    /** Display name (max LEVEL_NAME_LEN); editor JSON only (not in cooked binary). */
    name: '',
    /** Intermission par time in seconds (0..255); cooked into level binary. */
    parTime: DEFAULT_PAR_TIME,
    /** @type {Map<number, ReturnType<typeof defaultSector>>} sectorId -> data (1..199) */
    sectors: new Map(),
    /** @type {Uint8Array} */
    map: new Uint8Array(MAP_CELLS),
    /** Player start — always present; cooked separately from items. */
    spawn: defaultSpawn(),
    /** @type {Array<{type:string,x:number,y:number,skills?:object,angle?:number}>} */
    items: [],
  };
}

function createEpisode() {
  /** @type {Record<string, ReturnType<typeof createEmptyLevel>>} */
  const levels = {};
  for (const name of LEVEL_NAMES) {
    levels[name] = createEmptyLevel();
  }
  return {
    levels,
    activeLevel: 'E1M1',
  };
}

function cellIndex(tx, ty) {
  return ty * MAP_SIZE + tx;
}

function getCell(level, tx, ty) {
  if (tx < 0 || ty < 0 || tx >= MAP_SIZE || ty >= MAP_SIZE) return 0;
  return level.map[cellIndex(tx, ty)];
}

/**
 * Cooked switch bindings: one { sec, dir } per trigger=switch sector.
 * sec = switch sector id; dir = NESW face of the adjacent solid (0=N..3=W).
 * Uses the first map cell of that sector with a solid neighbour:
 *   1 solid → that wall; 3 → opposite the gap; 2/4 → first NESW.
 */
function buildSwitchFaceBindings(level) {
  const faces = [];
  const done = new Set();
  const dirs = [
    { dx: 0, dy: -1 },
    { dx: 1, dy: 0 },
    { dx: 0, dy: 1 },
    { dx: -1, dy: 0 },
  ];
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      const sec = getCell(level, tx, ty);
      if (!sec || done.has(sec)) continue;
      const s = level.sectors.get(sec);
      if (!s || normalizeTrigger(s.trigger) !== 'switch') continue;
      const solid = [];
      for (let d = 0; d < 4; d++) {
        const mx = tx + dirs[d].dx;
        const my = ty + dirs[d].dy;
        if (mx < 0 || my < 0 || mx >= MAP_SIZE || my >= MAP_SIZE) continue;
        if (getCell(level, mx, my) === 0) solid.push(d);
      }
      if (solid.length === 0) continue;
      done.add(sec);
      let toward;
      if (solid.length === 3) {
        const open = [0, 1, 2, 3].find((d) => !solid.includes(d));
        toward = (open + 2) & 3;
      } else {
        toward = solid[0];
      }
      faces.push({ sec, dir: (toward + 2) & 3 });
    }
  }
  return faces;
}

function setCell(level, tx, ty, sectorId) {
  level.map[cellIndex(tx, ty)] = sectorId;
}

function worldToTile(wx, wy) {
  return {
    tx: Math.max(0, Math.min(MAP_SIZE - 1, wx >> 3)),
    ty: Math.max(0, Math.min(MAP_SIZE - 1, wy >> 3)),
  };
}

function clampWorld(v) {
  return Math.max(0, Math.min(WORLD_MAX, v | 0));
}

/** Allocate next free sector id 1..MAX_SECTORS, or 0 if full. */
function allocSectorId(level) {
  for (let id = 1; id <= MAX_SECTORS; id++) {
    if (!level.sectors.has(id)) return id;
  }
  return 0;
}

/**
 * Remap sector ids densely to 1..n (ascending old-id order). Rewrites map cells.
 * Tags stay string-based (resolved at cook). Returns sector count after compact.
 */
function compactSectorIds(level) {
  const oldIds = [...level.sectors.keys()]
    .filter((id) => id > 0)
    .sort((a, b) => a - b);
  if (!oldIds.length) {
    level.sectors.clear();
    return 0;
  }
  let alreadyDense = oldIds.length <= MAX_SECTORS;
  for (let i = 0; alreadyDense && i < oldIds.length; i++) {
    if (oldIds[i] !== i + 1) alreadyDense = false;
  }
  if (alreadyDense) return oldIds.length;

  /** @type {Map<number, number>} */
  const remap = new Map();
  /** @type {Map<number, ReturnType<typeof defaultSector>>} */
  const next = new Map();
  for (let i = 0; i < oldIds.length; i++) {
    const oldId = oldIds[i];
    const newId = i + 1;
    remap.set(oldId, newId);
    next.set(newId, level.sectors.get(oldId));
  }
  for (let i = 0; i < level.map.length; i++) {
    const sid = level.map[i];
    if (!sid) continue;
    level.map[i] = remap.get(sid) ?? 0;
  }
  level.sectors = next;
  return oldIds.length;
}

function sectorCellCount(level, sectorId) {
  let n = 0;
  for (let i = 0; i < MAP_CELLS; i++) {
    if (level.map[i] === sectorId) n++;
  }
  return n;
}

function dropSectorIfEmpty(level, sectorId) {
  if (sectorId === 0) return;
  if (sectorCellCount(level, sectorId) === 0) {
    level.sectors.delete(sectorId);
  }
}

/** Create default sector on empty cell; returns new id or 0. */
function paintDefaultSector(level, tx, ty) {
  const id = allocSectorId(level);
  if (!id) return 0;
  level.sectors.set(id, defaultSector());
  setCell(level, tx, ty, id);
  return id;
}

/**
 * Paint existing sector onto a cell if result stays a filled ≤15×15 rectangle.
 * Returns true on success.
 */
function paintSector(level, tx, ty, sectorId) {
  if (!level.sectors.has(sectorId)) return false;
  if (!canAddTileToSector(level, sectorId, tx, ty)) return false;
  const old = getCell(level, tx, ty);
  setCell(level, tx, ty, sectorId);
  dropSectorIfEmpty(level, old);
  return true;
}

/**
 * Split: copy sector data into a new id for this cell only.
 * Returns new id or 0.
 */
function splitSectorAt(level, tx, ty) {
  const old = getCell(level, tx, ty);
  if (old === 0 || !level.sectors.has(old)) return 0;
  const id = allocSectorId(level);
  if (!id) return 0;
  level.sectors.set(id, cloneSector(level.sectors.get(old)));
  setCell(level, tx, ty, id);
  dropSectorIfEmpty(level, old);
  return id;
}

/** Clear a single tile. */
function clearTile(level, tx, ty) {
  const old = getCell(level, tx, ty);
  setCell(level, tx, ty, 0);
  dropSectorIfEmpty(level, old);
  return old;
}

/** Delete all tiles of a sector. */
function deleteSector(level, sectorId) {
  if (sectorId === 0) return;
  for (let i = 0; i < MAP_CELLS; i++) {
    if (level.map[i] === sectorId) level.map[i] = 0;
  }
  level.sectors.delete(sectorId);
}

/**
 * Shift all map tiles and items by dx/dy tile steps.
 * Content that moves off the map is discarded.
 */
function shiftLevel(level, dx, dy) {
  const old = level.map;
  const next = new Uint8Array(MAP_CELLS);
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      const id = old[cellIndex(tx, ty)];
      if (!id) continue;
      const ntx = tx + dx;
      const nty = ty + dy;
      if (ntx >= 0 && ntx < MAP_SIZE && nty >= 0 && nty < MAP_SIZE) {
        next[cellIndex(ntx, nty)] = id;
      }
    }
  }
  level.map = next;

  for (const id of [...level.sectors.keys()]) {
    if (sectorCellCount(level, id) === 0) level.sectors.delete(id);
  }

  const kept = [];
  for (const it of level.items) {
    const nx = it.x + dx * WORLD_PER_TILE;
    const ny = it.y + dy * WORLD_PER_TILE;
    if (nx >= 0 && nx <= WORLD_MAX && ny >= 0 && ny <= WORLD_MAX) {
      it.x = nx;
      it.y = ny;
      kept.push(it);
    }
  }
  level.items.length = 0;
  level.items.push(...kept);

  if (level.spawn) {
    const sx = level.spawn.x + dx * WORLD_PER_TILE;
    const sy = level.spawn.y + dy * WORLD_PER_TILE;
    if (sx >= 0 && sx <= WORLD_MAX && sy >= 0 && sy <= WORLD_MAX) {
      level.spawn.x = sx;
      level.spawn.y = sy;
    }
  }
}

/** All occupied map cells. */
function occupiedTiles(level) {
  const out = [];
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      if (getCell(level, tx, ty)) out.push({ tx, ty });
    }
  }
  return out;
}

/** Items whose containing tile is in the given tile list. */
function itemsInTiles(level, tiles) {
  const keys = new Set(tiles.map(({ tx, ty }) => tileKey(tx, ty)));
  return level.items.filter((it) => {
    const tx = Math.floor(it.x / WORLD_PER_TILE);
    const ty = Math.floor(it.y / WORLD_PER_TILE);
    return keys.has(tileKey(tx, ty));
  });
}

/**
 * Group occupied selected tiles by their current sector id.
 * @param {{tx:number,ty:number}[]} tiles
 * @returns {Map<number, {tx:number,ty:number}[]>}
 */
function groupTilesBySector(level, tiles) {
  /** @type {Map<number, {tx:number,ty:number}[]>} */
  const bySector = new Map();
  for (const { tx, ty } of tiles) {
    const id = getCell(level, tx, ty);
    if (!id || !level.sectors.has(id)) continue;
    let list = bySector.get(id);
    if (!list) {
      list = [];
      bySector.set(id, list);
    }
    list.push({ tx, ty });
  }
  return bySector;
}

/**
 * Apply new props per selected sector: mutate in place when the whole sector is
 * selected, otherwise one fresh id for the selection (avoids per-tile alloc).
 * @param {Map<number, {tx:number,ty:number}[]>} bySector
 * @param {(cur: ReturnType<typeof defaultSector>) => ReturnType<typeof defaultSector>} nextProps
 */
function applyPropsBySector(level, bySector, nextProps) {
  for (const [sectorId, selected] of bySector) {
    const cur = level.sectors.get(sectorId);
    if (!cur) continue;
    const next = nextProps(cur);
    const total = sectorCellCount(level, sectorId);
    if (selected.length >= total) {
      level.sectors.set(sectorId, next);
      continue;
    }
    const nid = allocSectorId(level);
    if (!nid) continue;
    level.sectors.set(nid, next);
    for (const { tx, ty } of selected) setCell(level, tx, ty, nid);
    dropSectorIfEmpty(level, sectorId);
  }
}

/**
 * Raise/lower floor and ceiling together by delta on listed tiles.
 * Each height is clamped independently to 0–31.
 */
function nudgeTileHeights(level, tiles, delta) {
  if (!delta) return;
  applyPropsBySector(level, groupTilesBySector(level, tiles), (cur) => {
    const next = cloneSector(cur);
    next.floorHeight = clampNum(cur.floorHeight + delta, 0, 31);
    next.ceilingHeight = clampNum(cur.ceilingHeight + delta, 0, 31);
    return next;
  });
  rebuildSectors(level);
}

const NEIGHBOR_4 = [
  [1, 0],
  [-1, 0],
  [0, 1],
  [0, -1],
];

/**
 * Most common floor height among NESW neighbours outside the selection.
 * @param {ReturnType<typeof createLevel>} level
 * @param {Array<{tx:number,ty:number}>} tiles
 * @returns {number|null}
 */
function closetNeighbourFloor(level, tiles) {
  if (!tiles?.length) return null;
  const selected = new Set(tiles.map(({ tx, ty }) => tileKey(tx, ty)));
  /** @type {Map<number, number>} */
  const counts = new Map();
  let firstOrder = [];
  for (const { tx, ty } of tiles) {
    for (const [dx, dy] of NEIGHBOR_4) {
      const nx = tx + dx;
      const ny = ty + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_SIZE || ny >= MAP_SIZE) continue;
      if (selected.has(tileKey(nx, ny))) continue;
      const id = getCell(level, nx, ny);
      if (!id) continue;
      const s = level.sectors.get(id);
      if (!s) continue;
      const h = s.floorHeight;
      if (!counts.has(h)) firstOrder.push(h);
      counts.set(h, (counts.get(h) || 0) + 1);
    }
  }
  if (!firstOrder.length) return null;
  let best = firstOrder[0];
  let bestN = counts.get(best);
  for (const h of firstOrder) {
    const n = counts.get(h);
    if (n > bestN) {
      best = h;
      bestN = n;
    }
  }
  return best;
}

/**
 * Floor/ceil for a monster closet relative to neighbour floor N.
 * @returns {{ floorHeight: number, ceilingHeight: number }}
 */
function monsterClosetHeights(neighbourFloor) {
  const floorHeight = clampNum(neighbourFloor - 6, 0, 31);
  const ceilingHeight = clampNum(floorHeight + 5, 0, 31);
  return { floorHeight, ceilingHeight };
}

/**
 * 4-connected groups of tiles whose sector props match via sectorsEqual.
 * @returns {{ props: ReturnType<typeof defaultSector>, tiles: {tx:number,ty:number}[], oldIds: number[] }[]}
 */
function equalPropConnectedComponents(level) {
  const visited = new Uint8Array(MAP_CELLS);
  /** @type {{ props: ReturnType<typeof defaultSector>, tiles: {tx:number,ty:number}[], oldIds: number[] }[]} */
  const components = [];

  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      const start = cellIndex(tx, ty);
      const startId = level.map[start];
      if (!startId || visited[start]) continue;
      const props = level.sectors.get(startId);
      if (!props) {
        level.map[start] = 0;
        continue;
      }

      /** @type {{tx:number,ty:number}[]} */
      const tiles = [];
      const oldIdSet = new Set();
      /** @type {{tx:number,ty:number}[]} */
      const stack = [{ tx, ty }];
      visited[start] = 1;

      while (stack.length) {
        const cur = stack.pop();
        const cid = getCell(level, cur.tx, cur.ty);
        tiles.push(cur);
        oldIdSet.add(cid);
        for (const [dx, dy] of NEIGHBOR_4) {
          const nx = cur.tx + dx;
          const ny = cur.ty + dy;
          if (nx < 0 || ny < 0 || nx >= MAP_SIZE || ny >= MAP_SIZE) continue;
          const nidx = cellIndex(nx, ny);
          if (visited[nidx]) continue;
          const nid = level.map[nidx];
          if (!nid) continue;
          const np = level.sectors.get(nid);
          if (!np || !sectorsEqual(props, np)) continue;
          visited[nidx] = 1;
          stack.push({ tx: nx, ty: ny });
        }
      }

      components.push({
        props: cloneSector(props),
        tiles,
        oldIds: [...oldIdSet].sort((a, b) => a - b),
      });
    }
  }
  return components;
}

/**
 * Repack identical-property connected tiles into filled ≤15×15 rectangles.
 * @param {{ optimal?: boolean }} [opts] optimal (default false) runs slow min-cover;
 *   interactive edits use strip packing only.
 */
function mergeIdenticalSectors(level, opts = {}) {
  const optimal = !!opts.optimal;
  const components = equalPropConnectedComponents(level);
  /** @type {{ id: number, props: ReturnType<typeof defaultSector>, tiles: {tx:number,ty:number}[] }[]} */
  const assignments = [];
  /** @type {{ props: ReturnType<typeof defaultSector>, tiles: {tx:number,ty:number}[] }[]} */
  const pending = [];
  const claimed = new Set();

  for (const comp of components) {
    /** @type {{tx:number,ty:number}[][] | null} */
    let seed = null;
    let seedOk = true;
    /** @type {Map<number, {tx:number,ty:number}[]>} */
    const byId = new Map();
    for (const t of comp.tiles) {
      const id = getCell(level, t.tx, t.ty);
      let list = byId.get(id);
      if (!list) {
        list = [];
        byId.set(id, list);
      }
      list.push(t);
    }
    for (const id of comp.oldIds) {
      const tiles = byId.get(id);
      if (!tiles || !tilesAreValidSectorShape(tiles)) {
        seedOk = false;
        break;
      }
    }
    if (seedOk) {
      seed = comp.oldIds.map((id) => byId.get(id)).filter(Boolean);
    }

    const parts = partitionTilesIntoMinRectangles(comp.tiles, seed, { optimal });
    let oi = 0;
    for (const chunk of parts) {
      let id = 0;
      while (oi < comp.oldIds.length) {
        const cand = comp.oldIds[oi++];
        if (!claimed.has(cand)) {
          id = cand;
          break;
        }
      }
      if (id) {
        claimed.add(id);
        assignments.push({ id, props: cloneSector(comp.props), tiles: chunk });
      } else {
        pending.push({ props: cloneSector(comp.props), tiles: chunk });
      }
    }
  }

  for (const p of pending) {
    let id = 0;
    for (let n = 1; n <= MAX_SECTORS; n++) {
      if (!claimed.has(n)) {
        id = n;
        break;
      }
    }
    if (!id) break;
    claimed.add(id);
    assignments.push({ id, props: p.props, tiles: p.tiles });
  }

  level.map.fill(0);
  level.sectors.clear();
  for (const a of assignments) {
    level.sectors.set(a.id, a.props);
    for (const { tx, ty } of a.tiles) {
      setCell(level, tx, ty, a.id);
    }
  }
}

/**
 * Repack sectors into valid rectangles and drop unused records.
 * Call after any tile property edit (strip-fast). Pass { optimal: true } before save.
 * @param {{ optimal?: boolean }} [opts]
 */
function rebuildSectors(level, opts = {}) {
  mergeIdenticalSectors(level, opts);
}

function sectorCount(level) {
  return level.sectors.size;
}

/** All map cells that use the given sector id. */
function tilesInSector(level, sectorId) {
  const out = [];
  if (!sectorId) return out;
  for (let ty = 0; ty < MAP_SIZE; ty++) {
    for (let tx = 0; tx < MAP_SIZE; tx++) {
      if (getCell(level, tx, ty) === sectorId) out.push({ tx, ty });
    }
  }
  return out;
}

/** @param {{tx:number,ty:number}[]} tiles */
function sectorBounds(tiles) {
  if (!tiles.length) return null;
  let minX = tiles[0].tx;
  let maxX = tiles[0].tx;
  let minY = tiles[0].ty;
  let maxY = tiles[0].ty;
  for (let i = 1; i < tiles.length; i++) {
    const t = tiles[i];
    if (t.tx < minX) minX = t.tx;
    if (t.tx > maxX) maxX = t.tx;
    if (t.ty < minY) minY = t.ty;
    if (t.ty > maxY) maxY = t.ty;
  }
  return { minX, maxX, minY, maxY, w: maxX - minX + 1, h: maxY - minY + 1 };
}

/** @param {{tx:number,ty:number}[]} tiles */
function tilesFitSpan(tiles) {
  const b = sectorBounds(tiles);
  if (!b) return true;
  return b.w <= MAX_SECTOR_SPAN && b.h <= MAX_SECTOR_SPAN;
}

/**
 * Grid-convex: filled axis-aligned rectangle (no dents/L/C shapes).
 * Needed so SEC_SEEN cannot reveal items around a corner within one id.
 */
function tilesAreConvex(tiles) {
  if (tiles.length <= 1) return true;
  const b = sectorBounds(tiles);
  if (!b || tiles.length !== b.w * b.h) return false;
  const keys = new Set(tiles.map((t) => tileKey(t.tx, t.ty)));
  for (let ty = b.minY; ty <= b.maxY; ty++) {
    for (let tx = b.minX; tx <= b.maxX; tx++) {
      if (!keys.has(tileKey(tx, ty))) return false;
    }
  }
  return true;
}

/** Contiguous filled rectangle within MAX_SECTOR_SPAN. */
function tilesAreValidSectorShape(tiles) {
  return tilesAreConvex(tiles) && tilesFitSpan(tiles);
}

/** 4-connected contiguity. Empty set is contiguous. */
function tilesAreContiguous(tiles) {
  if (tiles.length <= 1) return true;
  const keys = new Set(tiles.map((t) => tileKey(t.tx, t.ty)));
  const start = tileKey(tiles[0].tx, tiles[0].ty);
  const seen = new Set([start]);
  const q = [start];
  const dirs = [
    [1, 0],
    [-1, 0],
    [0, 1],
    [0, -1],
  ];
  while (q.length) {
    const { tx, ty } = parseTileKey(q.shift());
    for (const [dx, dy] of dirs) {
      const nk = tileKey(tx + dx, ty + dy);
      if (!keys.has(nk) || seen.has(nk)) continue;
      seen.add(nk);
      q.push(nk);
    }
  }
  return seen.size === keys.size;
}

function sectorIsContiguous(level, sectorId) {
  return tilesAreContiguous(tilesInSector(level, sectorId));
}

function sectorIsConvex(level, sectorId) {
  return tilesAreConvex(tilesInSector(level, sectorId));
}

/**
 * True if painting sectorId onto (tx,ty) keeps a filled ≤15×15 rectangle.
 * Already owning the cell is always ok.
 */
function canAddTileToSector(level, sectorId, tx, ty) {
  if (!sectorId || !level.sectors.has(sectorId)) return false;
  if (getCell(level, tx, ty) === sectorId) return true;
  const tiles = tilesInSector(level, sectorId);
  if (!tiles.length) return true;
  return tilesAreValidSectorShape(tiles.concat([{ tx, ty }]));
}

/**
 * Partition via row-runs merged vertically when x-range matches (or transposed).
 * Respects MAX_SECTOR_SPAN. Fast upper bound, not always minimal with holes.
 * @param {{tx:number,ty:number}[]} tiles
 * @param {boolean} transpose
 * @returns {{tx:number,ty:number}[][]}
 */
function stripPartitionTiles(tiles, transpose = false) {
  if (!tiles.length) return [];
  const pts = transpose
    ? tiles.map((t) => ({ tx: t.ty, ty: t.tx }))
    : tiles.map((t) => ({ tx: t.tx, ty: t.ty }));
  const keys = new Set(pts.map((t) => tileKey(t.tx, t.ty)));
  const b = sectorBounds(pts);
  if (!b) return [];

  /** @type {{ y: number, x0: number, x1: number }[]} */
  const runs = [];
  for (let y = b.minY; y <= b.maxY; y++) {
    let x = b.minX;
    while (x <= b.maxX) {
      while (x <= b.maxX && !keys.has(tileKey(x, y))) x++;
      if (x > b.maxX) break;
      const x0 = x;
      while (x <= b.maxX && keys.has(tileKey(x, y))) x++;
      runs.push({ y, x0, x1: x - 1 });
    }
  }

  const used = new Array(runs.length).fill(false);
  /** @type {{ x0: number, x1: number, y0: number, y1: number }[]} */
  const rects = [];
  for (let i = 0; i < runs.length; i++) {
    if (used[i]) continue;
    const { y, x0, x1 } = runs[i];
    let y1 = y;
    used[i] = true;
    let growing = true;
    while (growing) {
      growing = false;
      if (y1 - y + 1 >= MAX_SECTOR_SPAN) break;
      for (let j = i + 1; j < runs.length; j++) {
        if (used[j]) continue;
        const r = runs[j];
        if (r.y === y1 + 1 && r.x0 === x0 && r.x1 === x1) {
          used[j] = true;
          y1 = r.y;
          growing = true;
          break;
        }
      }
    }
    for (let xa = x0; xa <= x1; xa += MAX_SECTOR_SPAN) {
      const xb = Math.min(x1, xa + MAX_SECTOR_SPAN - 1);
      for (let ya = y; ya <= y1; ya += MAX_SECTOR_SPAN) {
        const yb = Math.min(y1, ya + MAX_SECTOR_SPAN - 1);
        rects.push({ x0: xa, x1: xb, y0: ya, y1: yb });
      }
    }
  }

  return rects.map(({ x0, x1, y0, y1 }) => {
    /** @type {{tx:number,ty:number}[]} */
    const part = [];
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        part.push(transpose ? { tx: ty, ty: tx } : { tx, ty });
      }
    }
    return part;
  });
}

function popcountBigInt(x) {
  let n = 0;
  let v = x;
  while (v) {
    v &= v - 1n;
    n++;
  }
  return n;
}

/**
 * Minimum partition into filled ≤MAX_SECTOR_SPAN rectangles.
 * Fast path (optimal: false): strip H/V + keep seed if tighter.
 * Optimal path: bounded exact-cover DFS + randomized restarts.
 * @param {{tx:number,ty:number}[]} tiles
 * @param {{tx:number,ty:number}[][]} [seedParts] optional known valid partition
 * @param {{ optimal?: boolean }} [opts]
 * @returns {{tx:number,ty:number}[][]}
 */
function partitionTilesIntoMinRectangles(tiles, seedParts = null, opts = {}) {
  const optimal = opts.optimal === true;
  if (!tiles.length) return [];
  if (tiles.length === 1) return [[{ tx: tiles[0].tx, ty: tiles[0].ty }]];

  const ordered = tiles.slice().sort((a, b) => a.ty - b.ty || a.tx - b.tx);
  if (tilesAreValidSectorShape(ordered)) return [ordered.map((t) => ({ ...t }))];

  const n = ordered.length;
  /** @type {Map<string, number>} */
  const indexOf = new Map();
  for (let i = 0; i < n; i++) {
    indexOf.set(tileKey(ordered[i].tx, ordered[i].ty), i);
  }
  const has = (tx, ty) => indexOf.has(tileKey(tx, ty));

  const stripH = stripPartitionTiles(ordered, false);
  const stripV = stripPartitionTiles(ordered, true);
  /** @type {{tx:number,ty:number}[][]} */
  let bestParts = stripH.length <= stripV.length ? stripH : stripV;
  let best = bestParts.length;

  if (
    Array.isArray(seedParts) &&
    seedParts.length > 0 &&
    seedParts.length < best &&
    seedParts.every((p) => tilesAreValidSectorShape(p))
  ) {
    best = seedParts.length;
    bestParts = seedParts.map((p) => p.map((t) => ({ ...t })));
  }

  if (!optimal) return bestParts;

  const areaCap = MAX_SECTOR_SPAN * MAX_SECTOR_SPAN;
  const minPossible = Math.ceil(n / areaCap);
  if (best <= minPossible) return bestParts;

  /** @type {{ mask: bigint, area: number }[]} */
  const cands = [];
  for (let i = 0; i < n; i++) {
    const { tx: x0, ty: y0 } = ordered[i];
    for (let h = 1; h <= MAX_SECTOR_SPAN; h++) {
      if (!has(x0, y0 + h - 1)) break;
      let maxW = MAX_SECTOR_SPAN;
      for (let dy = 0; dy < h; dy++) {
        let rowW = 0;
        while (rowW < maxW && has(x0 + rowW, y0 + dy)) rowW++;
        if (rowW < maxW) maxW = rowW;
        if (!maxW) break;
      }
      for (let w = 1; w <= maxW; w++) {
        let mask = 0n;
        for (let dy = 0; dy < h; dy++) {
          for (let dx = 0; dx < w; dx++) {
            mask |= 1n << BigInt(indexOf.get(tileKey(x0 + dx, y0 + dy)));
          }
        }
        cands.push({ mask, area: w * h });
      }
    }
  }
  cands.sort((a, b) => b.area - a.area);

  /** @type {number[][]} */
  const coverOf = Array.from({ length: n }, () => []);
  for (let ci = 0; ci < cands.length; ci++) {
    let m = cands[ci].mask;
    let bit = 0;
    while (m) {
      if (m & 1n) coverOf[bit].push(ci);
      m >>= 1n;
      bit++;
    }
  }

  function partsFromMasks(masks) {
    return masks.map((mask) => {
      /** @type {{tx:number,ty:number}[]} */
      const part = [];
      for (let i = 0; i < n; i++) {
        if (mask & (1n << BigInt(i))) part.push({ ...ordered[i] });
      }
      return part;
    });
  }

  /** @type {bigint[]} */
  const chosen = [];
  const full = (1n << BigInt(n)) - 1n;
  let nodes = 0;
  const nodeLimit = 80000;

  function dfs(uncovered, depth) {
    if (depth >= best) return;
    if (++nodes > nodeLimit) return;
    if (uncovered === 0n) {
      best = depth;
      bestParts = partsFromMasks(chosen);
      return;
    }
    if (depth + Math.ceil(popcountBigInt(uncovered) / areaCap) >= best) return;

    let bit = -1;
    let fewest = Infinity;
    for (let i = 0; i < n; i++) {
      if ((uncovered & (1n << BigInt(i))) === 0n) continue;
      let count = 0;
      for (const ci of coverOf[i]) {
        if ((cands[ci].mask & uncovered) === cands[ci].mask) count++;
      }
      if (count < fewest) {
        fewest = count;
        bit = i;
        if (count <= 1) break;
      }
    }
    if (bit < 0 || fewest === 0) return;

    for (const ci of coverOf[bit]) {
      const { mask } = cands[ci];
      if ((mask & uncovered) !== mask) continue;
      chosen.push(mask);
      dfs(uncovered ^ mask, depth + 1);
      chosen.pop();
      if (best <= minPossible || nodes > nodeLimit) return;
    }
  }

  dfs(full, 0);
  if (best <= minPossible) return bestParts;

  // Randomized greedy restarts — finds covers the bounded DFS misses (e.g. holed regions).
  const seeded = Array.isArray(seedParts) && seedParts.length > 0;
  const restartLimit = seeded
    ? Math.min(400, 40 + n * 4)
    : n >= 40
      ? 6000
      : Math.min(2500, 200 + n * 30);
  let stagnant = 0;
  for (let trial = 0; trial < restartLimit; trial++) {
    let uncovered = full;
    /** @type {bigint[]} */
    const masks = [];
    let failed = false;
    while (uncovered !== 0n) {
      if (masks.length + 1 >= best) {
        failed = true;
        break;
      }
      /** @type {number[]} */
      const bits = [];
      for (let i = 0; i < n; i++) {
        if (uncovered & (1n << BigInt(i))) bits.push(i);
      }
      let bit = bits[0];
      let fewest = Infinity;
      for (const i of bits) {
        let count = 0;
        for (const ci of coverOf[i]) {
          if ((cands[ci].mask & uncovered) === cands[ci].mask) count++;
        }
        const score = count + Math.random() * 0.75;
        if (score < fewest) {
          fewest = score;
          bit = i;
        }
      }
      /** @type {number[]} */
      const opts = [];
      for (const ci of coverOf[bit]) {
        if ((cands[ci].mask & uncovered) === cands[ci].mask) opts.push(ci);
      }
      if (!opts.length) {
        failed = true;
        break;
      }
      opts.sort((a, b) => cands[b].area - cands[a].area);
      const topN = Math.min(opts.length, 1 + ((Math.random() * 6) | 0));
      const pick = opts[(Math.random() * topN) | 0];
      masks.push(cands[pick].mask);
      uncovered ^= cands[pick].mask;
    }
    if (!failed && uncovered === 0n && masks.length < best) {
      best = masks.length;
      bestParts = partsFromMasks(masks);
      stagnant = 0;
      if (best <= minPossible) break;
      // Beating strip on a large region is enough — stop burning CPU looking for more.
      if (!seeded && n >= 40) break;
    } else if (seeded && ++stagnant > 200) {
      break;
    }
  }

  return bestParts;
}

/**
 * Partition tiles into filled rectangles each ≤ MAX_SECTOR_SPAN on either axis.
 * Greedy max-area from top-left; used for splitting a single illegal sector id.
 * Prefer partitionTilesIntoMinRectangles when minimizing sector count.
 * @param {{tx:number,ty:number}[]} tiles
 * @returns {{tx:number,ty:number}[][]}
 */
function splitTilesIntoValidChunks(tiles) {
  if (!tiles.length) return [];
  const remaining = new Set(tiles.map((t) => tileKey(t.tx, t.ty)));
  /** @type {{tx:number,ty:number}[][]} */
  const chunks = [];

  while (remaining.size) {
    let x0 = MAP_SIZE;
    let y0 = MAP_SIZE;
    for (const k of remaining) {
      const { tx, ty } = parseTileKey(k);
      if (ty < y0 || (ty === y0 && tx < x0)) {
        x0 = tx;
        y0 = ty;
      }
    }
    let maxW = 0;
    while (
      maxW < MAX_SECTOR_SPAN &&
      remaining.has(tileKey(x0 + maxW, y0))
    ) {
      maxW++;
    }
    let bestW = 1;
    let bestH = 1;
    for (let w = maxW; w >= 1; w--) {
      let h = 0;
      growH: while (h < MAX_SECTOR_SPAN) {
        for (let x = x0; x < x0 + w; x++) {
          if (!remaining.has(tileKey(x, y0 + h))) break growH;
        }
        h++;
      }
      if (h > 0 && w * h >= bestW * bestH) {
        bestW = w;
        bestH = h;
      }
    }
    /** @type {{tx:number,ty:number}[]} */
    const chunk = [];
    for (let ty = y0; ty < y0 + bestH; ty++) {
      for (let tx = x0; tx < x0 + bestW; tx++) {
        remaining.delete(tileKey(tx, ty));
        chunk.push({ tx, ty });
      }
    }
    chunks.push(chunk);
  }
  return chunks;
}

/**
 * Remap tiles of sectorId onto filled ≤15×15 rectangles (first keeps id).
 * @returns {string[]} warning messages
 */
function splitSectorIntoContiguousComponents(level, sectorId) {
  /** @type {string[]} */
  const warnings = [];
  const tiles = tilesInSector(level, sectorId);
  if (!tiles.length) return warnings;
  if (tilesAreValidSectorShape(tiles)) return warnings;

  const chunks = splitTilesIntoValidChunks(tiles);
  if (chunks.length <= 1) return warnings;

  const src = level.sectors.get(sectorId);
  if (!src) return warnings;

  for (let i = 1; i < chunks.length; i++) {
    const nid = allocSectorId(level);
    if (!nid) {
      warnings.push(`Sector ${sectorId}: no free ids to split remaining tiles`);
      break;
    }
    level.sectors.set(nid, cloneSector(src));
    for (const { tx, ty } of chunks[i]) {
      setCell(level, tx, ty, nid);
    }
    warnings.push(
      `Sector ${sectorId}: split rect onto id ${nid} (${chunks[i].length} tiles)`,
    );
  }
  return warnings;
}

/**
 * Runtime DDA assumes a sealed id-0 border so marches never leave the map array.
 * @returns {string[]} issues (empty if ok)
 */
function validateVoidBorder(level) {
  /** @type {string[]} */
  const issues = [];
  const last = MAP_SIZE - 1;
  for (let i = 0; i < MAP_SIZE; i++) {
    if (level.map[i] !== 0) {
      issues.push(`Void border required: non-void at (${i},0)`);
    }
    if (level.map[last * MAP_SIZE + i] !== 0) {
      issues.push(`Void border required: non-void at (${i},${last})`);
    }
    if (level.map[i * MAP_SIZE] !== 0) {
      issues.push(`Void border required: non-void at (0,${i})`);
    }
    if (level.map[i * MAP_SIZE + last] !== 0) {
      issues.push(`Void border required: non-void at (${last},${i})`);
    }
  }
  return issues;
}

/**
 * Fix every sector that is non-rectangular or larger than MAX_SECTOR_SPAN.
 * @returns {string[]}
 */
function enforceSectorShapes(level) {
  /** @type {string[]} */
  const warnings = [];
  const ids = [...level.sectors.keys()].sort((a, b) => a - b);
  for (const id of ids) {
    warnings.push(...splitSectorIntoContiguousComponents(level, id));
  }
  return warnings;
}

/**
 * @returns {{ ok: boolean, issues: string[] }}
 */
function validateAllSectors(level) {
  /** @type {string[]} */
  const issues = [];
  for (const id of [...level.sectors.keys()].sort((a, b) => a - b)) {
    const tiles = tilesInSector(level, id);
    if (!tiles.length) continue;
    if (!tilesAreConvex(tiles)) {
      issues.push(`Sector ${id}: not a filled rectangle (convex)`);
    }
    const b = sectorBounds(tiles);
    if (b && (b.w > MAX_SECTOR_SPAN || b.h > MAX_SECTOR_SPAN)) {
      issues.push(`Sector ${id}: bbox ${b.w}×${b.h} exceeds ${MAX_SECTOR_SPAN}`);
    }
  }
  return { ok: issues.length === 0, issues };
}

function getTileProps(level, tx, ty) {
  const id = getCell(level, tx, ty);
  if (!id || !level.sectors.has(id)) return null;
  return cloneSector(level.sectors.get(id));
}

/** Place props on a tile (allocates a fresh sector id). Returns id or 0. */
function setTileProps(level, tx, ty, props) {
  const old = getCell(level, tx, ty);
  const id = allocSectorId(level);
  if (!id) return 0;
  level.sectors.set(id, cloneSector(props));
  setCell(level, tx, ty, id);
  dropSectorIfEmpty(level, old);
  return id;
}

/**
 * Add a tile at (tx,ty). Uses brush props if provided, else default.
 * Prefers extending an adjacent matching sector when legal; otherwise new id.
 * Returns true on success, false if no free id.
 * Sets level._lastPaintNote when extend was skipped due to span/convexity.
 */
function addTile(level, tx, ty, brush = null) {
  level._lastPaintNote = null;
  const props = brush ? cloneSector(brush) : defaultSector();

  if (brush) {
    const dirs = [
      [1, 0],
      [-1, 0],
      [0, 1],
      [0, -1],
    ];
    /** @type {number[]} */
    const matching = [];
    for (const [dx, dy] of dirs) {
      const nx = tx + dx;
      const ny = ty + dy;
      if (nx < 0 || ny < 0 || nx >= MAP_SIZE || ny >= MAP_SIZE) continue;
      const nid = getCell(level, nx, ny);
      if (!nid) continue;
      const s = level.sectors.get(nid);
      if (s && sectorsEqual(s, props)) matching.push(nid);
    }
    for (const nid of matching) {
      if (canAddTileToSector(level, nid, tx, ty)) {
        paintSector(level, tx, ty, nid);
        rebuildSectors(level);
        return true;
      }
    }
    if (matching.length) {
      level._lastPaintNote =
        'New sector id: adjacent match cannot grow (must stay a ≤15×15 rectangle)';
    }
  }

  if (!setTileProps(level, tx, ty, props)) return false;
  rebuildSectors(level);
  return true;
}

/**
 * Apply a property patch to all listed tiles. Empty tiles are skipped.
 * Rebuilds sectors afterward.
 */
function applyTilePatch(level, tiles, patch) {
  applyPropsBySector(level, groupTilesBySector(level, tiles), (cur) => {
    const next = cloneSector(cur);
    if ('floorHeight' in patch) next.floorHeight = clampNum(patch.floorHeight, 0, 31);
    if ('ceilingHeight' in patch) next.ceilingHeight = clampNum(patch.ceilingHeight, 0, 31);
    if ('trigger' in patch) next.trigger = normalizeTrigger(patch.trigger);
    if ('singleShot' in patch) next.singleShot = !!patch.singleShot;
    if ('action' in patch) {
      next.action = normalizeAction(patch.action);
      if (next.action === 'secret') {
        next.trigger = 'walk_into';
        next.singleShot = true;
      }
      if (next.action === 'open_monster_closet') {
        next.singleShot = true;
      }
    }
    if ('tag' in patch) next.tag = String(patch.tag ?? '').trim();
    if ('targetTag' in patch) next.targetTag = String(patch.targetTag ?? '').trim();
    if ('brightness' in patch) next.brightness = clampNum(patch.brightness, 0, 16);
    if ('floorColor' in patch) next.floorColor = normalizeColor(patch.floorColor);
    if ('ceilingColor' in patch) next.ceilingColor = normalizeColor(patch.ceilingColor);
    return next;
  });
  rebuildSectors(level);
}

/** Clear multiple tiles, then rebuild. */
function clearTiles(level, tiles) {
  for (const { tx, ty } of tiles) clearTile(level, tx, ty);
  rebuildSectors(level);
}

/**
 * Move tiles by (dtx, dty). Off-map tiles are deleted.
 * Returns the new tile positions that remain on the map.
 * Allocates at most one sector id per original sector group (not per tile).
 */
function moveTiles(level, tiles, dtx, dty) {
  if (!dtx && !dty) return tiles.map((t) => ({ ...t }));

  /** @type {{ tx: number, ty: number, props: ReturnType<typeof defaultSector>, sectorId: number }[]} */
  const entries = [];
  for (const { tx, ty } of tiles) {
    const sectorId = getCell(level, tx, ty);
    if (!sectorId || !level.sectors.has(sectorId)) continue;
    const props = getTileProps(level, tx, ty);
    if (!props) continue;
    entries.push({ tx, ty, props, sectorId });
  }

  for (const e of entries) clearTile(level, e.tx, e.ty);

  /** @type {Map<number, { props: ReturnType<typeof defaultSector>, dests: {tx:number,ty:number}[] }>} */
  const groups = new Map();
  for (const e of entries) {
    const ntx = e.tx + dtx;
    const nty = e.ty + dty;
    if (ntx < 0 || ntx >= MAP_SIZE || nty < 0 || nty >= MAP_SIZE) continue;
    let g = groups.get(e.sectorId);
    if (!g) {
      g = { props: e.props, dests: [] };
      groups.set(e.sectorId, g);
    }
    g.dests.push({ tx: ntx, ty: nty });
  }

  const placed = [];
  for (const [oldId, g] of groups) {
    // Reuse the old id when clearTile dropped the sector (whole sector moved).
    let nid = level.sectors.has(oldId) ? 0 : oldId;
    if (!nid) nid = allocSectorId(level);
    if (!nid) break;
    level.sectors.set(nid, cloneSector(g.props));
    for (const d of g.dests) {
      const old = getCell(level, d.tx, d.ty);
      setCell(level, d.tx, d.ty, nid);
      if (old && old !== nid) dropSectorIfEmpty(level, old);
      placed.push(d);
    }
  }
  rebuildSectors(level);
  return placed;
}

/**
 * Move items by world delta. Removes items that leave the map.
 * Returns the items that remain.
 */
function moveItemsBy(level, items, dx, dy) {
  const kept = [];
  for (const it of items) {
    const nx = it.x + dx;
    const ny = it.y + dy;
    if (nx < 0 || nx > WORLD_MAX || ny < 0 || ny > WORLD_MAX) {
      if (isSpawn(it)) {
        it.x = clampWorld(nx);
        it.y = clampWorld(ny);
        kept.push(it);
      } else {
        removeItem(level, it);
      }
      continue;
    }
    it.x = nx;
    it.y = ny;
    kept.push(it);
  }
  return kept;
}

function clampNum(v, lo, hi) {
  return Math.max(lo, Math.min(hi, Number(v) || 0));
}

function tileKey(tx, ty) {
  return `${tx},${ty}`;
}

function parseTileKey(key) {
  const [tx, ty] = key.split(',').map(Number);
  return { tx, ty };
}

/**
 * Merge source sector into target if union is a filled ≤15×15 rectangle.
 * Returns true on success.
 */
function mergeSectors(level, targetId, sourceId) {
  if (targetId === sourceId || !targetId || !sourceId) return false;
  if (!level.sectors.has(targetId) || !level.sectors.has(sourceId)) return false;
  const union = tilesInSector(level, targetId).concat(tilesInSector(level, sourceId));
  if (!tilesAreValidSectorShape(union)) return false;
  for (let i = 0; i < MAP_CELLS; i++) {
    if (level.map[i] === sourceId) level.map[i] = targetId;
  }
  level.sectors.delete(sourceId);
  return true;
}

function hasSpawn(level) {
  return !!level.spawn;
}

/** Place or move the level spawn (always exactly one). */
function setSpawn(level, x, y, angle) {
  if (!level.spawn) level.spawn = defaultSpawn();
  level.spawn.type = SPAWN_TYPE;
  level.spawn.x = clampWorld(x);
  level.spawn.y = clampWorld(y);
  if (angle !== undefined) level.spawn.angle = normalizeAngle(angle);
  return level.spawn;
}

function addItem(level, type, x, y, skills = defaultSkills()) {
  if (type === SPAWN_TYPE) {
    return setSpawn(level, x, y);
  }
  if (type === CAMERA_TYPE) {
    const item = {
      type: CAMERA_TYPE,
      x: clampWorld(x),
      y: clampWorld(y),
      angle: 0,
    };
    level.items.push(item);
    return item;
  }
  if (type === SWITCH_TYPE || isSwitchCookType(type)) {
    if (gameItemCount(level) >= MAX_PLACEABLE_ITEMS) return null;
    const item = {
      type: SWITCH_TYPE,
      x: clampWorld(x),
      y: clampWorld(y),
    };
    level.items.push(item);
    return item;
  }
  if (gameItemCount(level) >= MAX_PLACEABLE_ITEMS) return null;
  if (ENEMY_TYPES.has(type) && enemyCount(level) >= MAX_ENEMIES) return null;
  const item = {
    type,
    x: clampWorld(x),
    y: clampWorld(y),
    skills: { ...skills },
  };
  level.items.push(item);
  return item;
}

function removeItem(level, item) {
  if (isSpawn(item)) return; // spawn is required
  const i = level.items.indexOf(item);
  if (i >= 0) level.items.splice(i, 1);
}

function moveItem(level, item, x, y) {
  item.x = clampWorld(x);
  item.y = clampWorld(y);
}

/** True if selection ref is still on the level (spawn or items). */
function itemStillOnLevel(level, item) {
  if (isSpawn(item)) return level.spawn === item;
  return level.items.includes(item);
}

function activeLevel(episode) {
  return episode.levels[episode.activeLevel];
}

// ---- js/io.js ----
/**
 * Cooked binary layout (no header), per level — structure-of-arrays:
 *   1. Map: 1024 bytes sector ids (first so runtime level_map is $a000 / 32-aligned)
 *   2. Sector attribute tables: 7 × 200 bytes (index = sector id; byte 0 unused)
 *      order: floor, ceil, special (packed trigger|oneshot|action), targetSector,
 *      floorColor, ceilingColor, brightness
 *      special: bits1:0=trigger, bit2=single_shot, bits7:3=action
 *      targetSector is the resolved sector id (from editor targetTag); 0 if empty / unresolved
 *      Same-tag sectors are linked into a sibling chain via targetSector (head ← triggers;
 *      each member points at the next). Runtime walks the chain for remote door/floor actions.
 *      editor tag strings are not stored in the binary
 *   3. Spawn: 3 bytes — x, y, angleByte (playera 0..255)
 *   4. Items SoA: 4 × 48 bytes — typeId[48], x[48], y[48], meta[48]
 *      meta: skillBits (bit0=easy, bit1=normal, bit2=hard); switches use meta=0
 *      unused item slots: typeId=0xFF
 *      spawn is not an item (typeId 0 unused in table)
 *   5. switch faces: 17 bytes — count, sec[8], dir[8]
 *      (switch sector id + NESW face of the solid; see buildSwitchFaceBindings)
 *   6. sector_max: 1 byte — max sector id used in map or sector table
 *   7. stats: 4 bytes — num_enemies, num_items, num_secrets, par_time (seconds)
 * Display name is not in the binary (resident titles in the game PRG).
 * Colors: 0..15 = Commodore 64 palette

 * typeId: index into ITEM_TYPES (0-based); 0xFF = empty slot
 */

const SECTOR_TABLE_COUNT = 7;		 // floor, ceil, type, target, fcol, ccol, bright
const SECTOR_TABLE_SIZE = 200;		 // index = sector id; [0] unused
const ITEM_BYTES = 4;
const SPAWN_BYTES = 3;
const SWITCH_FACE_BYTES = 1 + MAX_SWITCH_FACES * 2;
const EMPTY_ITEM_TYPE = 0xff;

function levelToJSON(level) {
  const sectorObj = {};
  for (const [id, s] of level.sectors) {
    sectorObj[String(id)] = {
      floorHeight: s.floorHeight,
      ceilingHeight: s.ceilingHeight,
      trigger: normalizeTrigger(s.trigger),
      singleShot: !!s.singleShot,
      action: normalizeAction(s.action),
      tag: s.tag || '',
      targetTag: s.targetTag || '',
      floorColor: s.floorColor,
      ceilingColor: s.ceilingColor,
      brightness: s.brightness,
    };
  }
  return {
    name: clampLevelName(level.name),
    parTime: clampParTime(level.parTime),
    sectors: sectorObj,
    map: Array.from(level.map),
    spawn: {
      x: level.spawn?.x ?? 0,
      y: level.spawn?.y ?? 0,
      angle: level.spawn?.angle ?? 0,
    },
    items: level.items
      .filter((it) => !isSwitch(it))
      .map((it) => {
        const base = {
          type: it.type,
          x: it.x,
          y: it.y,
        };
        if (it.type === CAMERA_TYPE) {
          return { ...base, angle: it.angle ?? 0 };
        }
        return { ...base, skills: { ...it.skills } };
      }),
  };
}

function levelFromJSON(data, opts = {}) {
  const level = createEmptyLevel();
  level.name = clampLevelName(data.name);
  const fallbackPar =
    data.parTime != null
      ? data.parTime
      : (opts.defaultPar ?? level.parTime);
  level.parTime = clampParTime(fallbackPar);
  if (data.sectors) {
    for (const [key, s] of Object.entries(data.sectors)) {
      const id = Number(key);
      // Allow sparse high ids on load; compactSectorIds remaps to 1..n
      if (id < 1 || id > 255 || !Number.isFinite(id)) continue;
      const d = defaultSector();
      const targetTag = String(s.targetTag ?? d.targetTag ?? '').trim();
      let trigger = s.trigger;
      let singleShot = s.singleShot;
      let action = s.action;
      // Migrate legacy sectorType / door checkbox
      if (trigger == null && action == null && (s.sectorType != null || s.door)) {
        let sectorType = clamp(s.sectorType ?? 0, 0, 255);
        if (s.door && sectorType === 0) sectorType = 18;
        const mig = migrateLegacySectorType(sectorType, targetTag);
        trigger = mig.trigger;
        singleShot = mig.singleShot;
        action = mig.action;
      }
      level.sectors.set(id, {
        floorHeight: clamp(s.floorHeight ?? d.floorHeight, 0, 31),
        ceilingHeight: clamp(s.ceilingHeight ?? d.ceilingHeight, 0, 31),
        trigger: normalizeTrigger(trigger ?? d.trigger),
        singleShot: !!(singleShot ?? d.singleShot),
        action: normalizeAction(action ?? d.action),
        tag: String(s.tag ?? d.tag ?? '').trim(),
        targetTag,
        floorColor: normalizeColor(s.floorColor, d.floorColor),
        ceilingColor: normalizeColor(s.ceilingColor, d.ceilingColor),
        brightness: clamp(s.brightness ?? d.brightness, 0, 16),
      });
    }
  }
  if (Array.isArray(data.map) && data.map.length === MAP_CELLS) {
    for (let i = 0; i < MAP_CELLS; i++) {
      level.map[i] = data.map[i] & 0xff;
    }
  }

  // Spawn: dedicated field, or migrate legacy item type "spawn"
  let legacySpawn = null;
  /** @type {{ x: number, y: number, switchAction?: string, targetTag?: string }[]} */
  const legacySwitches = [];
  if (Array.isArray(data.items)) {
    for (const it of data.items) {
      if (it.type === CAMERA_TYPE) {
        level.items.push({
          type: CAMERA_TYPE,
          x: clamp(it.x ?? 0, 0, 255),
          y: clamp(it.y ?? 0, 0, 255),
          angle: normalizeAngle(it.angle),
        });
        continue;
      }
      if (it.type === SPAWN_TYPE) {
        legacySpawn = it;
        continue;
      }
      const asSwitch = coerceSwitchItem(it);
      if (asSwitch) {
        // Legacy prop — effect lives on sector trigger=switch; do not place item.
        if (it.switchAction || it.targetTag) {
          legacySwitches.push({
            x: asSwitch.x,
            y: asSwitch.y,
            switchAction: it.switchAction || it.type,
            targetTag: it.targetTag,
          });
        }
        continue;
      }
      if (!ITEM_TYPES.includes(it.type) || !isGameItem(it.type)) continue;
      if (gameItemCount(level) >= MAX_PLACEABLE_ITEMS) break;
      level.items.push({
        type: it.type,
        x: clamp(it.x ?? 0, 0, 255),
        y: clamp(it.y ?? 0, 0, 255),
        skills: {
          easy: it.skills?.easy !== false,
          normal: it.skills?.normal !== false,
          hard: it.skills?.hard !== false,
        },
      });
    }
  }

  // Apply legacy switch actions onto the sector under each switch
  for (const sw of legacySwitches) {
    const mig = migrateSwitchAction(sw.switchAction);
    if (!mig) continue;
    const tx = Math.floor(sw.x / WORLD_PER_TILE);
    const ty = Math.floor(sw.y / WORLD_PER_TILE);
    const sid = getCell(level, tx, ty);
    if (!sid) continue;
    const sec = level.sectors.get(sid);
    if (!sec) continue;
    sec.trigger = mig.trigger;
    sec.singleShot = mig.singleShot;
    sec.action = mig.action;
    const tag = String(sw.targetTag ?? '').trim();
    if (tag) sec.targetTag = tag;
  }

  if (data.spawn) {
    setSpawn(
      level,
      data.spawn.x ?? 0,
      data.spawn.y ?? 0,
      data.spawn.angle ?? 0,
    );
  } else if (legacySpawn) {
    // Legacy: use spawn item xy; angle from item if present, else old hardcoded playera=250
    const ang =
      legacySpawn.angle != null
        ? Number(legacySpawn.angle) || 0
        : byteToAngle(250);
    setSpawn(level, legacySpawn.x ?? 0, legacySpawn.y ?? 0, ang);
  } else {
    level.spawn = defaultSpawn();
  }

  compactSectorIds(level);
  /** @type {string[]} */
  const loadWarn = [];
  if (level.sectors.size > MAX_SECTORS) {
    loadWarn.push(`Too many sectors (${level.sectors.size}/${MAX_SECTORS})`);
  }
  loadWarn.push(...enforceSectorShapes(level));
  loadWarn.push(...validateVoidBorder(level));
  if (loadWarn.length) {
    level._loadWarnings = loadWarn;
  }
  return level;
}

function episodeToJSON(episode) {
  const levels = {};
  for (const name of LEVEL_NAMES) {
    levels[name] = levelToJSON(episode.levels[name]);
  }
  return {
    format: 'squaredoom-map',
    version: 1,
    activeLevel: episode.activeLevel,
    levels,
  };
}

function episodeFromJSON(data) {
  const episode = createEpisode();
  if (data?.format !== 'squaredoom-map') {
    throw new Error('Unrecognized map format');
  }
  if (data.levels) {
    for (const name of LEVEL_NAMES) {
      if (data.levels[name]) {
        episode.levels[name] = levelFromJSON(data.levels[name], {
          defaultPar: DEFAULT_PAR_BY_LEVEL[name],
        });
      }
    }
  }
  if (data.activeLevel && episode.levels[data.activeLevel]) {
    episode.activeLevel = data.activeLevel;
  }
  return episode;
}

/**
 * Link sectors that share a tag into a SEC_TARGET sibling chain (sorted by id).
 * Members that already have a cooked target (their own targetTag) are left alone.
 * Triggers keep pointing at the lowest-id head via normal targetTag resolution.
 */
function chainSameTagTargets(level, targets, warnings) {
  const seen = new Set();
  const ids = [...level.sectors.keys()].sort((a, b) => a - b);
  for (const id of ids) {
    const tag = (level.sectors.get(id).tag || '').trim();
    if (!tag || seen.has(tag)) continue;
    seen.add(tag);
    const members = findAllSectorIdsByTag(level, tag);
    if (members.length < 2) continue;
    const chainable = [];
    for (const mid of members) {
      if (targets[mid]) {
        warnings.push(
          `Sector ${mid}: tag "${tag}" also has targetTag — excluded from tag chain`,
        );
        continue;
      }
      chainable.push(mid);
    }
    if (chainable.length < 2) {
      warnings.push(
        `Tag "${tag}": ${members.length} sectors but fewer than 2 chainable`,
      );
      continue;
    }
    for (let i = 0; i < chainable.length - 1; i++) {
      targets[chainable[i]] = chainable[i + 1] & 0xff;
    }
    warnings.push(`Tag "${tag}": ${chainable.length} sectors chained`);
  }
}

function cookLevel(level) {
  /** @type {string[]} */
  const warnings = [];
  /** @type {string[]} */
  const errors = [];
  compactSectorIds(level);
  if (level.sectors.size > MAX_SECTORS) {
    errors.push(`Too many sectors (${level.sectors.size}/${MAX_SECTORS})`);
  }
  warnings.push(...enforceSectorShapes(level));
  errors.push(...validateVoidBorder(level));

  const floors = new Uint8Array(SECTOR_TABLE_SIZE);
  const ceils = new Uint8Array(SECTOR_TABLE_SIZE);
  const types = new Uint8Array(SECTOR_TABLE_SIZE);
  const targets = new Uint8Array(SECTOR_TABLE_SIZE);
  const fcols = new Uint8Array(SECTOR_TABLE_SIZE);
  const ccols = new Uint8Array(SECTOR_TABLE_SIZE);
  const brights = new Uint8Array(SECTOR_TABLE_SIZE);

  for (let id = 1; id <= MAX_SECTORS; id++) {
    const s = level.sectors.get(id);
    if (!s) continue;
    const type = packSectorSpecial(s.trigger, s.singleShot, s.action);
    let targetId = 0;
    const tag = (s.targetTag || '').trim();
    if (tag) {
      targetId = findSectorIdByTag(level, tag);
      if (!targetId) {
        warnings.push(`Sector ${id}: target tag "${tag}" not found`);
      }
    }
    floors[id] = s.floorHeight & 31;
    ceils[id] = s.ceilingHeight & 31;
    types[id] = type;
    targets[id] = targetId & 0xff;
    fcols[id] = colorIndex(s.floorColor) & 15;
    ccols[id] = colorIndex(s.ceilingColor) & 15;
    brights[id] = Math.min(16, s.brightness & 31);
  }

  chainSameTagTargets(level, targets, warnings);

  const mapBytes = new Uint8Array(level.map);

  const gameItems = level.items.filter((it) => isGameItem(it.type));
  const nEnemies = enemyCount(level);
  if (nEnemies > MAX_ENEMIES) {
    errors.push(`Too many enemies (${nEnemies}/${MAX_ENEMIES})`);
  }

  const typesArr = new Uint8Array(MAX_ITEMS);
  const xs = new Uint8Array(MAX_ITEMS);
  const ys = new Uint8Array(MAX_ITEMS);
  const metas = new Uint8Array(MAX_ITEMS);
  typesArr.fill(EMPTY_ITEM_TYPE);
  for (let i = 0; i < MAX_ITEMS; i++) {
    const it = gameItems[i];
    if (!it) continue;
    const typeId = ITEM_TYPES.indexOf(it.type);
    typesArr[i] = typeId < 0 ? EMPTY_ITEM_TYPE : typeId;
    xs[i] = it.x & 0xff;
    ys[i] = it.y & 0xff;
    let bits = 0;
    if (it.skills.easy) bits |= 1;
    if (it.skills.normal) bits |= 2;
    if (it.skills.hard) bits |= 4;
    metas[i] = bits;
  }
  const itemTable = new Uint8Array(MAX_ITEMS * ITEM_BYTES);
  itemTable.set(typesArr, 0);
  itemTable.set(xs, MAX_ITEMS);
  itemTable.set(ys, MAX_ITEMS * 2);
  itemTable.set(metas, MAX_ITEMS * 3);

  const spawn = level.spawn ?? defaultSpawn();
  const spawnBytes = new Uint8Array([
    spawn.x & 0xff,
    spawn.y & 0xff,
    angleToByte(spawn.angle),
  ]);

  // Highest sector id referenced by the map or present in the sector table
  let sectorMax = 0;
  for (let i = 0; i < mapBytes.length; i++) {
    if (mapBytes[i] > sectorMax) sectorMax = mapBytes[i];
  }
  for (const id of level.sectors.keys()) {
    if (id > sectorMax) sectorMax = id;
  }
  if (sectorMax > MAX_SECTORS) sectorMax = MAX_SECTORS;

  const switchFaces = buildSwitchFaceBindings(level);
  if (switchFaces.length > MAX_SWITCH_FACES) {
    errors.push(
      `Too many switch faces (${switchFaces.length}/${MAX_SWITCH_FACES})`,
    );
  }
  const switchTable = new Uint8Array(SWITCH_FACE_BYTES);
  const nSw = Math.min(switchFaces.length, MAX_SWITCH_FACES);
  switchTable[0] = nSw;
  for (let i = 0; i < nSw; i++) {
    switchTable[1 + i] = switchFaces[i].sec & 0xff;
    switchTable[1 + MAX_SWITCH_FACES + i] = switchFaces[i].dir & 3;
  }

  const sectorBytes = SECTOR_TABLE_COUNT * SECTOR_TABLE_SIZE;
  const nItems = statItemCount(level);
  const nSecrets = secretCount(level);
  const out = new Uint8Array(
    mapBytes.length +
      sectorBytes +
      SPAWN_BYTES +
      itemTable.length +
      SWITCH_FACE_BYTES +
      5,
  );
  let o = 0;
  out.set(mapBytes, o); o += mapBytes.length;
  out.set(floors, o); o += SECTOR_TABLE_SIZE;
  out.set(ceils, o); o += SECTOR_TABLE_SIZE;
  out.set(types, o); o += SECTOR_TABLE_SIZE;
  out.set(targets, o); o += SECTOR_TABLE_SIZE;
  out.set(fcols, o); o += SECTOR_TABLE_SIZE;
  out.set(ccols, o); o += SECTOR_TABLE_SIZE;
  out.set(brights, o); o += SECTOR_TABLE_SIZE;
  out.set(spawnBytes, o); o += SPAWN_BYTES;
  out.set(itemTable, o); o += itemTable.length;
  out.set(switchTable, o); o += SWITCH_FACE_BYTES;
  out[o++] = sectorMax & 0xff;
  out[o++] = nEnemies & 0xff;
  out[o++] = nItems & 0xff;
  out[o++] = nSecrets & 0xff;
  out[o++] = clampParTime(level.parTime) & 0xff;
  return { bytes: out, warnings, errors };
}

function clamp(v, lo, hi) {
  v = Number(v) || 0;
  return Math.max(lo, Math.min(hi, v));
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function pickJsonFile() {
  return new Promise((resolve, reject) => {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = async () => {
      const file = input.files?.[0];
      if (!file) {
        resolve(null);
        return;
      }
      try {
        const text = await file.text();
        resolve(episodeFromJSON(JSON.parse(text)));
      } catch (err) {
        reject(err);
      }
    };
    // Ignore cancel (no change event in most browsers)
    input.addEventListener('cancel', () => resolve(null));
    input.click();
  });
}

const DEFAULT_EPISODE_PATH = 'episode1.json';

const HANDLE_DB = 'squaredoom-editor';
const HANDLE_STORE = 'handles';
const HANDLE_KEY = 'episode';

/** @type {FileSystemFileHandle | null} */
let episodeFileHandle = null;

function episodeFileName() {
  return episodeFileHandle?.name || DEFAULT_EPISODE_PATH;
}

function hasEpisodeFileHandle() {
  return !!episodeFileHandle;
}

function openHandleDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(HANDLE_DB, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(HANDLE_STORE)) {
        db.createObjectStore(HANDLE_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

async function storeEpisodeHandle(handle) {
  episodeFileHandle = handle;
  if (!window.indexedDB || !handle) return;
  const db = await openHandleDb();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(HANDLE_STORE, 'readwrite');
    tx.objectStore(HANDLE_STORE).put(handle, HANDLE_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
  db.close();
}

async function loadStoredEpisodeHandle() {
  if (!window.indexedDB) return null;
  try {
    const db = await openHandleDb();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction(HANDLE_STORE, 'readonly');
      const req = tx.objectStore(HANDLE_STORE).get(HANDLE_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return handle || null;
  } catch (_) {
    return null;
  }
}

async function queryPermission(handle, mode = 'readwrite') {
  if (!handle?.queryPermission) return 'granted';
  return handle.queryPermission({ mode });
}

async function ensurePermission(handle, mode = 'readwrite') {
  if (!handle?.queryPermission || !handle?.requestPermission) return true;
  const opts = { mode };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  // Shows the browser Allow/Deny prompt (must run from a user gesture).
  return (await handle.requestPermission(opts)) === 'granted';
}

async function writeEpisodeToHandle(handle, episode) {
  const text = JSON.stringify(episodeToJSON(episode), null, 2);
  const writable = await handle.createWritable();
  await writable.write(text);
  await writable.close();
}

async function readEpisodeFromHandle(handle) {
  const file = await handle.getFile();
  return episodeFromJSON(JSON.parse(await file.text()));
}

/** Previously chosen episode file, if any (may still need an Allow click). */
async function getStoredEpisodeHandle() {
  return loadStoredEpisodeHandle();
}

/** Load without prompting — only when permission is already granted. */
async function tryRestoreEpisodeFile() {
  const handle = await loadStoredEpisodeHandle();
  if (!handle) return null;
  const writeState = await queryPermission(handle, 'readwrite');
  const readState = writeState === 'granted' ? 'granted' : await queryPermission(handle, 'read');
  if (readState !== 'granted') return null;
  episodeFileHandle = handle;
  return readEpisodeFromHandle(handle);
}

/**
 * Request Allow for a stored handle (call from a click), then load it.
 * @returns {Promise<object|null>}
 */
async function allowStoredEpisodeFile(handle) {
  if (!handle) return null;
  if (!(await ensurePermission(handle, 'readwrite'))) {
    if (!(await ensurePermission(handle, 'read'))) return null;
  }
  await storeEpisodeHandle(handle);
  return readEpisodeFromHandle(handle);
}

async function autosaveEpisodeJSON(episode) {
  if (!episodeFileHandle) {
    throw new Error(`Load ${DEFAULT_EPISODE_PATH} once so autosave can write it`);
  }
  if (!(await ensurePermission(episodeFileHandle, 'readwrite'))) {
    throw new Error(`No write permission for ${episodeFileHandle.name}`);
  }
  await writeEpisodeToHandle(episodeFileHandle, episode);
  return 'file';
}

async function saveEpisodeJSON(episode, suggestedName = DEFAULT_EPISODE_PATH) {
  if (episodeFileHandle && (await ensurePermission(episodeFileHandle, 'readwrite'))) {
    await writeEpisodeToHandle(episodeFileHandle, episode);
    return 'file';
  }

  if (window.showSaveFilePicker) {
    try {
      const handle = await window.showSaveFilePicker({
        suggestedName,
        types: [{ description: 'SquareDoom Map', accept: { 'application/json': ['.json'] } }],
      });
      await storeEpisodeHandle(handle);
      await writeEpisodeToHandle(handle, episode);
      return 'file';
    } catch (e) {
      if (e.name === 'AbortError') return null;
    }
  }

  const text = JSON.stringify(episodeToJSON(episode), null, 2);
  downloadBlob(new Blob([text], { type: 'application/json' }), suggestedName);
  return 'download';
}

async function loadEpisodeJSON() {
  if (window.showOpenFilePicker) {
    try {
      const [handle] = await window.showOpenFilePicker({
        types: [{ description: 'SquareDoom Map', accept: { 'application/json': ['.json'] } }],
        multiple: false,
      });
      await storeEpisodeHandle(handle);
      return readEpisodeFromHandle(handle);
    } catch (e) {
      if (e.name === 'AbortError') return null;
      // Fall through to <input type="file"> on SecurityError etc.
    }
  }
  return pickJsonFile();
}

function cookAndDownload(episode, levelName) {
  const level = episode.levels[levelName];
  const { bytes, warnings, errors } = cookLevel(level);
  if (errors?.length) {
    return { warnings, errors };
  }
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  downloadBlob(blob, `${levelName.toLowerCase()}.bin`);
  return { warnings, errors: [] };
}

// ---- js/mapView.js ----
class MapView {
  /**
   * @param {HTMLCanvasElement} canvas
   * @param {object} opts
   * @param {() => any} opts.getLevel
   * @param {() => {
   *   tiles: Set<string>,
   *   items: Set<any>,
   *   hoverTile: {tx:number,ty:number}|null,
   *   box: {x0:number,y0:number,x1:number,y1:number}|null,
   * }} opts.getSelection
   * @param {(ev: PointerEvent, info: object) => void} opts.onPointer
   * @param {(type: string, wx: number, wy: number) => void} opts.onDropItem
   * @param {Record<string, HTMLImageElement>} opts.images
   * @param {HTMLElement} [opts.stage]
   */
  constructor(canvas, opts) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.opts = opts;
    this.cell = 18;
    this.stage = opts.stage || canvas.parentElement;
    this._ro = null;
    this.dragGrab = null;

    this.resize();
    this._ro = new ResizeObserver(() => this.resize());
    if (this.stage) this._ro.observe(this.stage);

    canvas.addEventListener('pointerdown', (e) => this.#onPointer(e));
    canvas.addEventListener('pointermove', (e) => this.#onPointer(e));
    canvas.addEventListener('pointerup', (e) => this.#onPointer(e));
    canvas.addEventListener('pointerleave', (e) => this.#onPointer(e));
    canvas.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });
    canvas.addEventListener('drop', (e) => {
      e.preventDefault();
      const type = e.dataTransfer.getData('text/item-type') || e.dataTransfer.getData('text/plain');
      if (!type) return;
      const { wx, wy } = this.#eventWorld(e);
      this.opts.onDropItem(type, wx, wy);
    });
  }

  resize() {
    if (!this.stage) return;
    const rect = this.stage.getBoundingClientRect();
    const pad = 2;
    const side = Math.max(64, Math.floor(Math.min(rect.width, rect.height) - pad));
    const cell = Math.max(4, Math.floor(side / MAP_SIZE));
    const px = cell * MAP_SIZE;
    if (cell === this.cell && this.canvas.width === px) return;
    this.cell = cell;
    this.canvas.width = px;
    this.canvas.height = px;
    this.canvas.style.width = `${px}px`;
    this.canvas.style.height = `${px}px`;
    this.draw();
  }

  #eventCanvas(e) {
    const rect = this.canvas.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * this.canvas.width;
    const y = ((e.clientY - rect.top) / rect.height) * this.canvas.height;
    return { x, y };
  }

  #canvasToWorld(x, y) {
    const c = this.cell;
    return {
      wx: Math.max(0, Math.min(255, Math.round((x / c) * WORLD_PER_TILE))),
      wy: Math.max(0, Math.min(255, Math.round((y / c) * WORLD_PER_TILE))),
    };
  }

  #eventCell(e) {
    const { x, y } = this.#eventCanvas(e);
    const tx = Math.max(0, Math.min(MAP_SIZE - 1, Math.floor(x / this.cell)));
    const ty = Math.max(0, Math.min(MAP_SIZE - 1, Math.floor(y / this.cell)));
    return { tx, ty, px: x, py: y };
  }

  #eventWorld(e) {
    const { x, y } = this.#eventCanvas(e);
    return this.#canvasToWorld(x, y);
  }

  #itemDrawPos(it, c) {
    const ix = (it.x / WORLD_PER_TILE) * c;
    const iy = (it.y / WORLD_PER_TILE) * c;
    const spriteSize = Math.max(6, Math.round(c * 0.45));
    return { ix, iy, spriteSize };
  }

  #spriteSize(it, baseSize) {
    const img = this.opts.images[it.type];
    let drawW = baseSize;
    const drawH = baseSize;
    if (img?.complete && img.naturalWidth > 0) {
      drawW = drawH * (img.naturalWidth / img.naturalHeight);
    }
    return { drawW, drawH };
  }

  #hitItem(level, px, py) {
    const markers = level.spawn ? [...level.items, level.spawn] : level.items;
    for (let i = markers.length - 1; i >= 0; i--) {
      const it = markers[i];
      const { ix, iy, spriteSize } = this.#itemDrawPos(it, this.cell);
      const { drawW, drawH } = this.#spriteSize(it, spriteSize);
      const left = ix - drawW / 2;
      const top = iy - drawH / 2;
      if (px >= left && px <= left + drawW && py >= top && py <= top + drawH) return it;
    }
    return null;
  }

  #onPointer(e) {
    const { tx, ty, px, py } = this.#eventCell(e);
    const level = this.opts.getLevel();
    const item = this.#hitItem(level, px, py);

    if (e.type === 'pointerdown' && item) {
      const pos = this.#itemDrawPos(item, this.cell);
      this.dragGrab = { x: px - pos.ix, y: py - pos.iy };
    }
    if (e.type === 'pointerup' || e.type === 'pointerleave') {
      this.dragGrab = null;
    }

    const grab = this.dragGrab ?? { x: 0, y: 0 };
    const { wx, wy } = this.#canvasToWorld(px - grab.x, py - grab.y);

    this.opts.onPointer(e, {
      tx,
      ty,
      wx,
      wy,
      px,
      py,
      item,
      sectorId: getCell(level, tx, ty),
      shift: e.shiftKey,
      alt: e.altKey,
      ctrl: e.ctrlKey || e.metaKey,
    });
  }

  #sectorFill(level, id) {
    if (id === 0) return '#1a1a1e';
    const s = level.sectors.get(id);
    if (!s) return '#333';
    const base = colorHex(s.floorColor) || '#444';
    return mixHex(base, 0.35 + (s.floorHeight / 31) * 0.25 + ((id * 17) % 7) * 0.03);
  }

  draw() {
    const level = this.opts.getLevel();
    const sel = this.opts.getSelection();
    const ctx = this.ctx;
    const c = this.cell;
    if (!c) return;

    ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

    for (let ty = 0; ty < MAP_SIZE; ty++) {
      for (let tx = 0; tx < MAP_SIZE; tx++) {
        const id = getCell(level, tx, ty);
        ctx.fillStyle = this.#sectorFill(level, id);
        ctx.fillRect(tx * c, ty * c, c, c);
      }
    }

    // Door / window / switch markers mid-tile
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = `${Math.max(4, Math.floor(c * 0.325))}px sans-serif`;
    for (let ty = 0; ty < MAP_SIZE; ty++) {
      for (let tx = 0; tx < MAP_SIZE; tx++) {
        const id = getCell(level, tx, ty);
        if (!id) continue;
        const s = level.sectors.get(id);
        let mark = null;
        if (isDoorSector(s) && !String(s.targetTag || '').trim()) {
          const cc = s.ceilingColor & 15;
          ctx.fillStyle = (cc === 2 || cc === 6 || cc === 7)
            ? colorHex(cc)
            : 'rgba(255,255,255,0.9)';
          mark = 'D';
        } else if (isWindowSector(s)) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          mark = 'W';
        } else if (isSwitchSector(s)) {
          ctx.fillStyle = 'rgba(255,255,255,0.9)';
          mark = 'S';
        }
        if (mark) ctx.fillText(mark, tx * c + c / 2, ty * c + c / 2);
      }
    }

    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= MAP_SIZE; i++) {
      ctx.moveTo(i * c + 0.5, 0);
      ctx.lineTo(i * c + 0.5, MAP_SIZE * c);
      ctx.moveTo(0, i * c + 0.5);
      ctx.lineTo(MAP_SIZE * c, i * c + 0.5);
    }
    ctx.stroke();

    // Lightly hatch all tiles in the selection's shared sector
    const sectorId = sharedSelectionSector(level, sel.tiles);
    if (sectorId) {
      ctx.fillStyle = whiteHatchPattern(ctx);
      for (const { tx, ty } of tilesInSector(level, sectorId)) {
        ctx.fillRect(tx * c, ty * c, c, c);
      }
    }

    // Selected tiles
    if (sel.tiles?.size) {
      ctx.fillStyle = 'rgba(255, 220, 80, 0.28)';
      ctx.strokeStyle = 'rgba(255, 220, 80, 0.95)';
      ctx.lineWidth = Math.max(1, Math.round(c / 9));
      for (const key of sel.tiles) {
        const [tx, ty] = key.split(',').map(Number);
        ctx.fillRect(tx * c, ty * c, c, c);
        ctx.strokeRect(tx * c + 1, ty * c + 1, c - 2, c - 2);
      }
    }

    // Target link arrows for a single selected tile
    if (sel.tiles?.size === 1) {
      const [selKey] = sel.tiles;
      const [stx, sty] = selKey.split(',').map(Number);
      drawTargetArrows(ctx, level, stx, sty, c);
    }

    // Marquee box
    if (sel.box) {
      const x0 = Math.min(sel.box.x0, sel.box.x1);
      const y0 = Math.min(sel.box.y0, sel.box.y1);
      const x1 = Math.max(sel.box.x0, sel.box.x1);
      const y1 = Math.max(sel.box.y0, sel.box.y1);
      const px = x0 * c;
      const py = y0 * c;
      const pw = (x1 - x0 + 1) * c;
      const ph = (y1 - y0 + 1) * c;
      ctx.fillStyle = 'rgba(120, 180, 255, 0.12)';
      ctx.fillRect(px, py, pw, ph);
      ctx.strokeStyle = 'rgba(120, 180, 255, 0.95)';
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 3]);
      ctx.strokeRect(px + 0.5, py + 0.5, pw - 1, ph - 1);
      ctx.setLineDash([]);
    }

    // Hover tile
    if (sel.hoverTile) {
      const { tx, ty } = sel.hoverTile;
      if (!sel.tiles?.has(tileKey(tx, ty))) {
        ctx.strokeStyle = 'rgba(255,255,255,0.45)';
        ctx.lineWidth = 1;
        ctx.strokeRect(tx * c + 0.5, ty * c + 0.5, c - 1, c - 1);
      }
    }

    const markers = level.spawn ? [level.spawn, ...level.items] : level.items;
    for (const it of markers) {
      const { ix, iy, spriteSize } = this.#itemDrawPos(it, c);
      const { drawW, drawH } = this.#spriteSize(it, spriteSize);
      const left = ix - drawW / 2;
      const top = iy - drawH / 2;
      const img = this.opts.images[it.type];
      if (img && img.complete) {
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, left, top, drawW, drawH);
      } else {
        ctx.fillStyle = '#fa0';
        ctx.fillRect(left, top, drawW, drawH);
      }
      // Facing tick for spawn / camera (matches preview: sin θ, −cos θ)
      if (it.type === 'spawn' || it.type === 'camera') {
        const ang = it.angle ?? 0;
        const len = Math.max(4, spriteSize * 0.55);
        ctx.strokeStyle = it.type === 'spawn' ? '#0f0' : '#4af';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ix, iy);
        ctx.lineTo(ix + Math.sin(ang) * len, iy - Math.cos(ang) * len);
        ctx.stroke();
      }
      if (sel.items?.has(it)) {
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.strokeRect(left - 1, top - 1, drawW + 2, drawH + 2);
      }
    }
  }
}

function mixHex(a, t) {
  const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(a);
  if (!m) return a;
  let r = parseInt(m[1], 16);
  let g = parseInt(m[2], 16);
  let b = parseInt(m[3], 16);
  const lift = Math.floor(40 * t);
  r = Math.min(255, r + lift);
  g = Math.min(255, g + lift);
  b = Math.min(255, b + lift);
  return `rgb(${r},${g},${b})`;
}

let _hatchPattern = null;

function whiteHatchPattern(ctx) {
  if (_hatchPattern) return _hatchPattern;
  const size = 6;
  const off = document.createElement('canvas');
  off.width = size;
  off.height = size;
  const o = off.getContext('2d');
  o.strokeStyle = 'rgba(255, 255, 255, 0.45)';
  o.lineWidth = 1;
  o.beginPath();
  o.moveTo(-1, size - 1);
  o.lineTo(size - 1, -1);
  o.moveTo(0, size + 1);
  o.lineTo(size + 1, 0);
  o.stroke();
  _hatchPattern = ctx.createPattern(off, 'repeat');
  return _hatchPattern;
}

/** Sector id shared by every selected tile, or 0 if empty/mixed/void. */
function sharedSelectionSector(level, tiles) {
  if (!tiles?.size) return 0;
  let sectorId = 0;
  let first = true;
  for (const key of tiles) {
    const [tx, ty] = key.split(',').map(Number);
    const id = getCell(level, tx, ty);
    if (first) {
      sectorId = id;
      first = false;
    } else if (id !== sectorId) {
      return 0;
    }
  }
  return sectorId;
}

/** Average tile coords of a sector (for arrow endpoints). */
function sectorCentroid(level, sectorId) {
  const tiles = tilesInSector(level, sectorId);
  if (!tiles.length) return null;
  let sx = 0;
  let sy = 0;
  for (const { tx, ty } of tiles) {
    sx += tx;
    sy += ty;
  }
  return { tx: sx / tiles.length, ty: sy / tiles.length };
}

/**
 * Draw arrows for sector targetTag links when a single tile is selected:
 * - outgoing: selected sector → its targetTag sector
 * - incoming: sectors that target this sector's tag → selected tile
 */
function drawTargetArrows(ctx, level, stx, sty, c) {
  const sectorId = getCell(level, stx, sty);
  if (!sectorId) return;
  const s = level.sectors.get(sectorId);
  if (!s) return;

  /** @type {{ from: {tx:number,ty:number}, to: {tx:number,ty:number} }[]} */
  const arrows = [];
  const selected = { tx: stx, ty: sty };

  const to = resolveTargetCentroid(level, s, sectorId);
  if (to) arrows.push({ from: selected, to });

  const tag = String(s.tag || '').trim();
  if (tag) {
    for (const [id, other] of level.sectors) {
      if (id === sectorId) continue;
      if (String(other.targetTag || '').trim() !== tag) continue;
      const from = sectorCentroid(level, id);
      if (from) arrows.push({ from, to: selected });
    }
  }

  for (const { from, to: dest } of arrows) {
    drawArrow(
      ctx,
      (from.tx + 0.5) * c,
      (from.ty + 0.5) * c,
      (dest.tx + 0.5) * c,
      (dest.ty + 0.5) * c,
    );
  }
}

/** Centroid of the sector named by s.targetTag, or null if unset/unresolved. */
function resolveTargetCentroid(level, s, fromSectorId) {
  const targetTag = String(s.targetTag || '').trim();
  if (!targetTag) return null;
  const tid = findSectorIdByTag(level, targetTag);
  if (!tid || tid === fromSectorId) return null;
  return sectorCentroid(level, tid);
}

function drawArrow(ctx, x0, y0, x1, y1) {
  const dx = x1 - x0;
  const dy = y1 - y0;
  const len = Math.hypot(dx, dy);
  if (len < 2) return;
  const ux = dx / len;
  const uy = dy / len;

  ctx.save();
  ctx.strokeStyle = 'rgba(80, 200, 255, 0.95)';
  ctx.fillStyle = 'rgba(80, 200, 255, 0.95)';
  ctx.lineWidth = 2;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.stroke();

  const ah = Math.max(6, Math.min(14, len * 0.22));
  const aw = ah * 0.55;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1 - ux * ah - uy * aw, y1 - uy * ah + ux * aw);
  ctx.lineTo(x1 - ux * ah + uy * aw, y1 - uy * ah - ux * aw);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}
