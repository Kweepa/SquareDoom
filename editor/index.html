/** Cache of images with pure black (#000) keyed to transparent. */
const transparentCache = new Map();

function transparentSprite(img) {
  if (!img?.complete || !img.naturalWidth) return null;
  let cached = transparentCache.get(img);
  if (cached) return cached;

  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = w;
  c.height = h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h);
  const px = data.data;
  for (let i = 0; i < px.length; i += 4) {
    if (px[i] === 0 && px[i + 1] === 0 && px[i + 2] === 0) px[i + 3] = 0;
  }
  ctx.putImageData(data, 0, 0);
  transparentCache.set(img, c);
  return c;
}
class PreviewView {
  /**
   * @param {HTMLCanvasElement} canvas Display canvas (scaled up from the render buffer).
   * @param {{
   *   getLevel: () => any,
   *   getCamera: () => {x:number,y:number,angle:number}|null,
   *   onRotate: (angle: number) => void,
   *   onMove: (x: number, y: number) => void,
   *   onEditEnd?: () => void,
   *   images: Record<string, HTMLImageElement>,
   *   getRaycasts?: () => number,
   *   getColumnHeight?: () => number,
   * }} opts
   */
  constructor(canvas, opts) {
    this.display = canvas;
    this.frame = canvas.parentElement;
    this.dctx = canvas.getContext('2d', { alpha: false });
    this.buffer = document.createElement('canvas');
    this.ctx = this.buffer.getContext('2d', { alpha: false });
    this.opts = opts;
    this.dragging = false;
    this.lastX = 0;
    this.lastY = 0;
    this.buffer.width = DEFAULT_RAYS * CELL_MAX;
    this.buffer.height = DEFAULT_COL_H * CELL_MAX;
    this.ctx.imageSmoothingEnabled = false;
    disableSmoothing(this.dctx);

    canvas.addEventListener('pointerdown', (e) => this.#onPointer(e));
    canvas.addEventListener('pointermove', (e) => this.#onPointer(e));
    canvas.addEventListener('pointerup', (e) => this.#onPointer(e));
    canvas.addEventListener('lostpointercapture', (e) => this.#onPointer(e));

    this._ro = new ResizeObserver(() => this.draw());
    if (this.frame) this._ro.observe(this.frame);
  }

  #onPointer(e) {
    const cam = this.opts.getCamera();
    if (!cam) return;

    if (e.type === 'pointerdown') {
      this.dragging = true;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      try {
        e.currentTarget.setPointerCapture(e.pointerId);
      } catch (_) { /* ignore */ }
      return;
    }

    if (e.type === 'pointerup' || e.type === 'lostpointercapture') {
      if (this.dragging) this.opts.onEditEnd?.();
      this.dragging = false;
      return;
    }

    if (e.type === 'pointermove' && this.dragging) {
      const dx = e.clientX - this.lastX;
      const dy = e.clientY - this.lastY;
      this.lastX = e.clientX;
      this.lastY = e.clientY;
      const rect = this.display.getBoundingClientRect();
      const w = rect.width || DEFAULT_RAYS;
      const h = rect.height || DEFAULT_COL_H;

      if (dx) {
        const turnSens = Math.PI / w;
        this.opts.onRotate(cam.angle + dx * turnSens);
      }
      if (dy) {
        // Drag up = forward. Facing matches ray dir: (sin θ, −cos θ).
        const walkSens = (WORLD_PER_TILE * 2) / h;
        const forward = -dy * walkSens;
        const nx = cam.x + Math.sin(cam.angle) * forward;
        const ny = cam.y - Math.cos(cam.angle) * forward;
        this.opts.onMove(nx, ny);
      }
      this.draw();
    }
  }

  draw() {
    const ctx = this.ctx;
    const level = this.opts.getLevel();
    const cam = this.opts.getCamera();
    const view = viewParams(
      this.opts.getRaycasts?.() ?? DEFAULT_RAYS,
      this.opts.getColumnHeight?.() ?? DEFAULT_COL_H,
    );
    const cell = cellSizeForView(view);
    view.cell = cell;
    const bw = view.w * cell;
    const bh = view.h * cell;

    if (this.buffer.width !== bw || this.buffer.height !== bh) {
      this.buffer.width = bw;
      this.buffer.height = bh;
    }
    disableSmoothing(ctx);

    const img = ctx.createImageData(bw, bh);
    const pix = img.data;
    // Black matches VIC background behind unset dither bits.
    pix.fill(0);
    for (let i = 3; i < pix.length; i += 4) pix[i] = 255;

    if (cam) {
      const ox = cam.x + 0.5;
      const oy = cam.y + 0.5;
      const eyeZ = getCameraEyeHeight(level, cam.x, cam.y);
      // Camera-plane rays (perspective): equal screen-X spacing, not equal angle.
      // dir = facing, plane = right * tan(FOV/2) — avoids fish-eye floor curves.
      const dirX = Math.sin(cam.angle);
      const dirY = -Math.cos(cam.angle);
      const planeX = Math.cos(cam.angle) * TAN_HALF_FOV;
      const planeY = Math.sin(cam.angle) * TAN_HALF_FOV;

      const switchFaces = buildSwitchFaceBindings(level);
      const switchImg = this.opts.images?.switch ?? null;
      const fb = { pix, stride: bw, cell };

      for (let col = 0; col < view.w; col++) {
        const cameraX = (2 * col + 1) / view.w - 1;
        const rayDirX = dirX + planeX * cameraX;
        const rayDirY = dirY + planeY * cameraX;
        castColumn(fb, level, ox, oy, eyeZ, rayDirX, rayDirY, col, view, switchFaces, switchImg);
      }

      ctx.putImageData(img, 0, 0);
      this.#drawItems(ctx, level, cam, ox, oy, eyeZ, view);
    } else {
      ctx.putImageData(img, 0, 0);
    }

    this.#present(view);
  }

  /** Nearest-neighbor blit buffer → display at frame size (no CSS stretch filtering). */
  #present(view) {
    const frame = this.frame || this.display;
    const rect = frame.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const outW = Math.max(1, Math.round(rect.width * dpr));
    const outH = Math.max(1, Math.round(rect.height * dpr));
    if (this.display.width !== outW || this.display.height !== outH) {
      this.display.width = outW;
      this.display.height = outH;
    }
    const dctx = this.dctx;
    disableSmoothing(dctx);
    dctx.fillStyle = '#000';
    dctx.fillRect(0, 0, outW, outH);
    dctx.drawImage(
      this.buffer,
      0,
      0,
      view.w * view.cell,
      view.h * view.cell,
      0,
      0,
      outW,
      outH,
    );
  }

  #drawItems(ctx, level, cam, ox, oy, eyeZ, view) {
    const sin = Math.sin(cam.angle);
    const cos = Math.cos(cam.angle);
    const sprites = [];
    const cell = view.cell;

    for (const it of level.items) {
      if (isCamera(it) || isSwitch(it)) continue; // wall-face in castColumn
      const ix = it.x + 0.5;
      const iy = it.y + 0.5;
      const dx = ix - ox;
      const dy = iy - oy;
      const depth = dx * sin - dy * cos;
      if (depth < 0.8) continue;
      const lateral = dx * cos + dy * sin;
      sprites.push({ it, depth, lateral });
    }

    sprites.sort((a, b) => b.depth - a.depth);

    for (const { it, depth, lateral } of sprites) {
      const sector = getSectorAtWorld(level, it.x, it.y);
      const floorZ = sector?.floorHeight ?? 0;
      const screenX = view.w / 2 + (lateral / depth) * (view.w / 2) / TAN_HALF_FOV;
      const screenFloorY = view.horizon + ((eyeZ - floorZ) * view.proj) / depth;
      const sizeScale = ENEMY_TYPES.has(it.type) ? 1 : 0.5;
      const spriteH = Math.max(1, (ITEM_WORLD_HEIGHT * view.proj * sizeScale) / depth);
      const img = this.opts.images[it.type];
      const sprite = transparentSprite(img);
      let spriteW = spriteH * 0.75;
      if (sprite) {
        spriteW = spriteH * (sprite.width / sprite.height);
      }
      const left = Math.round(screenX - spriteW / 2) * cell;
      const top = Math.round(screenFloorY - spriteH) * cell;
      const w = Math.max(cell, Math.round(spriteW) * cell);
      const h = Math.max(cell, Math.round(spriteH) * cell);

      if (left + w < 0 || left > view.w * cell || top + h < 0 || top > view.h * cell) continue;

      if (sprite) {
        disableSmoothing(ctx);
        ctx.drawImage(sprite, left, top, w, h);
      } else {
        ctx.fillStyle = '#c84';
        ctx.fillRect(left, top, w, h);
      }
    }
  }
}

function viewParams(raycasts, columnHeight) {
  const w = Math.max(8, Math.min(320, Math.round(Number(raycasts) || DEFAULT_RAYS)));
  const h = Math.max(8, Math.min(240, Math.round(Number(columnHeight) || DEFAULT_COL_H)));
  return {
    w,
    h,
    horizon: h / 2,
    proj: h * PROJ_SCALE,
    cell: CELL_MAX,
  };
}

function cellSizeForView(view) {
  const cells = view.w * view.h;
  for (let cell = CELL_MAX; cell >= 1; cell >>= 1) {
    if (cells * cell * cell <= DITHER_PIX_BUDGET * 2) return cell;
  }
  return 1;
}

function disableSmoothing(ctx) {
  ctx.imageSmoothingEnabled = false;
  ctx.mozImageSmoothingEnabled = false;
  ctx.webkitImageSmoothingEnabled = false;
  ctx.msImageSmoothingEnabled = false;
}

function sectorAtTile(level, tx, ty) {
  const id = getCell(level, tx, ty);
  if (!id || !level.sectors.has(id)) return null;
  return { id, sector: level.sectors.get(id) };
}

function glyphLitFraction(glyph) {
  let n = 0;
  for (const byte of glyph) {
    for (let i = 0; i < 8; i++) n += (byte >> i) & 1;
  }
  return n / 64;
}

/** Match util.asm bright_to_wdark: 0..15 → 15..0; 16 → full-bright sentinel. */
function brightToWdark(brightness) {
  const b = brightness | 0;
  if (b >= 16) return -1;
  return 15 - Math.max(0, Math.min(15, b));
}

/**
 * Wall pattern index — SEC_WDARK[cur] + min(15, wallz_h), clamped.
 * wallz_h ≈ perpendicular tile depth (fish-scaled mid-product hi).
 */
function wallPatIndex(brightness, perpTiles) {
  const wdark = brightToWdark(brightness);
  if (wdark < 0) return 0;
  const z = Math.min(15, Math.max(0, Math.floor(Math.abs(perpTiles))));
  return Math.min(15, wdark + z);
}

/** Floor/ceil pattern — brightness only (no distance), util.asm bright_to_fpat. */
function floorPatIndex(brightness) {
  const wdark = brightToWdark(brightness);
  return wdark < 0 ? 0 : wdark;
}

function parseHex(hex) {
  const h = hex[0] === '#' ? hex.slice(1) : hex;
  if (h.length === 3) {
    return [
      parseInt(h[0] + h[0], 16),
      parseInt(h[1] + h[1], 16),
      parseInt(h[2] + h[2], 16),
    ];
  }
  return [
    parseInt(h.slice(0, 2), 16),
    parseInt(h.slice(2, 4), 16),
    parseInt(h.slice(4, 6), 16),
  ];
}

function fillDitherSpan(fb, col, y0, y1, hex, glyph, litFrac) {
  if (y1 <= y0) return;
  const { pix, stride, cell } = fb;
  const rgb = parseHex(hex);
  if (cell <= 1) {
    const r = Math.round(rgb[0] * litFrac);
    const g = Math.round(rgb[1] * litFrac);
    const b = Math.round(rgb[2] * litFrac);
    for (let y = y0; y < y1; y++) {
      const i = (y * stride + col) * 4;
      pix[i] = r;
      pix[i + 1] = g;
      pix[i + 2] = b;
      pix[i + 3] = 255;
    }
    return;
  }

  const step = CELL_MAX / cell;
  const x0 = col * cell;
  for (let y = y0; y < y1; y++) {
    const y0p = y * cell;
    for (let py = 0; py < cell; py++) {
      const bits = glyph[(py * step) | 0];
      const row = (y0p + py) * stride + x0;
      for (let px = 0; px < cell; px++) {
        const lit = (bits >> (7 - ((px * step) | 0))) & 1;
        const i = (row + px) * 4;
        if (lit) {
          pix[i] = rgb[0];
          pix[i + 1] = rgb[1];
          pix[i + 2] = rgb[2];
        } else {
          pix[i] = 0;
          pix[i + 1] = 0;
          pix[i + 2] = 0;
        }
        pix[i + 3] = 255;
      }
    }
  }
}

function fillSolidSpan(fb, col, y0, y1, hexOrRgb) {
  if (y1 <= y0) return;
  const { pix, stride, cell } = fb;
  const rgb = Array.isArray(hexOrRgb) ? hexOrRgb : parseHex(hexOrRgb);
  if (cell <= 1) {
    for (let y = y0; y < y1; y++) {
      const i = (y * stride + col) * 4;
      pix[i] = rgb[0];
      pix[i + 1] = rgb[1];
      pix[i + 2] = rgb[2];
      pix[i + 3] = 255;
    }
    return;
  }
  const x0 = col * cell;
  for (let y = y0; y < y1; y++) {
    const y0p = y * cell;
    for (let py = 0; py < cell; py++) {
      const row = (y0p + py) * stride + x0;
      for (let px = 0; px < cell; px++) {
        const i = (row + px) * 4;
        pix[i] = rgb[0];
        pix[i + 1] = rgb[1];
        pix[i + 2] = rgb[2];
        pix[i + 3] = 255;
      }
    }
  }
}

function fillWallSpan(fb, col, y0, y1, hex, pat) {
  const p = pat & 15;
  fillDitherSpan(fb, col, y0, y1, hex, WALL_GLYPHS[p], WALL_LIT[p]);
}

function fillFloorSpan(fb, col, y0, y1, hex, pat) {
  const p = pat & 15;
  fillDitherSpan(fb, col, y0, y1, hex, FLOOR_GLYPHS[p], FLOOR_LIT[p]);
}

/**
 * Multi-sector column cast: at each portal, paint near-sector floor/ceiling
 * into the open clip, draw upper/lower walls if heights change, then narrow
 * the clip. Farther sectors only paint into what's still open.
 */
function castColumn(fb, level, ox, oy, eyeZ, rayDirX, rayDirY, col, view, switchFaces, switchImg) {
  const posX = ox / WORLD_PER_TILE;
  const posY = oy / WORLD_PER_TILE;

  let mapX = Math.floor(posX);
  let mapY = Math.floor(posY);

  const deltaDistX = Math.abs(rayDirX) < 1e-8 ? 1e30 : Math.abs(1 / rayDirX);
  const deltaDistY = Math.abs(rayDirY) < 1e-8 ? 1e30 : Math.abs(1 / rayDirY);

  let stepX;
  let stepY;
  let sideDistX;
  let sideDistY;

  if (rayDirX < 0) {
    stepX = -1;
    sideDistX = (posX - mapX) * deltaDistX;
  } else {
    stepX = 1;
    sideDistX = (mapX + 1 - posX) * deltaDistX;
  }
  if (rayDirY < 0) {
    stepY = -1;
    sideDistY = (posY - mapY) * deltaDistY;
  } else {
    stepY = 1;
    sideDistY = (mapY + 1 - posY) * deltaDistY;
  }

  let yTop = 0;
  let yBot = view.h;
  let cur = sectorAtTile(level, mapX, mapY);
  let side = 0;

  for (let step = 0; step < MAX_DEPTH && yTop < yBot; step++) {
    if (sideDistX < sideDistY) {
      sideDistX += deltaDistX;
      mapX += stepX;
      side = 0;
    } else {
      sideDistY += deltaDistY;
      mapY += stepY;
      side = 1;
    }

    // Perpendicular distance in tiles (Lodev) — already fish-eye free
    let perpTiles;
    if (side === 0) {
      perpTiles = (mapX - posX + (1 - stepX) / 2) / rayDirX;
    } else {
      perpTiles = (mapY - posY + (1 - stepY) / 2) / rayDirY;
    }
    const perpDist = Math.max(0.05, Math.abs(perpTiles)) * WORLD_PER_TILE;
    const wallU = faceU(posX, posY, perpTiles, rayDirX, rayDirY, side, mapX, mapY, stepX, stepY);
    const outOfBounds = mapX < 0 || mapY < 0 || mapX >= MAP_SIZE || mapY >= MAP_SIZE;
    const next = outOfBounds ? null : sectorAtTile(level, mapX, mapY);

    // Same sector — keep walking
    if (cur && next && cur.id === next.id) continue;

    // Entering geometry from void
    if (!cur && next) {
      cur = next;
      continue;
    }

    const nearFloor = cur?.sector.floorHeight ?? 0;
    const nearCeil = cur?.sector.ceilingHeight ?? 31;
    const nearCeilY = projectY(nearCeil, eyeZ, perpDist, view);
    const nearFloorY = projectY(nearFloor, eyeZ, perpDist, view);
    const nearBright = cur?.sector.brightness ?? 15;
    const fpat = floorPatIndex(nearBright);
    // Wall dither from near sector + tile depth (≈ wallz_h).
    const wpat = wallPatIndex(nearBright, perpTiles);

    // Near-sector ceiling strip above the portal (front-to-back; only open clip).
    // When nearCeilY clamps to yBot, still fill and close — leaves no false
    // opening for a solid wall (C64 paint_near must match).
    if (cur) {
      const ceilEnd = clampSpan(yTop, yBot, nearCeilY);
      if (ceilEnd > yTop) {
        const ccol = cur.sector.ceilingColor & 15;
        if (ccol === SKY_COLOR) {
          // Sky: brightest floor UDG (game sky_put); solid cyan stand-in for sky strip.
          fillFloorSpan(fb, col, yTop, ceilEnd, colorHex(SKY_COLOR), 0);
        } else {
          fillFloorSpan(fb, col, yTop, ceilEnd, colorHex(ccol), fpat);
        }
        yTop = ceilEnd;
      }
    }

    // Near-sector floor strip below the portal (only when floor is at/below
    // the horizon — floors above the eye must not yank yBot into the sky).
    if (cur && nearFloorY >= view.horizon) {
      const floorStart = clampSpan(yTop, yBot, nearFloorY);
      if (floorStart < yBot) {
        fillFloorSpan(fb, col, floorStart, yBot, colorHex(cur.sector.floorColor), fpat);
        yBot = floorStart;
      }
    }

    if (yTop >= yBot) break;

    // Solid wall — fill remaining portal and stop (nothing farther may draw)
    if (!next) {
      if (yBot > yTop) {
        const grey = wallColor(side);
        const hitFace = hitFaceNESW(side, stepX, stepY);
        const isSw = isCookedSwitchFace(level, switchFaces, mapX, mapY, hitFace);
        if (isSw && switchImg) {
          paintSwitchColumn(fb, col, yTop, yBot, wallU, switchImg, grey, wpat, nearCeilY, nearFloorY);
        } else {
          fillWallSpan(fb, col, yTop, yBot, grey, wpat);
        }
      }
      break;
    }

    // Upper ledge: door → ceil colour on outer 1/8ths only. Else N/S–E/W grey.
    // Lower ledge: elevator → floor colour. Else grey.
    const grey = wallColor(side);
    const farFloor = next.sector.floorHeight;
    const farCeil = next.sector.ceilingHeight;
    const farCeilY = projectY(farCeil, eyeZ, perpDist, view);
    const farFloorY = projectY(farFloor, eyeZ, perpDist, view);

    // Upper wall
    if (farCeil < nearCeil) {
      const wallTop = clampSpan(yTop, yBot, nearCeilY);
      const wallBot = clampSpan(yTop, yBot, farCeilY);
      if (wallBot > wallTop) {
        // Door: left/right = ceil colour, centre = floor colour (secret doors)
        if (isDoorSector(next.sector)) {
          const jamb = wallU < 1 / 8 || wallU >= 7 / 8;
          const colIdx = jamb ? next.sector.ceilingColor : next.sector.floorColor;
          if ((colIdx & 15) === SKY_COLOR) {
            fillFloorSpan(fb, col, wallTop, wallBot, colorHex(SKY_COLOR), 0);
          } else {
            fillWallSpan(fb, col, wallTop, wallBot, colorHex(colIdx), wpat);
          }
        } else {
          fillWallSpan(fb, col, wallTop, wallBot, grey, wpat);
        }
      }
      yTop = Math.max(yTop, wallBot);
    }

    if (yTop >= yBot) break;

    // Lower wall
    if (farFloor > nearFloor) {
      const wallTop = clampSpan(yTop, yBot, farFloorY);
      const wallBot = clampSpan(yTop, yBot, nearFloorY);
      if (wallBot > wallTop) {
        const hex = isElevatorSector(next.sector)
          ? colorHex(next.sector.floorColor)
          : grey;
        fillWallSpan(fb, col, wallTop, wallBot, hex, wpat);
      }
      // Portal opening is [yTop, farFloorY) even when the raised floor
      // projects above the horizon (looking up stairs).
      yBot = Math.min(yBot, wallTop);
    }

    if (yTop >= yBot) break;

    cur = next;
  }
}

/**
 * Face U in 0..1 = fractional coord of the grid crossing on the non-hit axis.
 * side 0 (vertical gridline): frac(hitY); side 1: frac(hitX).
 */
function faceU(posX, posY, perpTiles, rayDirX, rayDirY, side, mapX, mapY, stepX, stepY) {
  let u;
  if (side === 0) {
    const gridX = stepX > 0 ? mapX : mapX + 1;
    const t = (gridX - posX) / rayDirX;
    u = posY + t * rayDirY;
  } else {
    const gridY = stepY > 0 ? mapY : mapY + 1;
    const t = (gridY - posY) / rayDirY;
    u = posX + t * rayDirX;
  }
  u -= Math.floor(u);
  if (side === 0 && rayDirX > 0) u = 1 - u;
  if (side === 1 && rayDirY < 0) u = 1 - u;
  if (u < 0) u = 0;
  if (u >= 1) u = 0.999;
  return u;
}

/** NESW face of solid cell that was hit: 0=N 1=E 2=S 3=W. */
function hitFaceNESW(side, stepX, stepY) {
  if (side === 0) return stepX < 0 ? 1 : 3; // E if stepping −X, else W
  return stepY < 0 ? 2 : 0; // S if stepping −Y, else N
}

/** Match cooked {sec,dir} against solid cell + hit face (asm switch_face_match). */
function isCookedSwitchFace(level, faces, mapX, mapY, hitFace) {
  const nd = [
    { dx: 0, dy: -1 },
    { dx: 1, dy: 0 },
    { dx: 0, dy: 1 },
    { dx: -1, dy: 0 },
  ][hitFace];
  const sec = getCell(level, mapX + nd.dx, mapY + nd.dy);
  return faces.some((f) => f.sec === sec && f.dir === hitFace);
}

/** Sample 16×16 switch over unclamped wall [wallTopY, wallBotY); V=0 at floor. */
function paintSwitchColumn(fb, col, yTop, yBot, wallU, img, grey, wpat, wallTopY, wallBotY) {
  if (yBot <= yTop) return;
  const wallH = wallBotY - wallTopY;
  if (wallH <= 0) return;
  const pix = switchPixels(img);
  const u = Math.min(15, Math.floor(wallU * 16));
  for (let y = yTop; y < yBot; y++) {
    const fromBottom = wallBotY - 1 - y;
    let v = Math.floor((fromBottom * 16) / wallH);
    if (v < 0) v = 0;
    if (v > 15) v = 15;
    const rgba = pix ? pix[(15 - v) * 16 + u] : null;
    // Clear = alpha or magenta key (matches gen_wall_switch.js); black is opaque
    const clear =
      !rgba ||
      rgba[3] < 128 ||
      (rgba[0] === 255 && rgba[1] === 0 && rgba[2] === 255);
    if (!clear) {
      fillSolidSpan(fb, col, y, y + 1, rgba);
    } else {
      fillWallSpan(fb, col, y, y + 1, grey, wpat);
    }
  }
}

const switchPixCache = new WeakMap();

function switchPixels(img) {
  if (!img?.complete || !img.naturalWidth) return null;
  let cached = switchPixCache.get(img);
  if (cached) return cached;
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const c = document.createElement('canvas');
  c.width = 16;
  c.height = 16;
  const cctx = c.getContext('2d');
  cctx.imageSmoothingEnabled = false;
  cctx.drawImage(img, 0, 0, w, h, 0, 0, 16, 16);
  const data = cctx.getImageData(0, 0, 16, 16).data;
  const pix = new Array(256);
  for (let i = 0; i < 256; i++) {
    const o = i * 4;
    pix[i] = [data[o], data[o + 1], data[o + 2], data[o + 3]];
  }
  switchPixCache.set(img, pix);
  return pix;
}

function clampSpan(yTop, yBot, y) {
  return Math.max(yTop, Math.min(yBot, Math.round(y)));
}

function projectY(height, eyeZ, perpDist, view) {
  return Math.round(view.horizon - ((height - eyeZ) * view.proj) / Math.max(0.5, perpDist));
}

function wallColor(side) {
  return C64_HEX[side === 0 ? WALL_NS : WALL_EW];
}

// ---- js/tileEditor.js ----
function numInput(id, label, min, max, value, mixed) {
  const wrap = document.createElement('label');
  wrap.className = 'field';
  wrap.htmlFor = id;
  const span = document.createElement('span');
  span.textContent = label;
  const input = document.createElement('input');
  input.type = 'number';
  input.id = id;
  input.min = String(min);
  input.max = String(max);
  if (mixed) {
    input.placeholder = 'mixed';
    input.value = '';
  } else {
    input.value = String(value);
  }
  wrap.append(span, input);
  return { wrap, input };
}

function textInput(id, label, value, mixed) {
  const wrap = document.createElement('label');
  wrap.className = 'field';
  wrap.htmlFor = id;
  const span = document.createElement('span');
  span.textContent = label;
  const input = document.createElement('input');
  input.type = 'text';
  input.id = id;
  input.autocomplete = 'off';
  input.spellcheck = false;
  if (mixed) {
    input.placeholder = 'mixed';
    input.value = '';
  } else {
    input.value = value ?? '';
  }
  wrap.append(span, input);
  return { wrap, input };
}

function colorPicker(id, label, value, mixed) {
  const wrap = document.createElement('div');
  wrap.className = 'field color-field';
  const span = document.createElement('span');
  span.textContent = label + (mixed ? ' (mixed)' : '');
  const row = document.createElement('div');
  row.className = 'color-swatches';
  /** @type {HTMLButtonElement[]} */
  const buttons = [];
  for (let i = 0; i < 16; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'swatch' + (!mixed && i === value ? ' selected' : '');
    btn.title = `${i}: ${C64_NAMES[i]}`;
    btn.dataset.color = String(i);
    btn.style.background = C64_HEX[i];
    buttons.push(btn);
    row.appendChild(btn);
  }
  wrap.append(span, row);
  return { wrap, buttons };
}

function summarizeProps(propList) {
  if (!propList.length) return null;
  const keys = [
    'floorHeight', 'ceilingHeight', 'trigger', 'singleShot', 'action',
    'tag', 'targetTag', 'brightness', 'floorColor', 'ceilingColor',
  ];
  const out = { ...propList[0], _mixed: {} };
  for (const key of keys) {
    const first = propList[0][key];
    out._mixed[key] = propList.some((p) => p[key] !== first);
  }
  return out;
}

class TileEditor {
  /**
   * @param {HTMLElement} root
   * @param {{
   *   getTiles: () => Array<{tx:number,ty:number}>,
   *   getProps: () => Array<object>,
   *   sectorCount: () => number,
   *   itemCount: () => number,
   *   enemyCount: () => number,
   *   secretCount: () => number,
   *   hasItemSelection: () => boolean,
   *   getLevelName: () => string,
   *   onLevelNameChange: (name: string) => void,
   *   getParTime: () => number,
   *   onParTimeChange: (sec: number) => void,
   *   onChange: (patch: object) => void,
   *   onClear: () => void,
   *   onSelectSector: () => void,
   *   onMakeMonsterCloset: () => void,
   * }} opts
   */
  constructor(root, opts) {
    this.root = root;
    this.opts = opts;
    this.render();
  }

  render() {
    const tiles = this.opts.getTiles();
    const propsList = this.opts.getProps();
    this.root.innerHTML = '';
    this.root.classList.add('panel', 'tile-editor');

    const h = document.createElement('h2');
    h.textContent = 'Tile';
    this.root.appendChild(h);

    const countLine = document.createElement('p');
    countLine.className = 'muted';
    countLine.textContent =
      `Sectors: ${this.opts.sectorCount()} · Items: ${this.opts.itemCount()}/${MAX_PLACEABLE_ITEMS}` +
      ` · Enemies: ${this.opts.enemyCount()}/${MAX_ENEMIES}` +
      ` · Secrets: ${this.opts.secretCount()}`;
    this.root.appendChild(countLine);

    if (!tiles.length) {
      if (!this.opts.hasItemSelection()) {
        this.#levelNameFields();
      }
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'Select tiles on the map. Shift+click empty to add; Shift+Alt overwrites.';
      this.root.appendChild(p);
      return;
    }

    const occupied = propsList.length;
    const selLine = document.createElement('p');
    selLine.className = 'muted';
    selLine.textContent = occupied
      ? `${tiles.length} tile${tiles.length === 1 ? '' : 's'} selected`
      : `${tiles.length} empty tile${tiles.length === 1 ? '' : 's'} selected`;
    this.root.appendChild(selLine);

    if (occupied) {
      const ids = [...new Set(propsList.map((p) => p.id).filter((id) => id > 0))];
      const idLine = document.createElement('p');
      idLine.className = 'muted';
      if (ids.length === 1) {
        idLine.textContent = `Sector id: ${ids[0]}`;
      } else if (ids.length > 1) {
        idLine.textContent = `Sector ids: mixed (${ids.slice().sort((a, b) => a - b).join(', ')})`;
      }
      if (ids.length) this.root.appendChild(idLine);
    }

    if (!occupied) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent =
        'No properties — Shift+click empty to paint, Shift+Alt to overwrite, or select occupied tiles.';
      this.root.appendChild(p);
      this.#actions();
      return;
    }

    const s = summarizeProps(propsList);
    const allSame = propsList.every((p) => sectorsEqual(p, propsList[0]));
    if (!allSame) {
      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'Mixed values — edits apply to all selected tiles.';
      this.root.appendChild(note);
    }

    const floor = numInput('te-floor', 'Floor height', 0, 31, s.floorHeight, s._mixed.floorHeight);
    const ceil = numInput('te-ceil', 'Ceiling height', 0, 31, s.ceilingHeight, s._mixed.ceilingHeight);
    const bright = numInput('te-bright', 'Brightness', 0, 16, s.brightness, s._mixed.brightness);

    const mkSelect = (id, label, mixed, options, value, onChange) => {
      const wrap = document.createElement('label');
      wrap.className = 'field';
      wrap.htmlFor = id;
      const span = document.createElement('span');
      span.textContent = mixed ? `${label} (mixed)` : label;
      const sel = document.createElement('select');
      sel.id = id;
      for (const o of options) {
        const opt = document.createElement('option');
        opt.value = o.id;
        opt.textContent = o.name;
        sel.appendChild(opt);
      }
      if (!mixed) sel.value = value;
      else {
        const ph = document.createElement('option');
        ph.value = '';
        ph.textContent = 'mixed';
        ph.disabled = true;
        ph.selected = true;
        sel.prepend(ph);
      }
      sel.addEventListener('change', () => {
        if (sel.value === '') return;
        onChange(sel.value);
      });
      wrap.append(span, sel);
      return wrap;
    };

    const trigWrap = mkSelect(
      'te-trigger',
      'Trigger',
      s._mixed.trigger,
      TRIGGERS,
      normalizeTrigger(s.trigger),
      (v) => this.opts.onChange({ trigger: v }),
    );
    const actWrap = mkSelect(
      'te-action',
      'Action',
      s._mixed.action,
      ACTIONS,
      normalizeAction(s.action),
      (v) => this.opts.onChange({ action: v }),
    );

    const shotWrap = document.createElement('label');
    shotWrap.className = 'field';
    const shotCb = document.createElement('input');
    shotCb.type = 'checkbox';
    shotCb.id = 'te-oneshot';
    if (s._mixed.singleShot) {
      shotCb.indeterminate = true;
    } else {
      shotCb.checked = !!s.singleShot;
    }
    shotCb.addEventListener('change', () => {
      this.opts.onChange({ singleShot: shotCb.checked });
    });
    shotWrap.append(shotCb, document.createTextNode(
      s._mixed.singleShot ? ' Single-shot (mixed)' : ' Single-shot',
    ));

    const tag = textInput('te-tag', 'Sector tag', s.tag || '', s._mixed.tag);
    tag.input.addEventListener('change', () => {
      this.opts.onChange({ tag: tag.input.value });
    });

    const floorCol = colorPicker('te-fcol', 'Floor colour', s.floorColor, s._mixed.floorColor);
    const ceilCol = colorPicker('te-ccol', 'Ceiling colour', s.ceilingColor, s._mixed.ceilingColor);

    const bindNum = (input, key) => {
      input.addEventListener('change', () => {
        if (input.value === '') return;
        this.opts.onChange({ [key]: Number(input.value) });
      });
    };
    bindNum(floor.input, 'floorHeight');
    bindNum(ceil.input, 'ceilingHeight');
    bindNum(bright.input, 'brightness');

    for (const btn of floorCol.buttons) {
      btn.addEventListener('click', () => this.opts.onChange({ floorColor: Number(btn.dataset.color) }));
    }
    for (const btn of ceilCol.buttons) {
      btn.addEventListener('click', () => this.opts.onChange({ ceilingColor: Number(btn.dataset.color) }));
    }

    this.root.append(floor.wrap, ceil.wrap, bright.wrap, trigWrap, actWrap, shotWrap);

    const target = textInput(
      'te-target',
      s._mixed.targetTag ? 'Target tag (mixed)' : 'Target tag',
      s.targetTag || '',
      s._mixed.targetTag,
    );
    target.input.placeholder = s._mixed.targetTag ? 'mixed' : 'tag of target sector (optional)';
    target.input.addEventListener('change', () => {
      this.opts.onChange({ targetTag: target.input.value });
    });
    this.root.appendChild(target.wrap);

    this.root.append(tag.wrap, floorCol.wrap, ceilCol.wrap);
    this.#actions();
  }

  #levelNameFields() {
    const sub = document.createElement('h2');
    sub.textContent = 'Level';
    this.root.appendChild(sub);

    const field = textInput('te-level-name', 'Name', this.opts.getLevelName() || '', false);
    field.input.maxLength = LEVEL_NAME_LEN;
    field.input.placeholder = 'Level name';
    const commitName = () => {
      this.opts.onLevelNameChange(field.input.value);
    };
    field.input.addEventListener('change', commitName);
    field.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        field.input.blur();
      }
    });
    this.root.appendChild(field.wrap);

    const par = numInput('te-par-time', 'Par (sec)', 0, 255, this.opts.getParTime(), false);
    const commitPar = () => {
      if (par.input.value === '') return;
      this.opts.onParTimeChange(Number(par.input.value));
    };
    par.input.addEventListener('change', commitPar);
    par.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        par.input.blur();
      }
    });
    this.root.appendChild(par.wrap);
  }

  #actions() {
    const actions = document.createElement('div');
    actions.className = 'btn-row';

    const selectSector = document.createElement('button');
    selectSector.type = 'button';
    selectSector.textContent = 'Select sector';
    selectSector.title = 'Select all tiles in the sector of the primary selected tile';
    selectSector.addEventListener('click', () => this.opts.onSelectSector());
    actions.appendChild(selectSector);

    const closet = document.createElement('button');
    closet.type = 'button';
    closet.textContent = 'Make monster closet';
    closet.title = 'Set floor to neighbour−6 and ceiling to floor+5 (mapper wires trigger/tag)';
    closet.disabled = this.opts.getTiles().length === 0;
    closet.addEventListener('click', () => this.opts.onMakeMonsterCloset());
    actions.appendChild(closet);

    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'danger';
    clear.textContent = 'Clear tiles';
    clear.addEventListener('click', () => this.opts.onClear());
    actions.appendChild(clear);

    this.root.appendChild(actions);
  }
}

// ---- js/itemEditor.js ----
class ItemEditor {
  /**
   * @param {HTMLElement} root
   * @param {{
   *   getItems: () => any[],
   *   onChange: (patch: object) => void,
   *   onDelete: () => void,
   * }} opts
   */
  constructor(root, opts) {
    this.root = root;
    this.opts = opts;
    this.render();
  }

  render() {
    const items = this.opts.getItems();
    this.root.innerHTML = '';
    this.root.classList.add('panel', 'item-editor');

    const h = document.createElement('h2');
    h.textContent = 'Item';
    this.root.appendChild(h);

    if (!items.length) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'Select items on the map.';
      this.root.appendChild(p);
      return;
    }

    const item = items[0];
    const multi = items.length > 1;
    const onlySpawn = items.length === 1 && isSpawn(item);

    const selLine = document.createElement('p');
    selLine.className = 'muted';
    if (onlySpawn) {
      selLine.textContent = 'Player spawn — preview shows this viewpoint.';
    } else if (multi) {
      selLine.textContent = `${items.length} items selected — edits apply to all`;
    } else if (isCamera(item)) {
      selLine.textContent = 'Editor only — not included in cooked binary.';
    } else {
      selLine.textContent = item.type;
    }
    this.root.appendChild(selLine);

    if (!onlySpawn) {
      const typesSame = items.every((it) => it.type === item.type);
      const typeLab = document.createElement('label');
      typeLab.className = 'field';
      typeLab.innerHTML = '<span>Type</span>';
      const typeSel = document.createElement('select');
      if (!typesSame) {
        const mixed = document.createElement('option');
        mixed.value = '';
        mixed.textContent = '(mixed)';
        mixed.selected = true;
        typeSel.appendChild(mixed);
      }
      // Spawn is level.spawn only — not a convertible item type.
      // Switch is a sector trigger, not a placeable prop.
      const types = ITEM_TYPES.filter(
        (t) => t !== SPAWN_TYPE && !isSwitchCookType(t) && !RUNTIME_ONLY_TYPES.has(t),
      ).concat(CAMERA_TYPE);
      for (const t of types) {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        if (typesSame && t === item.type) {
          opt.selected = true;
        }
        typeSel.appendChild(opt);
      }
      typeSel.addEventListener('change', () => {
        if (!typeSel.value) return;
        this.opts.onChange({ type: typeSel.value });
      });
      typeLab.appendChild(typeSel);
      this.root.appendChild(typeLab);
    }

    const xSame = items.every((it) => it.x === item.x);
    const ySame = items.every((it) => it.y === item.y);
    this.#numField('X', 'x', 0, WORLD_MAX, xSame ? item.x : null);
    this.#numField('Y', 'y', 0, WORLD_MAX, ySame ? item.y : null);

    const allViewpoints = items.every((it) => isCamera(it) || isSpawn(it));
    const noViewpoints = items.every((it) => !isCamera(it) && !isSpawn(it));

    if (allViewpoints) {
      const deg = Math.round(((item.angle ?? 0) * 180) / Math.PI);
      const angleSame = items.every(
        (it) => Math.round(((it.angle ?? 0) * 180) / Math.PI) === deg,
      );
      const angleLab = document.createElement('label');
      angleLab.className = 'field';
      const span = document.createElement('span');
      span.textContent = 'Angle (deg)';
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0';
      input.max = '360';
      input.step = '1';
      if (angleSame) input.value = String(deg);
      else {
        input.placeholder = 'mixed';
        input.value = '';
      }
      input.addEventListener('change', () => {
        if (input.value === '') return;
        const clamped = Math.max(0, Math.min(360, Number(input.value) || 0));
        this.opts.onChange({ angle: normalizeAngle((clamped * Math.PI) / 180) });
      });
      angleLab.append(span, input);
      this.root.appendChild(angleLab);
    } else if (!allSwitches && noViewpoints) {
      const skills = document.createElement('div');
      skills.className = 'field skills';
      const skillLabel = document.createElement('span');
      skillLabel.textContent = 'Skill';
      skills.appendChild(skillLabel);
      const row = document.createElement('div');
      row.className = 'skill-row';
      for (const key of ['easy', 'normal', 'hard']) {
        const allOn = items.every((it) => it.skills?.[key]);
        const allOff = items.every((it) => !it.skills?.[key]);
        const lab = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = allOn;
        cb.indeterminate = !allOn && !allOff;
        cb.addEventListener('change', () => {
          this.opts.onChange({ skillKey: key, skillValue: cb.checked });
        });
        lab.append(cb, document.createTextNode(key));
        row.appendChild(lab);
      }
      skills.appendChild(row);
      this.root.appendChild(skills);
    }

    if (!onlySpawn) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'danger';
      del.textContent = multi ? 'Delete items' : 'Delete item';
      del.addEventListener('click', () => this.opts.onDelete());
      this.root.appendChild(del);
    }
  }

  #numField(label, key, min, max, value) {
    const lab = document.createElement('label');
    lab.className = 'field';
    const span = document.createElement('span');
    span.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.min = String(min);
    input.max = String(max);
    if (value == null) {
      input.placeholder = 'mixed';
      input.value = '';
    } else {
      input.value = String(value);
    }
    input.addEventListener('change', () => {
      if (input.value === '') return;
      this.opts.onChange({ [key]: Number(input.value) });
    });
    lab.append(span, input);
    this.root.appendChild(lab);
  }
}

// ---- js/itemPalette.js ----
class ItemPalette {
  /**
   * @param {HTMLElement} root
   * @param {Record<string, HTMLImageElement>} images
   */
  constructor(root, images) {
    this.root = root;
    root.classList.add('item-palette');
    root.innerHTML = '';

    for (const type of EDITOR_ITEM_TYPES) {
      const el = document.createElement('div');
      el.className = 'palette-item';
      el.draggable = true;
      el.title = type;
      el.dataset.type = type;

      const img = images[type];
      if (img) {
        const clone = img.cloneNode(true);
        clone.draggable = false;
        el.appendChild(clone);
      } else {
        el.textContent = type.slice(0, 2);
      }

      const label = document.createElement('span');
      label.textContent = type;
      el.appendChild(label);

      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/item-type', type);
        e.dataTransfer.setData('text/plain', type);
        e.dataTransfer.effectAllowed = 'copy';
      });

      root.appendChild(el);
    }
  }
}

/**
 * @param {HTMLElement} root
 * @param {(dx: number, dy: number) => void} onShift
 * @param {(delta: number) => void} onHeight
 */
function initShiftControls(root, onShift, onHeight) {
  root.className = 'shift-controls panel';
  root.innerHTML = '';

  const h = document.createElement('h2');
  h.textContent = 'Shift';
  root.appendChild(h);

  const row = document.createElement('div');
  row.className = 'shift-row';

  const pad = document.createElement('div');
  pad.className = 'shift-pad';

  const mk = (label, dx, dy, cls) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `shift-btn shift-${cls}`;
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.textContent = cls === 'up' ? '↑' : cls === 'down' ? '↓' : cls === 'left' ? '←' : '→';
    btn.addEventListener('click', () => onShift(dx, dy));
    return btn;
  };

  pad.append(
    mk('Shift up', 0, -1, 'up'),
    mk('Shift left', -1, 0, 'left'),
    mk('Shift down', 0, 1, 'down'),
    mk('Shift right', 1, 0, 'right'),
  );
  row.appendChild(pad);

  const height = document.createElement('div');
  height.className = 'shift-height';

  const mkH = (label, delta, cls) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `shift-btn height ${cls}`;
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.textContent = delta > 0 ? '↑' : '↓';
    btn.addEventListener('click', () => onHeight(delta));
    return btn;
  };

  height.append(
    mkH('Raise floor & ceiling', 1, 'raise'),
    mkH('Lower floor & ceiling', -1, 'lower'),
  );
  row.appendChild(height);
  root.appendChild(row);

  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.textContent =
    'Selection if any (tiles + items in them), else whole map. Height arrows move floor & ceiling together.';
  root.appendChild(hint);
}

// ---- js/main.js ----
const statusEl = document.getElementById('status');
const titleEl = document.querySelector('.toolbar h1');
const btnUndo = document.getElementById('btn-undo');
const btnRedo = document.getElementById('btn-redo');
const AUTOSAVE_MS = 10000;
const EPISODE_FILE = 'episode1.json';
const UNDO_LIMIT = 30;

let dirty = false;
let autosaveTimer = null;
let saving = false;

/** @type {string[]} JSON snapshots of the active level (pre-edit). */
let undoStack = [];
/** @type {string[]} */
let redoStack = [];
/** When true, further pushUndo calls are ignored (one entry per drag gesture). */
let undoGestureActive = false;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', isError);
}

function updateDirtyIndicator() {
  const star = dirty ? '*' : '';
  if (titleEl) titleEl.textContent = `SquareDoom${star}`;
  document.title = dirty ? 'SquareDoom *' : 'SquareDoom Map Editor';
}

function updateUndoButtons() {
  if (btnUndo) btnUndo.disabled = undoStack.length === 0;
  if (btnRedo) btnRedo.disabled = redoStack.length === 0;
}

function levelSnapshot() {
  return JSON.stringify(levelToJSON(activeLevel(episode)));
}

/** Push current level JSON before a mutation. No-op during an open gesture. */
function pushUndo() {
  if (undoGestureActive) return;
  undoStack.push(levelSnapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  redoStack.length = 0;
  updateUndoButtons();
}

/** Push once for a multi-step gesture (item drag, camera walk). */
function beginUndoGesture() {
  if (undoGestureActive) return;
  pushUndo();
  undoGestureActive = true;
}

function endUndoGesture() {
  undoGestureActive = false;
}

function clearUndoHistory() {
  undoStack.length = 0;
  redoStack.length = 0;
  undoGestureActive = false;
  updateUndoButtons();
}

function restoreLevelFromSnapshot(jsonStr) {
  episode.levels[episode.activeLevel] = levelFromJSON(JSON.parse(jsonStr));
  clearSelection();
  markDirty();
  refreshAll();
}

function undo() {
  if (!undoStack.length) return;
  endUndoGesture();
  redoStack.push(levelSnapshot());
  if (redoStack.length > UNDO_LIMIT) redoStack.shift();
  restoreLevelFromSnapshot(undoStack.pop());
  setStatus('Undo');
  updateUndoButtons();
}

function redo() {
  if (!redoStack.length) return;
  endUndoGesture();
  undoStack.push(levelSnapshot());
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  restoreLevelFromSnapshot(redoStack.pop());
  setStatus('Redo');
  updateUndoButtons();
}

function markDirty() {
  if (!dirty) {
    dirty = true;
    updateDirtyIndicator();
  }
  scheduleAutosave();
}

function markClean() {
  dirty = false;
  updateDirtyIndicator();
  clearAutosaveTimer();
}

function clearAutosaveTimer() {
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
}

function isEditingField(el = document.activeElement) {
  return (
    el instanceof HTMLInputElement ||
    el instanceof HTMLTextAreaElement ||
    el instanceof HTMLSelectElement ||
    !!el?.isContentEditable
  );
}

function scheduleAutosave() {
  clearAutosaveTimer();
  if (!dirty || isEditingField()) return;
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    void runAutosave();
  }, AUTOSAVE_MS);
}

async function runAutosave() {
  if (!dirty || saving || !hasEpisodeFileHandle()) return;
  if (isEditingField()) {
    // Still typing — wait a full idle delay after they leave the field.
    scheduleAutosave();
    return;
  }
  await saveNow('Autosaved');
}

/** Pause autosave while typing in inputs; restart the idle delay on leave. */
document.addEventListener('focusin', (e) => {
  if (isEditingField(e.target)) clearAutosaveTimer();
});
document.addEventListener('focusout', () => {
  // focus may move to another field; check after the new target is active.
  requestAnimationFrame(() => {
    if (dirty && !isEditingField()) scheduleAutosave();
  });
});

/** Set after UI init — saveNow runs above the bundled async IIFE. */
let refreshAfterPack = () => {};

async function saveNow(okMsg = 'Saved') {
  if (saving) return;
  saving = true;
  setStatus('Optimizing sectors…');
  try {
    for (const name of LEVEL_NAMES) {
      rebuildSectors(episode.levels[name], { optimal: true });
      compactSectorIds(episode.levels[name]);
    }
    refreshAfterPack();

    const borderIssues = validateVoidBorder(activeLevel(episode));
    if (borderIssues.length) {
      setStatus(borderIssues[0], true);
      return;
    }
    setStatus('Saving…');
    const how = hasEpisodeFileHandle()
      ? await autosaveEpisodeJSON(episode)
      : await saveEpisodeJSON(episode, EPISODE_FILE);
    if (how == null) {
      setStatus('Save cancelled', true);
    } else {
      markClean();
      setStatus(`${okMsg} ${episodeFileName()}`);
    }
  } catch (err) {
    setStatus(String(err.message || err), true);
  } finally {
    saving = false;
  }
}

async function loadImages() {
  /** @type {Record<string, HTMLImageElement>} */
  const images = {};
  await Promise.all(
    EDITOR_ITEM_TYPES.map(
      (type) =>
        new Promise((resolve) => {
          const data =
            typeof ITEM_IMAGE_DATA !== 'undefined' && ITEM_IMAGE_DATA
              ? ITEM_IMAGE_DATA[type]
              : null;
          const img = new Image();
          img.src = data || `itemgraphics/${type}.png`;
          img.onload = () => {
            images[type] = img;
            resolve();
          };
          img.onerror = () => resolve();
        }),
    ),
  );
  return images;
}

const episode = createEpisode();

/** @type {{
 *   tiles: Set<string>,
 *   items: Set<any>,
 *   primaryTile: {tx:number,ty:number}|null,
 *   hoverTile: {tx:number,ty:number}|null,
 * }} */
const selection = {
  tiles: new Set(),
  items: new Set(),
  primaryTile: null,
  hoverTile: null,
  box: null,
};

/** @type {null | {
 *   mode: 'items' | 'box',
 *   lastTx: number,
 *   lastTy: number,
 *   lastWx: number,
 *   lastWy: number,
 *   additive?: boolean,
 *   startTx?: number,
 *   startTy?: number,
 *   startPx?: number,
 *   startPy?: number,
 *   moved?: boolean,
 *   baseTiles?: Set<string>,
 * }} */
let drag = null;

(async () => {
const images = await loadImages();

const levelList = new LevelList(document.getElementById('level-list'), {
  getActive: () => episode.activeLevel,
  onSelect: (name) => {
    if (name === episode.activeLevel) return;
    episode.activeLevel = name;
    clearUndoHistory();
    clearSelection();
    refreshAll();
  },
});

new ItemPalette(document.getElementById('item-palette'), images);

const tileEditor = new TileEditor(document.getElementById('tile-editor'), {
  getTiles: () => [...selection.tiles].map(parseTileKey),
  getProps: () => {
    const level = activeLevel(episode);
    return [...selection.tiles]
      .map(parseTileKey)
      .map(({ tx, ty }) => {
        const id = getCell(level, tx, ty);
        const props = getTileProps(level, tx, ty);
        return props ? { ...props, id } : null;
      })
      .filter(Boolean);
  },
  sectorCount: () => sectorCount(activeLevel(episode)),
  itemCount: () => gameItemCount(activeLevel(episode)),
  enemyCount: () => enemyCount(activeLevel(episode)),
  secretCount: () => secretCount(activeLevel(episode)),
  hasItemSelection: () => selection.items.size > 0,
  getLevelName: () => activeLevel(episode).name || '',
  onLevelNameChange: (name) => {
    const level = activeLevel(episode);
    const next = clampLevelName(name);
    if (level.name === next) return;
    pushUndo();
    level.name = next;
    markDirty();
    setStatus(next ? `Level name: ${next}` : 'Level name cleared');
    refreshEditors();
  },
  getParTime: () => clampParTime(activeLevel(episode).parTime),
  onParTimeChange: (sec) => {
    const level = activeLevel(episode);
    const next = clampParTime(sec);
    if (clampParTime(level.parTime) === next) return;
    pushUndo();
    level.parTime = next;
    markDirty();
    setStatus(`Par time: ${next}s`);
    refreshEditors();
  },
  onChange: (patch) => {
    const level = activeLevel(episode);
    const tiles = [...selection.tiles].map(parseTileKey);
    pushUndo();
    applyTilePatch(level, tiles, patch);
    markDirty();
    setStatus(`Updated ${tiles.length} tile(s) · ${sectorCount(level)} sectors`);
    refreshAll();
  },
  onClear: () => {
    doClearTiles();
  },
  onSelectSector: () => {
    doSelectSector();
  },
  onMakeMonsterCloset: () => {
    const level = activeLevel(episode);
    const tiles = [...selection.tiles].map(parseTileKey);
    if (!tiles.length) {
      setStatus('Select tiles to make a monster closet');
      return;
    }
    const n = closetNeighbourFloor(level, tiles);
    if (n == null) {
      setStatus('No adjacent neighbour floor found for monster closet');
      return;
    }
    const heights = monsterClosetHeights(n);
    pushUndo();
    applyTilePatch(level, tiles, heights);
    markDirty();
    setStatus(
      `Monster closet: floor ${heights.floorHeight}, ceil ${heights.ceilingHeight} (neighbour floor ${n})`,
    );
    refreshAll();
  },
});

const itemEditor = new ItemEditor(document.getElementById('item-editor'), {
  getItems: () => [...selection.items],
  onChange: (patch) => {
    const items = [...selection.items];
    pushUndo();
    for (const item of items) {
      if ('type' in patch) {
        if (isSpawn(item)) continue; // spawn type is fixed
        if (patch.type === SPAWN_TYPE) continue;
        if (patch.type === SWITCH_TYPE || isSwitchCookType(patch.type)) {
          continue; // switch is a sector trigger, not an item
        }
        if (patch.type === CAMERA_TYPE && !isCamera(item)) {
          item.type = CAMERA_TYPE;
          item.angle = 0;
          delete item.skills;
        } else if (patch.type !== CAMERA_TYPE && isCamera(item)) {
          item.type = patch.type;
          item.skills = defaultSkills();
          delete item.angle;
        } else if (isSwitch(item)) {
          item.type = patch.type;
          item.skills = defaultSkills();
        } else {
          item.type = patch.type;
        }
      }
      if ('x' in patch) item.x = clampWorld(patch.x);
      if ('y' in patch) item.y = clampWorld(patch.y);
      if ('angle' in patch) item.angle = normalizeAngle(patch.angle);
      if ('skillKey' in patch && item.skills) {
        item.skills = { ...item.skills, [patch.skillKey]: patch.skillValue };
      }
    }
    markDirty();
    refreshEditors();
    mapView.draw();
    previewView.draw();
  },
  onDelete: () => {
    doDeleteItems();
  },
});

const mapView = new MapView(document.getElementById('map-canvas'), {
  getLevel: () => activeLevel(episode),
  getSelection: () => selection,
  images,
  stage: document.getElementById('map-stage'),
  onDropItem: (type, wx, wy) => {
    placeItem(type, wx, wy);
  },
  onPointer: (e, info) => {
    handlePointer(e, info);
  },
});

initShiftControls(
  document.getElementById('shift-controls'),
  (dx, dy) => {
    doShift(dx, dy);
  },
  (delta) => {
    doHeightNudge(delta);
  },
);

const previewHint = document.getElementById('preview-hint');
const previewRays = document.getElementById('preview-rays');
const previewColH = document.getElementById('preview-col-h');

function previewInt(el, fallback, lo, hi) {
  const n = Number(el.value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(lo, Math.min(hi, Math.round(n)));
}

const previewView = new PreviewView(document.getElementById('preview-canvas'), {
  getLevel: () => activeLevel(episode),
  getCamera: () => {
    const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
    return findPreviewCamera(activeLevel(episode), selected ?? null);
  },
  getRaycasts: () => previewInt(previewRays, 40, 8, 320),
  getColumnHeight: () => previewInt(previewColH, 25, 8, 240),
  images,
  onRotate: (angle) => {
    const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
    const cam = findPreviewCamera(activeLevel(episode), selected ?? null);
    if (!cam) return;
    beginUndoGesture();
    cam.angle = normalizeAngle(angle);
    markDirty();
    if (selection.items.has(cam)) itemEditor.render();
    mapView.draw();
    previewView.draw();
  },
  onMove: (x, y) => {
    const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
    const cam = findPreviewCamera(activeLevel(episode), selected ?? null);
    if (!cam) return;
    beginUndoGesture();
    // Keep fractional world coords while walking; |0 truncate made forward stick.
    cam.x = Math.max(0, Math.min(WORLD_MAX, x));
    cam.y = Math.max(0, Math.min(WORLD_MAX, y));
    markDirty();
    if (selection.items.has(cam)) itemEditor.render();
    mapView.draw();
    previewView.draw();
  },
  onEditEnd: () => {
    endUndoGesture();
  },
});

function redrawPreview() {
  previewView.draw();
}

previewRays.addEventListener('change', redrawPreview);
previewColH.addEventListener('change', redrawPreview);
previewRays.addEventListener('input', redrawPreview);
previewColH.addEventListener('input', redrawPreview);

function updatePreviewHint() {
  const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
  const cam = findPreviewCamera(activeLevel(episode), selected ?? null);
  if (!cam) {
    previewHint.textContent = 'Place or select a camera';
    return;
  }
  if (selected && isSpawn(selected)) {
    previewHint.textContent = 'Spawn view — drag L/R to set angle · U/D to move';
  } else if (selected) {
    previewHint.textContent = 'Drag L/R to rotate · U/D to walk';
  } else if (isSpawn(cam)) {
    previewHint.textContent = 'Showing spawn — select spawn to edit angle';
  } else {
    previewHint.textContent = 'Showing first camera — select one to edit';
  }
}

function selectedTileList() {
  return [...selection.tiles].map(parseTileKey);
}

function brushProps() {
  const level = activeLevel(episode);
  if (selection.primaryTile) {
    const props = getTileProps(
      level,
      selection.primaryTile.tx,
      selection.primaryTile.ty,
    );
    if (props) return props;
  }
  for (const key of selection.tiles) {
    const { tx, ty } = parseTileKey(key);
    const props = getTileProps(level, tx, ty);
    if (props) return props;
  }
  return null;
}

function setTileSelection(tiles, primary = null) {
  selection.tiles = new Set(tiles.map(({ tx, ty }) => tileKey(tx, ty)));
  selection.primaryTile = primary || (tiles.length ? tiles[tiles.length - 1] : null);
}

function clearSelection() {
  selection.tiles.clear();
  selection.items.clear();
  selection.primaryTile = null;
  selection.hoverTile = null;
  selection.box = null;
  drag = null;
}

function refreshEditors() {
  tileEditor.render();
  itemEditor.render();
}

function refreshAll() {
  levelList.render();
  const label = document.getElementById('map-level-label');
  if (label) {
    const n = sectorCount(activeLevel(episode));
    label.textContent = `(${episode.activeLevel} · ${n} sector${n === 1 ? '' : 's'})`;
  }
  refreshEditors();
  updatePreviewHint();
  mapView.draw();
  previewView.draw();
}

refreshAfterPack = refreshAll;

function placeItem(type, wx, wy) {
  const level = activeLevel(episode);
  if (!EDITOR_ITEM_TYPES.includes(type)) return;
  if (type !== CAMERA_TYPE && type !== SPAWN_TYPE && gameItemCount(level) >= MAX_PLACEABLE_ITEMS) {
    setStatus(`Max ${MAX_PLACEABLE_ITEMS} items`, true);
    return;
  }
  if (ENEMY_TYPES.has(type) && enemyCount(level) >= MAX_ENEMIES) {
    setStatus(`Max ${MAX_ENEMIES} enemies (mobj limit)`, true);
    return;
  }
  pushUndo();
  const item = addItem(level, type, wx, wy);
  if (!item) {
    undoStack.pop();
    updateUndoButtons();
    setStatus('Could not place item', true);
    return;
  }
  selection.tiles.clear();
  selection.primaryTile = null;
  selection.items = new Set([item]);
  markDirty();
  setStatus(type === SPAWN_TYPE ? 'Moved spawn' : `Placed ${type}`);
  refreshAll();
}

function doDeleteItems() {
  if (!selection.items.size) return;
  const level = activeLevel(episode);
  const toDelete = [...selection.items].filter((it) => !isSpawn(it));
  if (!toDelete.length) {
    setStatus('Spawn cannot be deleted', true);
    return;
  }
  pushUndo();
  for (const it of toDelete) removeItem(level, it);
  selection.items = new Set([...selection.items].filter((it) => isSpawn(it)));
  markDirty();
  setStatus(`Deleted ${toDelete.length} item(s)`);
  refreshAll();
}

function doClearTiles() {
  if (!selection.tiles.size) {
    setStatus('No tiles selected', true);
    return;
  }
  const level = activeLevel(episode);
  const tiles = selectedTileList();
  pushUndo();
  clearTiles(level, tiles);
  selection.tiles.clear();
  selection.primaryTile = null;
  markDirty();
  setStatus(`Cleared ${tiles.length} tile(s) · ${sectorCount(level)} sectors`);
  refreshAll();
}

function doSelectSector() {
  const level = activeLevel(episode);
  const primary = selection.primaryTile || selectedTileList()[0];
  if (!primary) {
    setStatus('Select a tile first', true);
    return;
  }
  const id = level.map[primary.ty * MAP_SIZE + primary.tx];
  if (!id) {
    setStatus('Selected tile has no sector', true);
    return;
  }
  const tiles = tilesInSector(level, id);
  setTileSelection(tiles, primary);
  selection.items.clear();
  setStatus(`Selected sector #${id} (${tiles.length} tiles)`);
  refreshAll();
}

function doShift(dx, dy) {
  const level = activeLevel(episode);
  const dir = dy < 0 ? 'up' : dy > 0 ? 'down' : dx < 0 ? 'left' : 'right';

  pushUndo();
  if (selection.tiles.size > 0) {
    const tiles = selectedTileList();
    const occupied = tiles.filter(({ tx, ty }) => level.map[ty * MAP_SIZE + tx] !== 0);
    const items = itemsInTiles(level, occupied);

    const moved = moveTiles(level, occupied, dx, dy);
    moveItemsBy(level, items, dx * WORLD_PER_TILE, dy * WORLD_PER_TILE);

    const nextTiles = new Set();
    for (const key of selection.tiles) {
      const { tx, ty } = parseTileKey(key);
      const ntx = tx + dx;
      const nty = ty + dy;
      if (ntx >= 0 && ntx < MAP_SIZE && nty >= 0 && nty < MAP_SIZE) {
        nextTiles.add(tileKey(ntx, nty));
      }
    }
    for (const t of moved) nextTiles.add(tileKey(t.tx, t.ty));
    selection.tiles = nextTiles;

    if (selection.primaryTile) {
      const ntx = selection.primaryTile.tx + dx;
      const nty = selection.primaryTile.ty + dy;
      selection.primaryTile =
        ntx >= 0 && ntx < MAP_SIZE && nty >= 0 && nty < MAP_SIZE
          ? { tx: ntx, ty: nty }
          : (nextTiles.size ? parseTileKey([...nextTiles][0]) : null);
    }

    for (const it of [...selection.items]) {
      if (!itemStillOnLevel(level, it)) selection.items.delete(it);
    }

    markDirty();
    setStatus(`Shifted selection ${dir} (${moved.length} tiles)`);
    refreshAll();
    return;
  }

  shiftLevel(level, dx, dy);

  for (const it of [...selection.items]) {
    if (!itemStillOnLevel(level, it)) selection.items.delete(it);
  }

  markDirty();
  setStatus(`Shifted map ${dir}`);
  refreshAll();
}

function doHeightNudge(delta) {
  const level = activeLevel(episode);
  const tiles =
    selection.tiles.size > 0 ? selectedTileList() : occupiedTiles(level);
  const before = tiles.filter(({ tx, ty }) => getTileProps(level, tx, ty));
  if (!before.length) {
    setStatus(selection.tiles.size ? 'No occupied tiles in selection' : 'Map is empty', true);
    return;
  }
  pushUndo();
  nudgeTileHeights(level, tiles, delta);
  markDirty();
  setStatus(
    `${delta > 0 ? 'Raised' : 'Lowered'} floor & ceiling on ${
      selection.tiles.size ? 'selection' : 'map'
    }`,
  );
  refreshAll();
}

function tilesInBox(x0, y0, x1, y1, occupiedOnly = true) {
  const level = activeLevel(episode);
  const minX = Math.min(x0, x1);
  const maxX = Math.max(x0, x1);
  const minY = Math.min(y0, y1);
  const maxY = Math.max(y0, y1);
  const out = [];
  for (let ty = minY; ty <= maxY; ty++) {
    for (let tx = minX; tx <= maxX; tx++) {
      if (occupiedOnly && level.map[ty * MAP_SIZE + tx] === 0) continue;
      out.push({ tx, ty });
    }
  }
  return out;
}

function applyBoxSelection(additive, startTx, startTy, endTx, endTy, baseTiles) {
  const boxed = tilesInBox(startTx, startTy, endTx, endTy, true);
  if (additive) {
    const next = new Set(baseTiles);
    for (const t of boxed) next.add(tileKey(t.tx, t.ty));
    selection.tiles = next;
    selection.primaryTile = boxed.length
      ? boxed[boxed.length - 1]
      : (next.size ? parseTileKey([...next][next.size - 1]) : null);
  } else {
    selection.items.clear();
    setTileSelection(boxed, boxed.length ? boxed[boxed.length - 1] : null);
  }
}

function startBoxSelect(info, additive) {
  drag = {
    mode: 'box',
    additive,
    startTx: info.tx,
    startTy: info.ty,
    startPx: info.px,
    startPy: info.py,
    lastTx: info.tx,
    lastTy: info.ty,
    lastWx: info.wx,
    lastWy: info.wy,
    moved: false,
    baseTiles: additive ? new Set(selection.tiles) : new Set(),
  };
  selection.box = { x0: info.tx, y0: info.ty, x1: info.tx, y1: info.ty };
}

function startDrag(info, mode) {
  drag = {
    mode,
    lastTx: info.tx,
    lastTy: info.ty,
    lastWx: info.wx,
    lastWy: info.wy,
  };
}

function handlePointer(e, info) {
  const level = activeLevel(episode);

  if (e.type === 'pointerleave') {
    selection.hoverTile = null;
    if (!drag) mapView.draw();
    return;
  }

  if (e.type === 'pointermove') {
    selection.hoverTile = { tx: info.tx, ty: info.ty };

    if (drag && (e.buttons & 1)) {
      if (drag.mode === 'box') {
        const dist = Math.hypot(info.px - drag.startPx, info.py - drag.startPy);
        if (dist > 4) drag.moved = true;
        drag.lastTx = info.tx;
        drag.lastTy = info.ty;
        selection.box = {
          x0: drag.startTx,
          y0: drag.startTy,
          x1: info.tx,
          y1: info.ty,
        };
        if (drag.moved) {
          applyBoxSelection(
            drag.additive,
            drag.startTx,
            drag.startTy,
            info.tx,
            info.ty,
            drag.baseTiles,
          );
        }
        refreshEditors();
        mapView.draw();
        return;
      }

      if (drag.mode === 'items') {
        const dx = info.wx - drag.lastWx;
        const dy = info.wy - drag.lastWy;
        if (dx || dy) {
          beginUndoGesture();
          const kept = moveItemsBy(level, [...selection.items], dx, dy);
          selection.items = new Set(kept);
          drag.lastWx = info.wx;
          drag.lastWy = info.wy;
          markDirty();
          refreshEditors();
          mapView.draw();
          previewView.draw();
        }
      }
      return;
    }

    mapView.draw();
    return;
  }

  if (e.type === 'pointerup') {
    if (drag) {
      if (drag.mode === 'box') {
        const { additive, startTx, startTy, moved, baseTiles } = drag;
        selection.box = null;
        if (!moved) {
          // Plain click / ctrl+click
          const key = tileKey(startTx, startTy);
          if (additive) {
            if (selection.tiles.has(key)) {
              selection.tiles.delete(key);
              if (
                selection.primaryTile &&
                selection.primaryTile.tx === startTx &&
                selection.primaryTile.ty === startTy
              ) {
                selection.primaryTile = selection.tiles.size
                  ? parseTileKey([...selection.tiles][selection.tiles.size - 1])
                  : null;
              }
            } else {
              selection.tiles.add(key);
              selection.primaryTile = { tx: startTx, ty: startTy };
            }
          } else {
            const key = tileKey(startTx, startTy);
            // Click selected empty (void) tile → deselect
            if (!getCell(level, startTx, startTy) && selection.tiles.has(key)) {
              selection.items.clear();
              selection.tiles.clear();
              selection.primaryTile = null;
            } else {
              selection.items.clear();
              setTileSelection([{ tx: startTx, ty: startTy }], { tx: startTx, ty: startTy });
            }
          }
        } else {
          applyBoxSelection(additive, startTx, startTy, drag.lastTx, drag.lastTy, baseTiles);
        }
        drag = null;
        const n = sectorCount(level);
        setStatus(
          `Selection: ${selection.tiles.size} tile(s), ${selection.items.size} item(s) · ${n} sectors`,
        );
        refreshAll();
        return;
      }

      endUndoGesture();
      drag = null;
      const n = sectorCount(level);
      if (selection.tiles.size || selection.items.size) {
        setStatus(
          `Selection: ${selection.tiles.size} tile(s), ${selection.items.size} item(s) · ${n} sectors`,
        );
      }
      refreshAll();
    }
    return;
  }

  if (e.type !== 'pointerdown') return;

  try {
    e.currentTarget.setPointerCapture(e.pointerId);
  } catch (_) { /* ignore */ }

  // Shift+click empty: paint/add. Occupied tiles need Shift+Alt to overwrite.
  if (info.shift && (!info.sectorId || info.alt)) {
    selection.items.clear();
    const brush = brushProps();
    pushUndo();
    if (!addTile(level, info.tx, info.ty, brush)) {
      undoStack.pop();
      updateUndoButtons();
      setStatus('No free sector ids', true);
      return;
    }
    setTileSelection([{ tx: info.tx, ty: info.ty }], { tx: info.tx, ty: info.ty });
    markDirty();
    if (level._lastPaintNote) {
      setStatus(level._lastPaintNote, true);
    } else {
      setStatus(
        brush
          ? `Painted tile from selection · ${sectorCount(level)} sectors`
          : `Added default tile · ${sectorCount(level)} sectors`,
      );
    }
    refreshAll();
    return;
  }

  // Item hit — drag to reposition (tile selection uses Shift panel)
  if (info.item) {
    if (info.ctrl) {
      if (selection.items.has(info.item)) selection.items.delete(info.item);
      else selection.items.add(info.item);
    } else if (selection.items.has(info.item)) {
      // Keep multi-selection and start drag
    } else {
      selection.items = new Set([info.item]);
      selection.tiles.clear();
      selection.primaryTile = null;
    }
    startDrag(info, 'items');
    refreshEditors();
    updatePreviewHint();
    mapView.draw();
    previewView.draw();
    return;
  }

  // Ctrl+drag starts additive box select (click-toggle happens on pointerup if no move)
  if (info.ctrl) {
    startBoxSelect(info, true);
    refreshEditors();
    mapView.draw();
    return;
  }

  // Box select (click selects one tile on pointerup)
  startBoxSelect(info, false);
  refreshEditors();
  mapView.draw();
}

function nudgeTileSelection(dtx, dty) {
  const primary = selection.primaryTile || selectedTileList()[0];
  if (!primary) return;
  const tx = Math.max(0, Math.min(MAP_SIZE - 1, primary.tx + dtx));
  const ty = Math.max(0, Math.min(MAP_SIZE - 1, primary.ty + dty));
  if (tx === primary.tx && ty === primary.ty) return;
  selection.items.clear();
  setTileSelection([{ tx, ty }], { tx, ty });
  selection.primaryTile = { tx, ty };
  refreshEditors();
  updatePreviewHint();
  mapView.draw();
  previewView.draw();
}

document.addEventListener('keydown', (e) => {
  if (
    e.target instanceof HTMLInputElement ||
    e.target instanceof HTMLSelectElement ||
    e.target instanceof HTMLTextAreaElement
  ) {
    return;
  }

  if ((e.ctrlKey || e.metaKey) && !e.altKey) {
    const key = e.key.toLowerCase();
    if (key === 'z' && !e.shiftKey) {
      e.preventDefault();
      undo();
      return;
    }
    if (key === 'y' || (key === 'z' && e.shiftKey)) {
      e.preventDefault();
      redo();
      return;
    }
  }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (!selection.tiles.size && !selection.primaryTile) return;
    e.preventDefault();
    const dx = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
    const dy = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
    nudgeTileSelection(dx, dy);
    return;
  }

  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  e.preventDefault();
  if (selection.items.size) doDeleteItems();
  else if (selection.tiles.size) doClearTiles();
});

document.getElementById('btn-undo').addEventListener('click', () => {
  undo();
});

document.getElementById('btn-redo').addEventListener('click', () => {
  redo();
});

document.getElementById('btn-save').addEventListener('click', async () => {
  await saveNow('Saved');
});

function applyLoadedEpisode(loaded) {
  Object.assign(episode.levels, loaded.levels);
  if (loaded.activeLevel && episode.levels[loaded.activeLevel]) {
    episode.activeLevel = loaded.activeLevel;
  }
  clearUndoHistory();
  clearSelection();
  /** @type {string[]} */
  const shapeNotes = [];
  for (const name of Object.keys(episode.levels)) {
    const lvl = episode.levels[name];
    if (lvl._loadWarnings?.length) {
      shapeNotes.push(...lvl._loadWarnings.map((w) => `${name}: ${w}`));
      delete lvl._loadWarnings;
    }
  }
  if (shapeNotes.length) {
    markDirty();
    setStatus(`Loaded ${episodeFileName()} — ${shapeNotes[0]}`, true);
  } else {
    markClean();
    setStatus(`Loaded ${episodeFileName()}`);
  }
  refreshAll();
}

function showFileAccessGate(storedHandle) {
  const overlay = document.createElement('div');
  overlay.className = 'file-gate';
  overlay.innerHTML = `
    <div class="file-gate-card" role="dialog" aria-modal="true" aria-labelledby="file-gate-title">
      <h2 id="file-gate-title">Open map file</h2>
      <p class="muted">
        ${
          storedHandle
            ? `Browser needs permission to read/write <strong>${storedHandle.name}</strong>.`
            : `Choose project file <strong>${EPISODE_FILE}</strong> (usually in the editor folder).`
        }
      </p>
      <div class="btn-row">
        <button type="button" class="file-gate-primary" id="file-gate-ok">
          ${storedHandle ? `Allow ${storedHandle.name}` : `Open ${EPISODE_FILE}…`}
        </button>
        ${storedHandle ? `<button type="button" id="file-gate-other">Choose different file…</button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const ok = overlay.querySelector('#file-gate-ok');
  const other = overlay.querySelector('#file-gate-other');
  ok.focus();

  const finish = async (loader) => {
    ok.disabled = true;
    if (other) other.disabled = true;
    try {
      const loaded = await loader();
      if (!loaded) {
        ok.disabled = false;
        if (other) other.disabled = false;
        setStatus('Open cancelled', true);
        return;
      }
      overlay.remove();
      applyLoadedEpisode(loaded);
    } catch (err) {
      ok.disabled = false;
      if (other) other.disabled = false;
      setStatus(String(err.message || err), true);
    }
  };

  ok.addEventListener('click', () => {
    void finish(() =>
      storedHandle ? allowStoredEpisodeFile(storedHandle) : loadEpisodeJSON(),
    );
  });
  other?.addEventListener('click', () => {
    void finish(() => loadEpisodeJSON());
  });
}

document.getElementById('btn-load').addEventListener('click', async () => {
  try {
    const loaded = await loadEpisodeJSON();
    if (!loaded) return;
    applyLoadedEpisode(loaded);
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
});

document.getElementById('btn-cook').addEventListener('click', () => {
  const result = cookAndDownload(episode, episode.activeLevel);
  if (result?.errors?.length) {
    setStatus(`Cook blocked — ${result.errors[0]}`, true);
  } else if (result?.warnings?.length) {
    setStatus(`Cooked ${episode.activeLevel} — ${result.warnings[0]}`, true);
  } else {
    setStatus(`Cooked ${episode.activeLevel}`);
  }
});

async function boot() {
  updateDirtyIndicator();
  refreshAll();
  try {
    const loaded = await tryRestoreEpisodeFile();
    if (loaded) {
      applyLoadedEpisode(loaded);
      return;
    }
    const stored = await getStoredEpisodeHandle();
    showFileAccessGate(stored);
    setStatus(
      stored
        ? `Click Allow to open ${stored.name}`
        : `Open ${EPISODE_FILE} to edit the project map`,
      false,
    );
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
}

boot();
})().catch((err) => {
  console.error(err);
  setStatus(String(err.message || err), true);
});

  </script>
