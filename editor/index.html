function summarizeProps(propList) {
  if (!propList.length) return null;
  const keys = [
    'floorHeight', 'ceilingHeight', 'sectorType',
    'tag', 'targetTag', 'brightness', 'floorColor', 'ceilingColor',
  ];
  const out = { ...propList[0], _mixed: {} };
  for (const key of keys) {
    const first = propList[0][key];
    out._mixed[key] = propList.some((p) => p[key] !== first);
  }
  return out;
}

class TileEditor {
  /**
   * @param {HTMLElement} root
   * @param {{
   *   getTiles: () => Array<{tx:number,ty:number}>,
   *   getProps: () => Array<object>,
   *   sectorCount: () => number,
   *   itemCount: () => number,
   *   hasItemSelection: () => boolean,
   *   getLevelName: () => string,
   *   onLevelNameChange: (name: string) => void,
   *   onChange: (patch: object) => void,
   *   onClear: () => void,
   *   onSelectSector: () => void,
   * }} opts
   */
  constructor(root, opts) {
    this.root = root;
    this.opts = opts;
    this.render();
  }

  render() {
    const tiles = this.opts.getTiles();
    const propsList = this.opts.getProps();
    this.root.innerHTML = '';
    this.root.classList.add('panel', 'tile-editor');

    const h = document.createElement('h2');
    h.textContent = 'Tile';
    this.root.appendChild(h);

    const countLine = document.createElement('p');
    countLine.className = 'muted';
    countLine.textContent = `Sectors: ${this.opts.sectorCount()} · Items: ${this.opts.itemCount()}/${MAX_ITEMS}`;
    this.root.appendChild(countLine);

    if (!tiles.length) {
      if (!this.opts.hasItemSelection()) {
        this.#levelNameFields();
      }
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'Select tiles on the map. Shift+click empty to add.';
      this.root.appendChild(p);
      return;
    }

    const occupied = propsList.length;
    const selLine = document.createElement('p');
    selLine.className = 'muted';
    selLine.textContent = occupied
      ? `${tiles.length} tile${tiles.length === 1 ? '' : 's'} selected`
      : `${tiles.length} empty tile${tiles.length === 1 ? '' : 's'} selected`;
    this.root.appendChild(selLine);

    if (occupied) {
      const ids = [...new Set(propsList.map((p) => p.id).filter((id) => id > 0))];
      const idLine = document.createElement('p');
      idLine.className = 'muted';
      if (ids.length === 1) {
        idLine.textContent = `Sector id: ${ids[0]}`;
      } else if (ids.length > 1) {
        idLine.textContent = `Sector ids: mixed (${ids.slice().sort((a, b) => a - b).join(', ')})`;
      }
      if (ids.length) this.root.appendChild(idLine);
    }

    if (!occupied) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'No properties — Shift+click to paint, or select occupied tiles.';
      this.root.appendChild(p);
      this.#actions();
      return;
    }

    const s = summarizeProps(propsList);
    const allSame = propsList.every((p) => sectorsEqual(p, propsList[0]));
    if (!allSame) {
      const note = document.createElement('p');
      note.className = 'muted';
      note.textContent = 'Mixed values — edits apply to all selected tiles.';
      this.root.appendChild(note);
    }

    const floor = numInput('te-floor', 'Floor height', 0, 31, s.floorHeight, s._mixed.floorHeight);
    const ceil = numInput('te-ceil', 'Ceiling height', 0, 31, s.ceilingHeight, s._mixed.ceilingHeight);
    const bright = numInput('te-bright', 'Brightness', 0, 7, s.brightness, s._mixed.brightness);

    const typeWrap = document.createElement('label');
    typeWrap.className = 'field';
    typeWrap.htmlFor = 'te-type';
    const typeSpan = document.createElement('span');
    typeSpan.textContent = s._mixed.sectorType ? 'Sector type (mixed)' : 'Sector type';
    const typeSel = document.createElement('select');
    typeSel.id = 'te-type';
    for (const t of SECTOR_TYPES) {
      const opt = document.createElement('option');
      opt.value = String(t.id);
      opt.textContent = `${t.id}: ${t.name}`;
      typeSel.appendChild(opt);
    }
    if (!s._mixed.sectorType) typeSel.value = String(s.sectorType ?? 0);
    else {
      const ph = document.createElement('option');
      ph.value = '';
      ph.textContent = 'mixed';
      ph.disabled = true;
      ph.selected = true;
      typeSel.prepend(ph);
    }
    typeSel.addEventListener('change', () => {
      if (typeSel.value === '') return;
      this.opts.onChange({ sectorType: Number(typeSel.value) });
    });
    typeWrap.append(typeSpan, typeSel);

    const typeNum = Number(s.sectorType);
    const showTarget =
      !!s._mixed.sectorType ||
      (Number.isFinite(typeNum) && sectorTypeNeedsTarget(typeNum));

    const tag = textInput('te-tag', 'Sector tag', s.tag || '', s._mixed.tag);
    tag.input.addEventListener('change', () => {
      this.opts.onChange({ tag: tag.input.value });
    });

    const floorCol = colorPicker('te-fcol', 'Floor colour', s.floorColor, s._mixed.floorColor);
    const ceilCol = colorPicker('te-ccol', 'Ceiling colour', s.ceilingColor, s._mixed.ceilingColor);

    const bindNum = (input, key) => {
      input.addEventListener('change', () => {
        if (input.value === '') return;
        this.opts.onChange({ [key]: Number(input.value) });
      });
    };
    bindNum(floor.input, 'floorHeight');
    bindNum(ceil.input, 'ceilingHeight');
    bindNum(bright.input, 'brightness');

    for (const btn of floorCol.buttons) {
      btn.addEventListener('click', () => this.opts.onChange({ floorColor: Number(btn.dataset.color) }));
    }
    for (const btn of ceilCol.buttons) {
      btn.addEventListener('click', () => this.opts.onChange({ ceilingColor: Number(btn.dataset.color) }));
    }

    this.root.append(floor.wrap, ceil.wrap, bright.wrap, typeWrap);

    if (showTarget) {
      const target = textInput(
        'te-target',
        s._mixed.targetTag ? 'Target tag (mixed)' : 'Target tag',
        s.targetTag || '',
        s._mixed.targetTag,
      );
      target.input.placeholder = s._mixed.targetTag ? 'mixed' : 'tag of target sector';
      target.input.addEventListener('change', () => {
        this.opts.onChange({ targetTag: target.input.value });
      });
      this.root.appendChild(target.wrap);
    }

    this.root.append(tag.wrap, floorCol.wrap, ceilCol.wrap);
    this.#actions();
  }

  #levelNameFields() {
    const sub = document.createElement('h2');
    sub.textContent = 'Level';
    this.root.appendChild(sub);

    const field = textInput('te-level-name', 'Name', this.opts.getLevelName() || '', false);
    field.input.maxLength = LEVEL_NAME_LEN;
    field.input.placeholder = 'Level name';
    const commit = () => {
      this.opts.onLevelNameChange(field.input.value);
    };
    field.input.addEventListener('change', commit);
    field.input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        field.input.blur();
      }
    });
    this.root.appendChild(field.wrap);
  }

  #actions() {
    const actions = document.createElement('div');
    actions.className = 'btn-row';

    const selectSector = document.createElement('button');
    selectSector.type = 'button';
    selectSector.textContent = 'Select sector';
    selectSector.title = 'Select all tiles in the sector of the primary selected tile';
    selectSector.addEventListener('click', () => this.opts.onSelectSector());
    actions.appendChild(selectSector);

    const clear = document.createElement('button');
    clear.type = 'button';
    clear.className = 'danger';
    clear.textContent = 'Clear tiles';
    clear.addEventListener('click', () => this.opts.onClear());
    actions.appendChild(clear);

    this.root.appendChild(actions);
  }
}

// ---- js/itemEditor.js ----
class ItemEditor {
  /**
   * @param {HTMLElement} root
   * @param {{
   *   getItems: () => any[],
   *   onChange: (patch: object) => void,
   *   onDelete: () => void,
   * }} opts
   */
  constructor(root, opts) {
    this.root = root;
    this.opts = opts;
    this.render();
  }

  render() {
    const items = this.opts.getItems();
    this.root.innerHTML = '';
    this.root.classList.add('panel', 'item-editor');

    const h = document.createElement('h2');
    h.textContent = 'Item';
    this.root.appendChild(h);

    if (!items.length) {
      const p = document.createElement('p');
      p.className = 'muted';
      p.textContent = 'Select items on the map.';
      this.root.appendChild(p);
      return;
    }

    const item = items[0];
    const multi = items.length > 1;
    const onlySpawn = items.length === 1 && isSpawn(item);
    const allSwitches = items.every((it) => isSwitch(it));

    const selLine = document.createElement('p');
    selLine.className = 'muted';
    if (onlySpawn) {
      selLine.textContent = 'Player spawn — preview shows this viewpoint.';
    } else if (multi) {
      selLine.textContent = `${items.length} items selected — edits apply to all`;
    } else if (isCamera(item)) {
      selLine.textContent = 'Editor only — not included in cooked binary.';
    } else if (isSwitch(item)) {
      selLine.textContent = 'Switch';
    } else {
      selLine.textContent = item.type;
    }
    this.root.appendChild(selLine);

    if (!onlySpawn) {
      const typesSame = items.every((it) => {
        if (isSwitch(it) && isSwitch(item)) return true;
        return it.type === item.type;
      });
      const typeLab = document.createElement('label');
      typeLab.className = 'field';
      typeLab.innerHTML = '<span>Type</span>';
      const typeSel = document.createElement('select');
      if (!typesSame) {
        const mixed = document.createElement('option');
        mixed.value = '';
        mixed.textContent = '(mixed)';
        mixed.selected = true;
        typeSel.appendChild(mixed);
      }
      // Spawn is level.spawn only — not a convertible item type
      const types = ITEM_TYPES.filter(
        (t) => t !== SPAWN_TYPE && !isSwitchCookType(t),
      ).concat(SWITCH_TYPE, CAMERA_TYPE);
      for (const t of types) {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        if (typesSame && (t === item.type || (t === SWITCH_TYPE && isSwitch(item)))) {
          opt.selected = true;
        }
        typeSel.appendChild(opt);
      }
      typeSel.addEventListener('change', () => {
        if (!typeSel.value) return;
        this.opts.onChange({ type: typeSel.value });
      });
      typeLab.appendChild(typeSel);
      this.root.appendChild(typeLab);
    }

    const xSame = items.every((it) => it.x === item.x);
    const ySame = items.every((it) => it.y === item.y);
    this.#numField('X', 'x', 0, WORLD_MAX, xSame ? item.x : null);
    this.#numField('Y', 'y', 0, WORLD_MAX, ySame ? item.y : null);

    const allViewpoints = items.every((it) => isCamera(it) || isSpawn(it));
    const noViewpoints = items.every((it) => !isCamera(it) && !isSpawn(it));

    if (allViewpoints) {
      const deg = Math.round(((item.angle ?? 0) * 180) / Math.PI);
      const angleSame = items.every(
        (it) => Math.round(((it.angle ?? 0) * 180) / Math.PI) === deg,
      );
      const angleLab = document.createElement('label');
      angleLab.className = 'field';
      const span = document.createElement('span');
      span.textContent = 'Angle (deg)';
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '-180';
      input.max = '180';
      input.step = '1';
      if (angleSame) input.value = String(deg);
      else {
        input.placeholder = 'mixed';
        input.value = '';
      }
      input.addEventListener('change', () => {
        if (input.value === '') return;
        this.opts.onChange({ angle: (Number(input.value) * Math.PI) / 180 });
      });
      angleLab.append(span, input);
      this.root.appendChild(angleLab);
    } else if (allSwitches) {
      this.#switchFields(items, item);
    } else if (noViewpoints) {
      const skills = document.createElement('div');
      skills.className = 'field skills';
      const skillLabel = document.createElement('span');
      skillLabel.textContent = 'Skill';
      skills.appendChild(skillLabel);
      const row = document.createElement('div');
      row.className = 'skill-row';
      for (const key of ['easy', 'normal', 'hard']) {
        const allOn = items.every((it) => it.skills?.[key]);
        const allOff = items.every((it) => !it.skills?.[key]);
        const lab = document.createElement('label');
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.checked = allOn;
        cb.indeterminate = !allOn && !allOff;
        cb.addEventListener('change', () => {
          this.opts.onChange({ skillKey: key, skillValue: cb.checked });
        });
        lab.append(cb, document.createTextNode(key));
        row.appendChild(lab);
      }
      skills.appendChild(row);
      this.root.appendChild(skills);
    }

    if (!onlySpawn) {
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'danger';
      del.textContent = multi ? 'Delete items' : 'Delete item';
      del.addEventListener('click', () => this.opts.onDelete());
      this.root.appendChild(del);
    }
  }

  #switchFields(items, item) {
    const actionSame = items.every(
      (it) => normalizeSwitchAction(it.switchAction) === normalizeSwitchAction(item.switchAction),
    );
    const actionLab = document.createElement('label');
    actionLab.className = 'field';
    actionLab.innerHTML = '<span>Action</span>';
    const actionSel = document.createElement('select');
    if (!actionSame) {
      const mixed = document.createElement('option');
      mixed.value = '';
      mixed.textContent = '(mixed)';
      mixed.selected = true;
      actionSel.appendChild(mixed);
    }
    for (const a of SWITCH_ACTIONS) {
      const opt = document.createElement('option');
      opt.value = a.id;
      opt.textContent = a.name;
      if (actionSame && a.id === normalizeSwitchAction(item.switchAction)) {
        opt.selected = true;
      }
      actionSel.appendChild(opt);
    }
    actionSel.addEventListener('change', () => {
      if (!actionSel.value) return;
      this.opts.onChange({ switchAction: actionSel.value });
    });
    actionLab.appendChild(actionSel);
    this.root.appendChild(actionLab);

    const tagSame = items.every(
      (it) => (it.targetTag || '') === (item.targetTag || ''),
    );
    const tagLab = document.createElement('label');
    tagLab.className = 'field';
    const tagSpan = document.createElement('span');
    tagSpan.textContent = tagSame ? 'Target tag' : 'Target tag (mixed)';
    const tagInput = document.createElement('input');
    tagInput.type = 'text';
    tagInput.autocomplete = 'off';
    tagInput.spellcheck = false;
    tagInput.placeholder = tagSame ? 'tag of target sector' : 'mixed';
    tagInput.value = tagSame ? item.targetTag || '' : '';
    tagInput.addEventListener('change', () => {
      this.opts.onChange({ targetTag: tagInput.value });
    });
    tagLab.append(tagSpan, tagInput);
    this.root.appendChild(tagLab);
  }

  #numField(label, key, min, max, value) {
    const lab = document.createElement('label');
    lab.className = 'field';
    const span = document.createElement('span');
    span.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.min = String(min);
    input.max = String(max);
    if (value == null) {
      input.placeholder = 'mixed';
      input.value = '';
    } else {
      input.value = String(value);
    }
    input.addEventListener('change', () => {
      if (input.value === '') return;
      this.opts.onChange({ [key]: Number(input.value) });
    });
    lab.append(span, input);
    this.root.appendChild(lab);
  }
}

// ---- js/itemPalette.js ----
class ItemPalette {
  /**
   * @param {HTMLElement} root
   * @param {Record<string, HTMLImageElement>} images
   */
  constructor(root, images) {
    this.root = root;
    root.classList.add('item-palette');
    root.innerHTML = '';

    for (const type of EDITOR_ITEM_TYPES) {
      const el = document.createElement('div');
      el.className = 'palette-item';
      el.draggable = true;
      el.title = type;
      el.dataset.type = type;

      const img = images[type];
      if (img) {
        const clone = img.cloneNode(true);
        clone.draggable = false;
        el.appendChild(clone);
      } else {
        el.textContent = type.slice(0, 2);
      }

      const label = document.createElement('span');
      label.textContent = type;
      el.appendChild(label);

      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/item-type', type);
        e.dataTransfer.setData('text/plain', type);
        e.dataTransfer.effectAllowed = 'copy';
      });

      root.appendChild(el);
    }
  }
}

/**
 * @param {HTMLElement} root
 * @param {(dx: number, dy: number) => void} onShift
 * @param {(delta: number) => void} onHeight
 */
function initShiftControls(root, onShift, onHeight) {
  root.className = 'shift-controls panel';
  root.innerHTML = '';

  const h = document.createElement('h2');
  h.textContent = 'Shift';
  root.appendChild(h);

  const row = document.createElement('div');
  row.className = 'shift-row';

  const pad = document.createElement('div');
  pad.className = 'shift-pad';

  const mk = (label, dx, dy, cls) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `shift-btn shift-${cls}`;
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.textContent = cls === 'up' ? '↑' : cls === 'down' ? '↓' : cls === 'left' ? '←' : '→';
    btn.addEventListener('click', () => onShift(dx, dy));
    return btn;
  };

  pad.append(
    mk('Shift up', 0, -1, 'up'),
    mk('Shift left', -1, 0, 'left'),
    mk('Shift down', 0, 1, 'down'),
    mk('Shift right', 1, 0, 'right'),
  );
  row.appendChild(pad);

  const height = document.createElement('div');
  height.className = 'shift-height';

  const mkH = (label, delta, cls) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = `shift-btn height ${cls}`;
    btn.title = label;
    btn.setAttribute('aria-label', label);
    btn.textContent = delta > 0 ? '↑' : '↓';
    btn.addEventListener('click', () => onHeight(delta));
    return btn;
  };

  height.append(
    mkH('Raise floor & ceiling', 1, 'raise'),
    mkH('Lower floor & ceiling', -1, 'lower'),
  );
  row.appendChild(height);
  root.appendChild(row);

  const hint = document.createElement('p');
  hint.className = 'muted';
  hint.textContent =
    'Selection if any (tiles + items in them), else whole map. Height arrows move floor & ceiling together.';
  root.appendChild(hint);
}

// ---- js/main.js ----
const statusEl = document.getElementById('status');
const titleEl = document.querySelector('.toolbar h1');
const AUTOSAVE_MS = 10000;
const EPISODE_FILE = 'episode1.json';

let dirty = false;
let autosaveTimer = null;
let saving = false;

function setStatus(msg, isError = false) {
  statusEl.textContent = msg || '';
  statusEl.classList.toggle('error', isError);
}

function updateDirtyIndicator() {
  const star = dirty ? '*' : '';
  if (titleEl) titleEl.textContent = `SquareDoom${star}`;
  document.title = dirty ? 'SquareDoom *' : 'SquareDoom Map Editor';
}

function markDirty() {
  if (!dirty) {
    dirty = true;
    updateDirtyIndicator();
  }
  scheduleAutosave();
}

function markClean() {
  dirty = false;
  updateDirtyIndicator();
  if (autosaveTimer) {
    clearTimeout(autosaveTimer);
    autosaveTimer = null;
  }
}

function scheduleAutosave() {
  if (autosaveTimer) clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(() => {
    autosaveTimer = null;
    void runAutosave();
  }, AUTOSAVE_MS);
}

async function runAutosave() {
  if (!dirty || saving || !hasEpisodeFileHandle()) return;
  await saveNow('Autosaved');
}

async function saveNow(okMsg = 'Saved') {
  if (saving) return;
  saving = true;
  setStatus('Saving…');
  try {
    const how = hasEpisodeFileHandle()
      ? await autosaveEpisodeJSON(episode)
      : await saveEpisodeJSON(episode, EPISODE_FILE);
    if (how == null) {
      setStatus('Save cancelled', true);
    } else {
      markClean();
      setStatus(`${okMsg} ${episodeFileName()}`);
    }
  } catch (err) {
    setStatus(String(err.message || err), true);
  } finally {
    saving = false;
  }
}

async function loadImages() {
  /** @type {Record<string, HTMLImageElement>} */
  const images = {};
  await Promise.all(
    EDITOR_ITEM_TYPES.map(
      (type) =>
        new Promise((resolve) => {
          const data =
            typeof ITEM_IMAGE_DATA !== 'undefined' && ITEM_IMAGE_DATA
              ? ITEM_IMAGE_DATA[type]
              : null;
          const img = new Image();
          img.src = data || `itemgraphics/${type}.png`;
          img.onload = () => {
            images[type] = img;
            resolve();
          };
          img.onerror = () => resolve();
        }),
    ),
  );
  return images;
}

const episode = createEpisode();

/** @type {{
 *   tiles: Set<string>,
 *   items: Set<any>,
 *   primaryTile: {tx:number,ty:number}|null,
 *   hoverTile: {tx:number,ty:number}|null,
 * }} */
const selection = {
  tiles: new Set(),
  items: new Set(),
  primaryTile: null,
  hoverTile: null,
  box: null,
};

/** @type {null | {
 *   mode: 'items' | 'box',
 *   lastTx: number,
 *   lastTy: number,
 *   lastWx: number,
 *   lastWy: number,
 *   additive?: boolean,
 *   startTx?: number,
 *   startTy?: number,
 *   startPx?: number,
 *   startPy?: number,
 *   moved?: boolean,
 *   baseTiles?: Set<string>,
 * }} */
let drag = null;

(async () => {
const images = await loadImages();

const levelList = new LevelList(document.getElementById('level-list'), {
  getActive: () => episode.activeLevel,
  onSelect: (name) => {
    episode.activeLevel = name;
    clearSelection();
    refreshAll();
  },
});

new ItemPalette(document.getElementById('item-palette'), images);

const tileEditor = new TileEditor(document.getElementById('tile-editor'), {
  getTiles: () => [...selection.tiles].map(parseTileKey),
  getProps: () => {
    const level = activeLevel(episode);
    return [...selection.tiles]
      .map(parseTileKey)
      .map(({ tx, ty }) => {
        const id = getCell(level, tx, ty);
        const props = getTileProps(level, tx, ty);
        return props ? { ...props, id } : null;
      })
      .filter(Boolean);
  },
  sectorCount: () => sectorCount(activeLevel(episode)),
  itemCount: () => gameItemCount(activeLevel(episode)),
  hasItemSelection: () => selection.items.size > 0,
  getLevelName: () => activeLevel(episode).name || '',
  onLevelNameChange: (name) => {
    const level = activeLevel(episode);
    const next = clampLevelName(name);
    if (level.name === next) return;
    level.name = next;
    markDirty();
    setStatus(next ? `Level name: ${next}` : 'Level name cleared');
    refreshEditors();
  },
  onChange: (patch) => {
    const level = activeLevel(episode);
    const tiles = [...selection.tiles].map(parseTileKey);
    applyTilePatch(level, tiles, patch);
    markDirty();
    setStatus(`Updated ${tiles.length} tile(s) · ${sectorCount(level)} sectors`);
    refreshAll();
  },
  onClear: () => {
    doClearTiles();
  },
  onSelectSector: () => {
    doSelectSector();
  },
});

const itemEditor = new ItemEditor(document.getElementById('item-editor'), {
  getItems: () => [...selection.items],
  onChange: (patch) => {
    const items = [...selection.items];
    for (const item of items) {
      if ('type' in patch) {
        if (isSpawn(item)) continue; // spawn type is fixed
        if (patch.type === SPAWN_TYPE) continue;
        if (patch.type === CAMERA_TYPE && !isCamera(item)) {
          item.type = CAMERA_TYPE;
          item.angle = 0;
          delete item.skills;
          delete item.switchAction;
          delete item.targetTag;
        } else if (patch.type === SWITCH_TYPE) {
          item.type = SWITCH_TYPE;
          item.switchAction = item.switchAction || defaultSwitchAction();
          item.targetTag = item.targetTag || '';
          delete item.skills;
          delete item.angle;
        } else if (patch.type !== CAMERA_TYPE && isCamera(item)) {
          item.type = patch.type;
          item.skills = defaultSkills();
          delete item.angle;
        } else if (isSwitch(item) && patch.type !== SWITCH_TYPE) {
          item.type = patch.type;
          item.skills = defaultSkills();
          delete item.switchAction;
          delete item.targetTag;
        } else {
          item.type = patch.type;
        }
      }
      if ('x' in patch) item.x = clampWorld(patch.x);
      if ('y' in patch) item.y = clampWorld(patch.y);
      if ('angle' in patch) item.angle = Number(patch.angle) || 0;
      if ('skillKey' in patch && item.skills) {
        item.skills = { ...item.skills, [patch.skillKey]: patch.skillValue };
      }
      if ('switchAction' in patch && isSwitch(item)) {
        item.switchAction = patch.switchAction;
      }
      if ('targetTag' in patch && isSwitch(item)) {
        item.targetTag = String(patch.targetTag ?? '').trim();
      }
    }
    markDirty();
    refreshEditors();
    mapView.draw();
    previewView.draw();
  },
  onDelete: () => {
    doDeleteItems();
  },
});

const mapView = new MapView(document.getElementById('map-canvas'), {
  getLevel: () => activeLevel(episode),
  getSelection: () => selection,
  images,
  stage: document.getElementById('map-stage'),
  onDropItem: (type, wx, wy) => {
    placeItem(type, wx, wy);
  },
  onPointer: (e, info) => {
    handlePointer(e, info);
  },
});

initShiftControls(
  document.getElementById('shift-controls'),
  (dx, dy) => {
    doShift(dx, dy);
  },
  (delta) => {
    doHeightNudge(delta);
  },
);

const previewHint = document.getElementById('preview-hint');
const previewRays = document.getElementById('preview-rays');
const previewColH = document.getElementById('preview-col-h');

function previewInt(el, fallback, lo, hi) {
  const n = Number(el.value);
  if (!Number.isFinite(n)) return fallback;
  return Math.max(lo, Math.min(hi, Math.round(n)));
}

const previewView = new PreviewView(document.getElementById('preview-canvas'), {
  getLevel: () => activeLevel(episode),
  getCamera: () => {
    const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
    return findPreviewCamera(activeLevel(episode), selected ?? null);
  },
  getRaycasts: () => previewInt(previewRays, 40, 8, 320),
  getColumnHeight: () => previewInt(previewColH, 25, 8, 240),
  images,
  onRotate: (angle) => {
    const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
    const cam = findPreviewCamera(activeLevel(episode), selected ?? null);
    if (!cam) return;
    cam.angle = angle;
    markDirty();
    if (selection.items.has(cam)) itemEditor.render();
    mapView.draw();
    previewView.draw();
  },
  onMove: (x, y) => {
    const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
    const cam = findPreviewCamera(activeLevel(episode), selected ?? null);
    if (!cam) return;
    // Keep fractional world coords while walking; |0 truncate made forward stick.
    cam.x = Math.max(0, Math.min(WORLD_MAX, x));
    cam.y = Math.max(0, Math.min(WORLD_MAX, y));
    markDirty();
    if (selection.items.has(cam)) itemEditor.render();
    mapView.draw();
    previewView.draw();
  },
});

function redrawPreview() {
  previewView.draw();
}

previewRays.addEventListener('change', redrawPreview);
previewColH.addEventListener('change', redrawPreview);
previewRays.addEventListener('input', redrawPreview);
previewColH.addEventListener('input', redrawPreview);

function updatePreviewHint() {
  const selected = [...selection.items].find((it) => isCamera(it) || isSpawn(it));
  const cam = findPreviewCamera(activeLevel(episode), selected ?? null);
  if (!cam) {
    previewHint.textContent = 'Place or select a camera';
    return;
  }
  if (selected && isSpawn(selected)) {
    previewHint.textContent = 'Spawn view — drag L/R to set angle · U/D to move';
  } else if (selected) {
    previewHint.textContent = 'Drag L/R to rotate · U/D to walk';
  } else if (isSpawn(cam)) {
    previewHint.textContent = 'Showing spawn — select spawn to edit angle';
  } else {
    previewHint.textContent = 'Showing first camera — select one to edit';
  }
}

function selectedTileList() {
  return [...selection.tiles].map(parseTileKey);
}

function brushProps() {
  const level = activeLevel(episode);
  if (selection.primaryTile) {
    const props = getTileProps(
      level,
      selection.primaryTile.tx,
      selection.primaryTile.ty,
    );
    if (props) return props;
  }
  for (const key of selection.tiles) {
    const { tx, ty } = parseTileKey(key);
    const props = getTileProps(level, tx, ty);
    if (props) return props;
  }
  return null;
}

function setTileSelection(tiles, primary = null) {
  selection.tiles = new Set(tiles.map(({ tx, ty }) => tileKey(tx, ty)));
  selection.primaryTile = primary || (tiles.length ? tiles[tiles.length - 1] : null);
}

function clearSelection() {
  selection.tiles.clear();
  selection.items.clear();
  selection.primaryTile = null;
  selection.hoverTile = null;
  selection.box = null;
  drag = null;
}

function refreshEditors() {
  tileEditor.render();
  itemEditor.render();
}

function refreshAll() {
  levelList.render();
  const label = document.getElementById('map-level-label');
  if (label) {
    const n = sectorCount(activeLevel(episode));
    label.textContent = `(${episode.activeLevel} · ${n} sector${n === 1 ? '' : 's'})`;
  }
  refreshEditors();
  updatePreviewHint();
  mapView.draw();
  previewView.draw();
}

function placeItem(type, wx, wy) {
  const level = activeLevel(episode);
  if (!EDITOR_ITEM_TYPES.includes(type)) return;
  if (type !== CAMERA_TYPE && type !== SPAWN_TYPE && gameItemCount(level) >= MAX_ITEMS) {
    setStatus(`Max ${MAX_ITEMS} items`, true);
    return;
  }
  const item = addItem(level, type, wx, wy);
  if (!item) {
    setStatus('Could not place item', true);
    return;
  }
  selection.tiles.clear();
  selection.primaryTile = null;
  selection.items = new Set([item]);
  markDirty();
  setStatus(type === SPAWN_TYPE ? 'Moved spawn' : `Placed ${type}`);
  refreshAll();
}

function doDeleteItems() {
  if (!selection.items.size) return;
  const level = activeLevel(episode);
  const toDelete = [...selection.items].filter((it) => !isSpawn(it));
  if (!toDelete.length) {
    setStatus('Spawn cannot be deleted', true);
    return;
  }
  for (const it of toDelete) removeItem(level, it);
  selection.items = new Set([...selection.items].filter((it) => isSpawn(it)));
  markDirty();
  setStatus(`Deleted ${toDelete.length} item(s)`);
  refreshAll();
}

function doClearTiles() {
  if (!selection.tiles.size) {
    setStatus('No tiles selected', true);
    return;
  }
  const level = activeLevel(episode);
  const tiles = selectedTileList();
  clearTiles(level, tiles);
  selection.tiles.clear();
  selection.primaryTile = null;
  markDirty();
  setStatus(`Cleared ${tiles.length} tile(s) · ${sectorCount(level)} sectors`);
  refreshAll();
}

function doSelectSector() {
  const level = activeLevel(episode);
  const primary = selection.primaryTile || selectedTileList()[0];
  if (!primary) {
    setStatus('Select a tile first', true);
    return;
  }
  const id = level.map[primary.ty * MAP_SIZE + primary.tx];
  if (!id) {
    setStatus('Selected tile has no sector', true);
    return;
  }
  const tiles = tilesInSector(level, id);
  setTileSelection(tiles, primary);
  selection.items.clear();
  setStatus(`Selected sector #${id} (${tiles.length} tiles)`);
  refreshAll();
}

function doShift(dx, dy) {
  const level = activeLevel(episode);
  const dir = dy < 0 ? 'up' : dy > 0 ? 'down' : dx < 0 ? 'left' : 'right';

  if (selection.tiles.size > 0) {
    const tiles = selectedTileList();
    const occupied = tiles.filter(({ tx, ty }) => level.map[ty * MAP_SIZE + tx] !== 0);
    const items = itemsInTiles(level, occupied);

    const moved = moveTiles(level, occupied, dx, dy);
    moveItemsBy(level, items, dx * WORLD_PER_TILE, dy * WORLD_PER_TILE);

    const nextTiles = new Set();
    for (const key of selection.tiles) {
      const { tx, ty } = parseTileKey(key);
      const ntx = tx + dx;
      const nty = ty + dy;
      if (ntx >= 0 && ntx < MAP_SIZE && nty >= 0 && nty < MAP_SIZE) {
        nextTiles.add(tileKey(ntx, nty));
      }
    }
    for (const t of moved) nextTiles.add(tileKey(t.tx, t.ty));
    selection.tiles = nextTiles;

    if (selection.primaryTile) {
      const ntx = selection.primaryTile.tx + dx;
      const nty = selection.primaryTile.ty + dy;
      selection.primaryTile =
        ntx >= 0 && ntx < MAP_SIZE && nty >= 0 && nty < MAP_SIZE
          ? { tx: ntx, ty: nty }
          : (nextTiles.size ? parseTileKey([...nextTiles][0]) : null);
    }

    for (const it of [...selection.items]) {
      if (!itemStillOnLevel(level, it)) selection.items.delete(it);
    }

    markDirty();
    setStatus(`Shifted selection ${dir} (${moved.length} tiles)`);
    refreshAll();
    return;
  }

  shiftLevel(level, dx, dy);

  for (const it of [...selection.items]) {
    if (!itemStillOnLevel(level, it)) selection.items.delete(it);
  }

  markDirty();
  setStatus(`Shifted map ${dir}`);
  refreshAll();
}

function doHeightNudge(delta) {
  const level = activeLevel(episode);
  const tiles =
    selection.tiles.size > 0 ? selectedTileList() : occupiedTiles(level);
  const before = tiles.filter(({ tx, ty }) => getTileProps(level, tx, ty));
  if (!before.length) {
    setStatus(selection.tiles.size ? 'No occupied tiles in selection' : 'Map is empty', true);
    return;
  }
  nudgeTileHeights(level, tiles, delta);
  markDirty();
  setStatus(
    `${delta > 0 ? 'Raised' : 'Lowered'} floor & ceiling on ${
      selection.tiles.size ? 'selection' : 'map'
    }`,
  );
  refreshAll();
}

function tilesInBox(x0, y0, x1, y1, occupiedOnly = true) {
  const level = activeLevel(episode);
  const minX = Math.min(x0, x1);
  const maxX = Math.max(x0, x1);
  const minY = Math.min(y0, y1);
  const maxY = Math.max(y0, y1);
  const out = [];
  for (let ty = minY; ty <= maxY; ty++) {
    for (let tx = minX; tx <= maxX; tx++) {
      if (occupiedOnly && level.map[ty * MAP_SIZE + tx] === 0) continue;
      out.push({ tx, ty });
    }
  }
  return out;
}

function applyBoxSelection(additive, startTx, startTy, endTx, endTy, baseTiles) {
  const boxed = tilesInBox(startTx, startTy, endTx, endTy, true);
  if (additive) {
    const next = new Set(baseTiles);
    for (const t of boxed) next.add(tileKey(t.tx, t.ty));
    selection.tiles = next;
    selection.primaryTile = boxed.length
      ? boxed[boxed.length - 1]
      : (next.size ? parseTileKey([...next][next.size - 1]) : null);
  } else {
    selection.items.clear();
    setTileSelection(boxed, boxed.length ? boxed[boxed.length - 1] : null);
  }
}

function startBoxSelect(info, additive) {
  drag = {
    mode: 'box',
    additive,
    startTx: info.tx,
    startTy: info.ty,
    startPx: info.px,
    startPy: info.py,
    lastTx: info.tx,
    lastTy: info.ty,
    lastWx: info.wx,
    lastWy: info.wy,
    moved: false,
    baseTiles: additive ? new Set(selection.tiles) : new Set(),
  };
  selection.box = { x0: info.tx, y0: info.ty, x1: info.tx, y1: info.ty };
}

function startDrag(info, mode) {
  drag = {
    mode,
    lastTx: info.tx,
    lastTy: info.ty,
    lastWx: info.wx,
    lastWy: info.wy,
  };
}

function handlePointer(e, info) {
  const level = activeLevel(episode);

  if (e.type === 'pointerleave') {
    selection.hoverTile = null;
    if (!drag) mapView.draw();
    return;
  }

  if (e.type === 'pointermove') {
    selection.hoverTile = { tx: info.tx, ty: info.ty };

    if (drag && (e.buttons & 1)) {
      if (drag.mode === 'box') {
        const dist = Math.hypot(info.px - drag.startPx, info.py - drag.startPy);
        if (dist > 4) drag.moved = true;
        drag.lastTx = info.tx;
        drag.lastTy = info.ty;
        selection.box = {
          x0: drag.startTx,
          y0: drag.startTy,
          x1: info.tx,
          y1: info.ty,
        };
        if (drag.moved) {
          applyBoxSelection(
            drag.additive,
            drag.startTx,
            drag.startTy,
            info.tx,
            info.ty,
            drag.baseTiles,
          );
        }
        refreshEditors();
        mapView.draw();
        return;
      }

      if (drag.mode === 'items') {
        const dx = info.wx - drag.lastWx;
        const dy = info.wy - drag.lastWy;
        if (dx || dy) {
          const kept = moveItemsBy(level, [...selection.items], dx, dy);
          selection.items = new Set(kept);
          drag.lastWx = info.wx;
          drag.lastWy = info.wy;
          markDirty();
          refreshEditors();
          mapView.draw();
          previewView.draw();
        }
      }
      return;
    }

    mapView.draw();
    return;
  }

  if (e.type === 'pointerup') {
    if (drag) {
      if (drag.mode === 'box') {
        const { additive, startTx, startTy, moved, baseTiles } = drag;
        selection.box = null;
        if (!moved) {
          // Plain click / ctrl+click
          const key = tileKey(startTx, startTy);
          if (additive) {
            if (selection.tiles.has(key)) {
              selection.tiles.delete(key);
              if (
                selection.primaryTile &&
                selection.primaryTile.tx === startTx &&
                selection.primaryTile.ty === startTy
              ) {
                selection.primaryTile = selection.tiles.size
                  ? parseTileKey([...selection.tiles][selection.tiles.size - 1])
                  : null;
              }
            } else {
              selection.tiles.add(key);
              selection.primaryTile = { tx: startTx, ty: startTy };
            }
          } else {
            selection.items.clear();
            setTileSelection([{ tx: startTx, ty: startTy }], { tx: startTx, ty: startTy });
          }
        } else {
          applyBoxSelection(additive, startTx, startTy, drag.lastTx, drag.lastTy, baseTiles);
        }
        drag = null;
        const n = sectorCount(level);
        setStatus(
          `Selection: ${selection.tiles.size} tile(s), ${selection.items.size} item(s) · ${n} sectors`,
        );
        refreshAll();
        return;
      }

      drag = null;
      const n = sectorCount(level);
      if (selection.tiles.size || selection.items.size) {
        setStatus(
          `Selection: ${selection.tiles.size} tile(s), ${selection.items.size} item(s) · ${n} sectors`,
        );
      }
      refreshAll();
    }
    return;
  }

  if (e.type !== 'pointerdown') return;

  try {
    e.currentTarget.setPointerCapture(e.pointerId);
  } catch (_) { /* ignore */ }

  // Shift+click: paint / add tile
  if (info.shift) {
    selection.items.clear();
    const brush = brushProps();
    if (!addTile(level, info.tx, info.ty, brush)) {
      setStatus('No free sector ids', true);
      return;
    }
    setTileSelection([{ tx: info.tx, ty: info.ty }], { tx: info.tx, ty: info.ty });
    markDirty();
    if (level._lastPaintNote) {
      setStatus(level._lastPaintNote, true);
    } else {
      setStatus(
        brush
          ? `Painted tile from selection · ${sectorCount(level)} sectors`
          : `Added default tile · ${sectorCount(level)} sectors`,
      );
    }
    refreshAll();
    return;
  }

  // Item hit — drag to reposition (tile selection uses Shift panel)
  if (info.item) {
    if (info.ctrl) {
      if (selection.items.has(info.item)) selection.items.delete(info.item);
      else selection.items.add(info.item);
    } else if (selection.items.has(info.item)) {
      // Keep multi-selection and start drag
    } else {
      selection.items = new Set([info.item]);
      selection.tiles.clear();
      selection.primaryTile = null;
    }
    startDrag(info, 'items');
    refreshEditors();
    updatePreviewHint();
    mapView.draw();
    previewView.draw();
    return;
  }

  // Ctrl+drag starts additive box select (click-toggle happens on pointerup if no move)
  if (info.ctrl) {
    startBoxSelect(info, true);
    refreshEditors();
    mapView.draw();
    return;
  }

  // Box select (click selects one tile on pointerup)
  startBoxSelect(info, false);
  refreshEditors();
  mapView.draw();
}

function nudgeTileSelection(dtx, dty) {
  const primary = selection.primaryTile || selectedTileList()[0];
  if (!primary) return;
  const tx = Math.max(0, Math.min(MAP_SIZE - 1, primary.tx + dtx));
  const ty = Math.max(0, Math.min(MAP_SIZE - 1, primary.ty + dty));
  if (tx === primary.tx && ty === primary.ty) return;
  selection.items.clear();
  setTileSelection([{ tx, ty }], { tx, ty });
  selection.primaryTile = { tx, ty };
  refreshEditors();
  updatePreviewHint();
  mapView.draw();
  previewView.draw();
}

document.addEventListener('keydown', (e) => {
  if (
    e.target instanceof HTMLInputElement ||
    e.target instanceof HTMLSelectElement ||
    e.target instanceof HTMLTextAreaElement
  ) {
    return;
  }

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (!selection.tiles.size && !selection.primaryTile) return;
    e.preventDefault();
    const dx = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
    const dy = e.key === 'ArrowUp' ? -1 : e.key === 'ArrowDown' ? 1 : 0;
    nudgeTileSelection(dx, dy);
    return;
  }

  if (e.key !== 'Delete' && e.key !== 'Backspace') return;
  e.preventDefault();
  if (selection.items.size) doDeleteItems();
  else if (selection.tiles.size) doClearTiles();
});

document.getElementById('btn-save').addEventListener('click', async () => {
  await saveNow('Saved');
});

function applyLoadedEpisode(loaded) {
  Object.assign(episode.levels, loaded.levels);
  if (loaded.activeLevel && episode.levels[loaded.activeLevel]) {
    episode.activeLevel = loaded.activeLevel;
  }
  clearSelection();
  /** @type {string[]} */
  const shapeNotes = [];
  for (const name of Object.keys(episode.levels)) {
    const lvl = episode.levels[name];
    if (lvl._loadWarnings?.length) {
      shapeNotes.push(...lvl._loadWarnings.map((w) => `${name}: ${w}`));
      delete lvl._loadWarnings;
    }
  }
  if (shapeNotes.length) {
    markDirty();
    setStatus(`Loaded ${episodeFileName()} — ${shapeNotes[0]}`, true);
  } else {
    markClean();
    setStatus(`Loaded ${episodeFileName()}`);
  }
  refreshAll();
}

function showFileAccessGate(storedHandle) {
  const overlay = document.createElement('div');
  overlay.className = 'file-gate';
  overlay.innerHTML = `
    <div class="file-gate-card" role="dialog" aria-modal="true" aria-labelledby="file-gate-title">
      <h2 id="file-gate-title">Open map file</h2>
      <p class="muted">
        ${
          storedHandle
            ? `Browser needs permission to read/write <strong>${storedHandle.name}</strong>.`
            : `Choose project file <strong>${EPISODE_FILE}</strong> (usually in the editor folder).`
        }
      </p>
      <div class="btn-row">
        <button type="button" class="file-gate-primary" id="file-gate-ok">
          ${storedHandle ? `Allow ${storedHandle.name}` : `Open ${EPISODE_FILE}…`}
        </button>
        ${storedHandle ? `<button type="button" id="file-gate-other">Choose different file…</button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  const ok = overlay.querySelector('#file-gate-ok');
  const other = overlay.querySelector('#file-gate-other');
  ok.focus();

  const finish = async (loader) => {
    ok.disabled = true;
    if (other) other.disabled = true;
    try {
      const loaded = await loader();
      if (!loaded) {
        ok.disabled = false;
        if (other) other.disabled = false;
        setStatus('Open cancelled', true);
        return;
      }
      overlay.remove();
      applyLoadedEpisode(loaded);
    } catch (err) {
      ok.disabled = false;
      if (other) other.disabled = false;
      setStatus(String(err.message || err), true);
    }
  };

  ok.addEventListener('click', () => {
    void finish(() =>
      storedHandle ? allowStoredEpisodeFile(storedHandle) : loadEpisodeJSON(),
    );
  });
  other?.addEventListener('click', () => {
    void finish(() => loadEpisodeJSON());
  });
}

document.getElementById('btn-load').addEventListener('click', async () => {
  try {
    const loaded = await loadEpisodeJSON();
    if (!loaded) return;
    applyLoadedEpisode(loaded);
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
});

document.getElementById('btn-cook').addEventListener('click', () => {
  const warnings = cookAndDownload(episode, episode.activeLevel);
  if (warnings?.length) {
    setStatus(`Cooked ${episode.activeLevel} — ${warnings[0]}`, true);
  } else {
    setStatus(`Cooked ${episode.activeLevel}`);
  }
});

async function boot() {
  updateDirtyIndicator();
  refreshAll();
  try {
    const loaded = await tryRestoreEpisodeFile();
    if (loaded) {
      applyLoadedEpisode(loaded);
      return;
    }
    const stored = await getStoredEpisodeHandle();
    showFileAccessGate(stored);
    setStatus(
      stored
        ? `Click Allow to open ${stored.name}`
        : `Open ${EPISODE_FILE} to edit the project map`,
      false,
    );
  } catch (err) {
    setStatus(String(err.message || err), true);
  }
}

boot();
})().catch((err) => {
  console.error(err);
  setStatus(String(err.message || err), true);
});

  </script>
