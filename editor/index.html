<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SquareDoom Map Editor</title>
  <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAgAAAAICAYAAADED76LAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAgY0hSTQAAeiYAAICEAAD6AAAAgOgAAHUwAADqYAAAOpgAABdwnLpRPAAAABl0RVh0U29mdHdhcmUAUGFpbnQuTkVUIHYzLjUuNUmK/OAAAABJSURBVChTY2RgYPgPxAz7zxWBKDhwNOqDs/8DJeEYpAHGh2kGC0A5GIpBRoMlkXUhi4EVoJuApgGhG9ktSJowHIXpSGQj0a0EACQ+faihsYgcAAAAAElFTkSuQmCC" />
  <style>
:root {
  --bg: #12141a;
  --panel: #1c1f28;
  --border: #2e3340;
  --text: #e4e6eb;
  --muted: #8b91a0;
  --accent: #d4a017;
  --danger: #c44;
  --btn: #2a3040;
  --btn-hover: #3a4258;
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  background: var(--bg);
  color: var(--text);
}

body {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

h1 {
  margin: 0;
  font-size: 1.15rem;
  letter-spacing: 0.04em;
  color: var(--accent);
}

h2 {
  margin: 0 0 0.5rem;
  font-size: 0.85rem;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 600;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 1rem;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--panel);
  flex-wrap: wrap;
  flex: 0 0 auto;
}

.toolbar-actions {
  display: flex;
  gap: 0.4rem;
}

.status {
  margin: 0;
  font-size: 0.8rem;
  color: var(--muted);
  flex: 1;
  text-align: right;
}

.status.error {
  color: #f88;
}

.file-gate {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: grid;
  place-items: center;
  background: rgba(0, 0, 0, 0.55);
  padding: 1rem;
}

.file-gate-card {
  width: min(22rem, 100%);
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 1.1rem 1.2rem 1.2rem;
}

.file-gate-card h2 {
  margin-bottom: 0.65rem;
  text-transform: none;
  letter-spacing: 0.02em;
  color: var(--text);
  font-size: 1rem;
}

.file-gate-card .muted {
  margin: 0 0 1rem;
  font-size: 0.85rem;
  line-height: 1.35;
}

.file-gate-card .btn-row {
  margin-top: 0;
}

.file-gate-primary {
  border-color: var(--accent);
  color: var(--accent);
}

.layout {
  display: grid;
  grid-template-columns: 200px 1fr 240px;
  gap: 0;
  flex: 1;
  min-height: 0;
}

.left,
.right {
  background: var(--panel);
  border-right: 1px solid var(--border);
  padding: 0.75rem;
  overflow-y: auto;
  min-height: 0;
}

.right {
  border-right: none;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0;
  padding-bottom: 0.75rem;
}

.right-editors {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 1rem;
  padding-bottom: 0.75rem;
}

.shift-controls {
  flex: 0 0 auto;
  margin-top: auto;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
}

.shift-row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0.5rem;
  margin: 0 auto 0.5rem;
}

.shift-pad {
  display: grid;
  grid-template-columns: repeat(3, 2rem);
  grid-template-rows: repeat(2, 2rem);
  gap: 4px;
}

.shift-height {
  display: grid;
  grid-template-rows: repeat(2, 2rem);
  gap: 4px;
}

.shift-btn.shift-up {
  grid-column: 2;
  grid-row: 1;
}

.shift-btn.shift-left {
  grid-column: 1;
  grid-row: 2;
}

.shift-btn.shift-down {
  grid-column: 2;
  grid-row: 2;
}

.shift-btn.shift-right {
  grid-column: 3;
  grid-row: 2;
}

.shift-btn {
  width: 2rem;
  height: 2rem;
  min-height: 0;
  padding: 0;
  font-size: 1rem;
  line-height: 1;
  display: grid;
  place-items: center;
}

.shift-btn.height {
  width: 2rem;
  height: 2rem;
}

.shift-controls .muted {
  margin: 0;
  font-size: 0.7rem;
  text-align: center;
}

.preview-panel {
  flex: 0 0 auto;
  padding: 0.75rem 0 0;
  border-top: 1px solid var(--border);
}

.preview-panel h2 {
  text-align: center;
}

.preview-frame {
  width: 100%;
  aspect-ratio: 4 / 3;
  border: 1px solid var(--border);
  background: #0a0a0c;
  overflow: hidden;
}

#preview-canvas {
  display: block;
  width: 100%;
  height: 100%;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
  image-rendering: pixelated;
  -ms-interpolation-mode: nearest-neighbor;
  background: #0a0a0c;
  cursor: grab;
  touch-action: none;
}

#preview-canvas:active {
  cursor: grabbing;
}

.preview-res {
  display: flex;
  gap: 0.75rem;
  margin: 0.45rem 0 0;
  font-size: 0.72rem;
  color: var(--muted);
}

.preview-res label {
  display: flex;
  align-items: center;
  gap: 0.35rem;
  flex: 1;
}

.preview-res input[type="number"] {
  width: 3.5rem;
  min-width: 0;
  padding: 0.2rem 0.3rem;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  font: inherit;
}

.preview-panel .muted {
  margin: 0.35rem 0 0;
  font-size: 0.7rem;
  text-align: center;
}

.center {
  padding: 0.75rem 1rem;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  min-height: 0;
  overflow: hidden;
}

.center > h2 {
  flex: 0 0 auto;
}

.map-stage {
  flex: 1;
  min-height: 0;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

#map-canvas {
  image-rendering: pixelated;
  cursor: crosshair;
  border: 1px solid var(--border);
  background: #0a0a0c;
  outline: none;
  display: block;
  max-width: 100%;
  max-height: 100%;
}

.hint {
  flex: 0 0 auto;
  font-size: 0.75rem;
  color: var(--muted);
  margin: 0.5rem 0 0;
  text-align: center;
}

button {
  background: var(--btn);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 0.35rem 0.65rem;
  font-size: 0.8rem;
  cursor: pointer;
  border-radius: 2px;
}

button:hover {
  background: var(--btn-hover);
}

button.active,
button.armed {
  border-color: var(--accent);
  color: var(--accent);
}

button.danger {
  border-color: var(--danger);
  color: #f99;
}

.level-list ul {
  list-style: none;
  margin: 0 0 1rem;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.level-list button {
  width: 100%;
  text-align: left;
}

.item-palette {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 4px;
}

.palette-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  padding: 4px;
  background: var(--bg);
  border: 1px solid var(--border);
  cursor: grab;
  font-size: 0.65rem;
  color: var(--muted);
  user-select: none;
}

.palette-item:active {
  cursor: grabbing;
}

.palette-item img {
  width: 24px;
  height: 24px;
  image-rendering: pixelated;
}

.panel .muted {
  color: var(--muted);
  font-size: 0.8rem;
}

.field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.5rem;
  margin-bottom: 0.4rem;
  font-size: 0.8rem;
}

.field > span {
  color: var(--muted);
  flex: 0 0 6.5rem;
  min-width: 6.5rem;
  white-space: nowrap;
}

.field input[type="number"],
.field input[type="text"],
.field select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.4rem;
  font-size: 0.85rem;
  width: auto;
  flex: 1 1 auto;
  min-width: 0;
}

.color-field {
  flex-direction: column;
  align-items: stretch;
  gap: 0.2rem;
}

.color-field > span {
  flex: none;
  min-width: 0;
}

.color-field .color-swatches {
  flex: none;
  width: 100%;
}

.color-swatches {
  display: flex;
  flex-wrap: nowrap;
  gap: 2px;
  width: 100%;
}

.swatch {
  flex: 1 1 0;
  width: auto;
  min-width: 0;
  height: 14px;
  aspect-ratio: auto;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 1px;
}

.swatch.selected {
  border-color: #fff;
  outline: 1px solid var(--accent);
  outline-offset: 0;
  z-index: 1;
}

.check-field {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 0.45rem;
}

.check-field input {
  width: auto;
  margin: 0;
  accent-color: var(--accent);
}

.field select {
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 0.3rem 0.4rem;
  font-size: 0.85rem;
}

.btn-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
  margin-top: 0.75rem;
}

.field.skills {
  align-items: center;
}

.skill-row {
  display: flex;
  flex-direction: row;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.5rem;
  flex: 1 1 auto;
  min-width: 0;
}

.skill-row label {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  font-size: 0.85rem;
  text-transform: capitalize;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  .left,
  .right {
    max-height: none;
    border: none;
    border-bottom: 1px solid var(--border);
  }
}

  </style>
</head>
<body>
  <header class="toolbar">
    <h1>SquareDoom</h1>
    <div class="toolbar-actions">
      <button type="button" id="btn-undo" title="Ctrl+Z" disabled>Undo</button>
      <button type="button" id="btn-redo" title="Ctrl+Y" disabled>Redo</button>
      <button type="button" id="btn-save">Save</button>
      <button type="button" id="btn-load">Load</button>
      <button type="button" id="btn-cook">Cook</button>
    </div>
    <p id="status" class="status" role="status"></p>
  </header>

  <main class="layout">
    <aside class="left">
      <section id="level-list"></section>
      <section>
        <h2>Items</h2>
        <div id="item-palette"></div>
      </section>
    </aside>

    <section class="center">
      <h2>Map <span id="map-level-label"></span></h2>
      <div class="map-stage" id="map-stage">
        <canvas id="map-canvas" tabindex="0"></canvas>
      </div>
      <p class="hint">
        Drag box select · Ctrl+drag add · Click select · Shift+click empty · Shift+Alt overwrite · Del clears · Ctrl+Z/Y undo/redo
      </p>
    </section>

    <aside class="right">
      <div class="right-editors">
        <div id="tile-editor"></div>
        <div id="item-editor"></div>
      </div>
      <div id="preview-panel" class="preview-panel panel">
        <h2>Camera preview</h2>
        <div class="preview-frame">
          <canvas id="preview-canvas" tabindex="0"></canvas>
        </div>
        <div class="preview-res">
          <label>
            Rays
            <input type="number" id="preview-rays" min="8" max="320" value="40" />
          </label>
          <label>
            Col H
            <input type="number" id="preview-col-h" min="8" max="240" value="25" />
          </label>
        </div>
        <p class="muted" id="preview-hint">Place or select a camera</p>
      </div>
      <div id="shift-controls"></div>
    </aside>
  </main>

/** Packed SEC_TYPE: action[4:0] | trigger[6:5] | single_shot[7] */
const TRIGGERS = [
  { id: 'none', name: 'None', value: 0 },

  { id: 'use', name: 'Use', value: 2 },

const ACTIONS = [

  { id: 'continue_stairs', name: 'Continue stairs', value: 8 },

const TRIGGER_BY_ID = Object.fromEntries(TRIGGERS.map((t) => [t.id, t]));
const ACTION_BY_ID = Object.fromEntries(ACTIONS.map((a) => [a.id, a]));
const TRIGGER_BY_VALUE = Object.fromEntries(TRIGGERS.map((t) => [t.value, t]));
const ACTION_BY_VALUE = Object.fromEntries(ACTIONS.map((a) => [a.value, a]));

function normalizeTrigger(id) {
  return TRIGGER_BY_ID[id] ? id : 'none';
}

function normalizeAction(id) {
  return ACTION_BY_ID[id] ? id : 'none';
}

function packSectorSpecial(trigger, singleShot, action) {
  const t = TRIGGER_BY_ID[normalizeTrigger(trigger)]?.value ?? 0;
  const a = ACTION_BY_ID[normalizeAction(action)]?.value ?? 0;
  return (a & 31) | ((t & 3) << 5) | (singleShot ? 0x80 : 0);
}

function unpackSectorSpecial(byte) {
  const b = (byte ?? 0) & 0xff;
  return {
    trigger: TRIGGER_BY_VALUE[(b >> 5) & 3]?.id ?? 'none',
    singleShot: !!(b & 0x80),
    action: ACTION_BY_VALUE[b & 31]?.id ?? 'none',
  };
}

/** Legacy Doom-style sectorType → trigger/action/singleShot (for JSON migration). */
function migrateLegacySectorType(sectorType, targetTag = '') {
  const t = (sectorType ?? 0) & 0xff;
  const hasTarget = String(targetTag || '').trim() !== '';
  switch (t) {
    case 18: // Door
      return { trigger: 'use', singleShot: false, action: 'open_door' };
    case 19: // Window
      return { trigger: 'none', singleShot: false, action: 'window' };
    case 20: // Elevator lower
      return {
        trigger: hasTarget ? 'walk_into' : 'use',
        singleShot: false,
        action: 'lower_floor',
      };
    case 21: // Elevator raise
      return {
        trigger: hasTarget ? 'walk_into' : 'use',
        singleShot: false,
        action: 'raise_floor',
      };
    case 22: // Start stairs
      return { trigger: 'walk_into', singleShot: true, action: 'raise_stairs' };
    case 23: // Continue stairs
      return { trigger: 'none', singleShot: false, action: 'continue_stairs' };
    case 10: // Door open 30s
      return { trigger: 'walk_into', singleShot: false, action: 'open_door_30s' };
    case 14: // Door open forever
      return { trigger: 'walk_into', singleShot: false, action: 'open_door_forever' };
    default:
      return { trigger: 'none', singleShot: false, action: 'none' };
  }
}

/** Legacy switchAction → sector fields (applied to sector under the switch). */
function migrateSwitchAction(switchAction) {
  const a = String(switchAction || '');
  if (a === 'end_level' || a === 'switch_endlevel') {
    return { trigger: 'switch', singleShot: false, action: 'end_level' };
  }
  if (a === 'open_door' || a === 'switch_opendoor') {
    return { trigger: 'switch', singleShot: false, action: 'open_door' };
  }
  if (a === 'lower_lift' || a === 'switch_lowerlift') {
    return { trigger: 'switch', singleShot: false, action: 'lower_floor' };
  }
  return null;
}

function isDoorSector(sector) {
  const a = normalizeAction(sector?.action);
  return a === 'open_door' || a === 'open_door_forever'
    || a === 'open_door_10s' || a === 'open_door_30s';
}

function isWindowSector(sector) {
  return normalizeAction(sector?.action) === 'window';
}

function isSwitchSector(sector) {
  return normalizeTrigger(sector?.trigger) === 'switch';
}

function isElevatorSector(sector) {
  const a = normalizeAction(sector?.action);
  return a === 'lower_floor' || a === 'lower_floor_15s'
    || a === 'lower_floor_forever' || a === 'raise_floor';
}

const ITEM_TYPES = [
  'spawn', 'soldier', 'imp', 'pinky', 'caco', 'baron', 'barrel',
  'health', 'shells', 'shotgun', 'chaingun', 'chainsaw', 'rocketlauncher',
  'greenarmor', 'bluearmor', 'backpack',

  'fireball',
  'plasmaball', 'rocket',
  'barexpl',
];

/** Spawn stays in ITEM_TYPES for typeId/gfx index 0; not placed in the item table. */
const SPAWN_TYPE = 'spawn';
const CAMERA_TYPE = 'camera';
const SWITCH_TYPE = 'switch';
/** Runtime-only (missile / death corpses); not placeable in the editor. */
const FIREBALL_TYPE = 'fireball';
const RUNTIME_ONLY_TYPES = new Set([
  'fireball', 'poscorpse', 'impcorpse', 'demoncorpse', 'baroncorpse',
  'plasmaball', 'rocket', 'barexpl',
  'switch', // sector trigger=switch; not a placeable prop
]);
/** Legacy cook type ids that map to SWITCH_TYPE. */
const LEGACY_SWITCH_COOK_TYPES = new Set([
  'switch_opendoor', 'switch_endlevel', 'switch_lowerlift',
]);

/** Types that allocate an mobj at level start (missile excluded). */
const ENEMY_TYPES = new Set(['soldier', 'imp', 'pinky', 'caco', 'baron']);

/** Palette + map placement (spawn is level.spawn; camera is editor-only). */
const EDITOR_ITEM_TYPES = [
  ...ITEM_TYPES.filter((t) => !RUNTIME_ONLY_TYPES.has(t)),
  CAMERA_TYPE,
];

function isGameItem(type) {
  return type !== CAMERA_TYPE && type !== SPAWN_TYPE && !isSwitchCookType(type);
}

function isCamera(item) {
  return item?.type === CAMERA_TYPE;
}

function isSpawn(item) {
  return item?.type === SPAWN_TYPE;
}

function isSwitchCookType(type) {
  return type === SWITCH_TYPE || LEGACY_SWITCH_COOK_TYPES.has(type);
}

function isSwitch(item) {
  return item?.type === SWITCH_TYPE || isSwitchCookType(item?.type);
}

/** Map legacy/cook type ids to a plain switch prop. */
function coerceSwitchItem(it) {
  if (!isSwitch(it) && !isSwitchCookType(it?.type)) return null;
  return {
    type: SWITCH_TYPE,
    x: it.x,
    y: it.y,
  };
}

/** Wrap radians into [0, 2π). */
function normalizeAngle(rad) {
  const t = Number(rad) || 0;
  const twoPi = Math.PI * 2;
  return ((t % twoPi) + twoPi) % twoPi;
}

/** Radians ↔ cooked playera byte (0..255 full circle). */
function angleToByte(rad) {
  const t = normalizeAngle(rad);
  return Math.round((t / (Math.PI * 2)) * 256) % 256;
}

function byteToAngle(b) {
  return ((b & 0xff) / 256) * Math.PI * 2;
}

function defaultSpawn() {
  return { type: SPAWN_TYPE, x: 128, y: 128, angle: 0 };
}

function gameItemCount(level) {
  return level.items.filter((it) => isGameItem(it.type)).length;
}

function enemyCount(level) {
  return level.items.filter((it) => ENEMY_TYPES.has(it.type)).length;
}

/** Pickups that count toward intermission item % (health…radsuit; not corpses). */
const STAT_ITEM_TYPES = new Set([
  'health', 'shells', 'shotgun', 'chaingun', 'chainsaw', 'rocketlauncher',
  'greenarmor', 'bluearmor', 'backpack',
  'redcard', 'bluecard', 'yellowcard',
  'soulsphere', 'radsuit',
]);

function statItemCount(level) {
  return level.items.filter((it) => STAT_ITEM_TYPES.has(it.type)).length;
}

/** Sectors with action secret (intermission secret % denominator). */
function secretCount(level) {
  let n = 0;
  for (const s of level.sectors.values()) {
    if (normalizeAction(s.action) === 'secret') n++;
  }
  return n;
}

function getSectorAtWorld(level, wx, wy) {
  const { tx, ty } = worldToTile(wx, wy);
  const id = getCell(level, tx, ty);
  if (!id || !level.sectors.has(id)) return null;
  return level.sectors.get(id);
}

/** Eye height for a camera at world coords: sector floor + 3. */
function getCameraEyeHeight(level, wx, wy) {
  const sector = getSectorAtWorld(level, wx, wy);
  return (sector?.floorHeight ?? 0) + 3;
}

/**
 * Preview viewpoint: selected spawn/camera, else first camera, else spawn.
 * @returns {{x:number,y:number,angle:number}|null}
 */
function findPreviewCamera(level, selectedItem) {
  if (isSpawn(selectedItem) || isCamera(selectedItem)) return selectedItem;
  return level.items.find((it) => isCamera(it)) ?? level.spawn ?? null;
}

/** Map markers: spawn first, then items (for hit-test topmost). */
function mapMarkers(level) {
  return level.spawn ? [level.spawn, ...level.items] : [...level.items];
}

function colorHex(index) {
  return C64_HEX[index & 15] || C64_HEX[0];
}

/** Normalize JSON colour (legacy name or 0–15) to a C64 index. */
function normalizeColor(value, fallback = 0) {
  if (typeof value === 'number' && Number.isFinite(value)) {
    return Math.max(0, Math.min(15, value | 0));
  }
  if (typeof value === 'string' && value in LEGACY_COLOR_TO_C64) {
    return LEGACY_COLOR_TO_C64[value];
  }
  const asNum = Number(value);
  if (Number.isFinite(asNum)) return Math.max(0, Math.min(15, asNum | 0));
  return fallback;
}

/** @deprecated use colorHex / normalizeColor */
const COLORS = C64_NAMES;
/** @deprecated use C64_HEX / colorHex */
const COLOR_HEX = Object.fromEntries(C64_NAMES.map((n, i) => [n, C64_HEX[i]]));

function colorIndex(value) {
  return normalizeColor(value, 0);
}

function defaultSector() {
  return {
    floorHeight: 8,
    ceilingHeight: 13,
